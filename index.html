<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>寶可夢文字冒險</title>
<style>
:root{
  --bg:#0d1210; --panel:#111a16; --line:#2c4a3a; --text:#c9f7d8; --dim:#6f9a84;
  --accent:#ffcb3c; --accent2:#5fd0ff; --danger:#ff6b6b; --good:#7ee787;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#0d1210; --panel:#111a16; --text:#c9f7d8; }
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:'Courier New',ui-monospace,monospace;
  display:flex; justify-content:center;
}
#app{
  width:100%; max-width:480px; min-height:100%;
  display:flex; flex-direction:column;
  border-left:1px solid var(--line); border-right:1px solid var(--line);
}
header{
  padding:14px 16px 10px; border-bottom:1px solid var(--line);
  position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5;
}
header .title{font-size:15px; letter-spacing:2px; color:var(--accent);}
header .sub{font-size:11px; color:var(--dim); margin-top:2px;}
#log{
  flex:1; padding:16px; white-space:pre-wrap; line-height:1.65; font-size:14px;
  overflow-x:auto;
}
#log .sys{color:var(--dim);}
#log .em{color:var(--accent);}
#log .good{color:var(--good);}
#log .bad{color:var(--danger);}
#log .hr{border-top:1px dashed var(--line); margin:10px 0;}
#bar{
  padding:8px 16px; font-size:12px; color:var(--dim); border-top:1px solid var(--line);
  display:flex; gap:14px; flex-wrap:wrap;
}
#opts{
  padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--line);
  background:var(--panel);
}
.opt{
  background:transparent; color:var(--text); border:1px solid var(--line);
  padding:11px 12px; font-family:inherit; font-size:14px; text-align:left;
  border-radius:2px; cursor:pointer;
}
.opt:active{background:#1a2a22;}
.opt .k{color:var(--accent2); margin-right:8px;}
.hpwrap{height:6px; background:#1a2a22; border-radius:3px; overflow:hidden; margin:2px 0 6px;}
.hpfill{height:100%; background:var(--good);}
.line{opacity:0; transform:translateY(4px); animation:lineIn .5s ease forwards;}
@keyframes lineIn{ to{opacity:1; transform:translateY(0);} }
#opts.pending .opt{opacity:0; pointer-events:none;}
#opts{transition:opacity .2s;}
#skipHint{font-size:11px; color:var(--dim); text-align:center; padding:4px 0 0;}
.shiny{color:#ff9ef5;}
.boss{color:#ff9d4d;}
.cover{ text-align:center; padding:22px 6px 10px; }
.pokeball{
  width:68px; height:68px; margin:0 auto 16px; border-radius:50%;
  background:linear-gradient(to bottom, #e0473f 0%, #e0473f 44%, #1a1a1a 44%, #1a1a1a 56%, #f2f2f2 56%, #f2f2f2 100%);
  border:3px solid #1a1a1a; position:relative; box-shadow:0 2px 10px rgba(0,0,0,.4);
}
.pokeball span{
  position:absolute; top:50%; left:50%; width:22px; height:22px; margin:-11px 0 0 -11px;
  background:#f2f2f2; border:3px solid #1a1a1a; border-radius:50%; box-sizing:border-box;
}
.cover-title{ font-size:23px; letter-spacing:5px; color:var(--accent); margin-bottom:6px; }
.cover-sub{ font-size:12px; color:var(--accent2); letter-spacing:2px; margin-bottom:12px; }
.cover-tagline{ font-size:12px; color:var(--dim); line-height:1.7; max-width:320px; margin:0 auto; }
.intro-h{ color:var(--good); }

#opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));}
.opt{grid-column:1/-1;padding:9px 10px;font-size:13px;line-height:1.35;border-radius:8px;}
.opt.half{grid-column:span 2;}
.opt.q{grid-column:span 1;text-align:center;padding:10px 2px;}
.mvpp{flex-basis:100%;font-size:13px;font-weight:bold;color:var(--accent2);}
.mvpp.low{color:var(--accent);}
.mvpp.zero{color:var(--danger);}
#app.battle #skipHint{display:none;}
#menuBtn{white-space:nowrap;}
header .title{white-space:nowrap;}
#skipHint{grid-column:1/-1;}
.opt .sub{display:block;font-size:11px;color:var(--dim);}
.opt.mv{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 6px;}
.mvn{font-weight:bold;font-size:14px;}
.mvt{font-size:11px;padding:1px 8px;border-radius:9px;color:#fff;}
.mvp{flex-basis:100%;font-size:11px;color:var(--dim);}
#stage{display:none;flex-direction:column;gap:14px;margin:12px 12px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:#0f1613;}
#app.battle #stage{display:flex;}
#app.battle #bar{display:none;}
#app.battle #log{flex:none;margin:10px 12px 0;min-height:84px;max-height:30vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:#0b0f0d;padding:10px 14px;}
.card{width:66%;padding:8px 12px;border-radius:8px;border:3px solid;}
.card.foe{align-self:flex-end;background:#ffe9ec;border-color:#ef5350;color:#b71c1c;}
.card.me{align-self:flex-start;background:#dff6f8;border-color:#26c6da;color:#00838f;}
.card .r1{display:flex;justify-content:space-between;font-weight:bold;font-size:15px;}
.card .r2{font-size:11px;opacity:.75;margin:2px 0 5px;}
.card .bar{height:8px;border-radius:4px;background:rgba(0,0,0,.14);overflow:hidden;}
.card .bar i{display:block;height:100%;background:#4caf50;}
.card .bar.low i{background:#e53935;}
.card .hpt{text-align:right;font-size:12px;margin-top:3px;}
.card .xp{height:4px;border-radius:2px;background:rgba(0,0,0,.1);margin-top:3px;overflow:hidden;}
.card .xp i{display:block;height:100%;background:#4fc3f7;}
#turnbar{display:none;justify-content:center;gap:34px;padding:12px;color:var(--dim);font-size:12px;text-align:center;}
#turnbar b{color:var(--text);font-size:16px;}
#app.battle #turnbar{display:flex;}

header{display:flex;justify-content:space-between;align-items:center;gap:8px;}
#menuBtn{position:relative;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:13px;cursor:pointer;}
#menuDot{display:none;position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--danger);}
#menuDot.on{display:block;}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;align-items:center;justify-content:center;padding:14px;}
#modal.open{display:flex;}
.mbox{width:100%;max-width:460px;max-height:86vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.mhead{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);}
.mhead .tab{flex:1;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;font-size:13px;}
.mhead .tab.on{background:#1f3a2c;border-color:var(--accent2);}
.mhead .x{background:transparent;color:var(--dim);border:none;font-size:18px;padding:0 8px;}
#mbody{padding:12px;overflow-y:auto;font-size:13px;line-height:1.5;}
.qi{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;}
.qi.done{border-color:var(--good);}
.qi small{color:var(--dim);display:block;}
.qbar{height:5px;background:#1a2a22;border-radius:3px;margin:6px 0;overflow:hidden;}
.qbar i{display:block;height:100%;background:var(--accent2);}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.claim{background:var(--good);color:#0d1210;border:none;border-radius:6px;padding:5px 12px;font-family:inherit;font-size:12px;font-weight:bold;}
.mh{color:var(--accent);margin:4px 0 8px;}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f3a2c;border:1px solid var(--good);color:var(--text);padding:8px 14px;border-radius:20px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;}
#toast.on{opacity:1;}
.opt.off{opacity:.38;}

/* ---- 圓角統一 ---- */
#app{border:1px solid var(--line);border-radius:24px;}
header{border-radius:24px 24px 0 0;}
#bar{margin:0 12px 8px;border:1px solid var(--line);border-radius:16px;background:var(--panel);}
#opts{margin:0 12px 12px;border:1px solid var(--line);border-radius:20px;}
.opt{border-radius:14px;}
#menuBtn{border-radius:14px;}
#stage{border-radius:20px;}
#app.battle #log{border-radius:16px;}
.card{border-radius:16px;}
.card .bar{border-radius:6px;}
.card .xp{border-radius:4px;}
.mbox{border-radius:24px;}
.mhead .tab{border-radius:14px;}
.qi{border-radius:16px;}
.qbar{border-radius:6px;}
.claim{border-radius:12px;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px;}
.cal .wd{text-align:center;color:var(--dim);font-size:11px;}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--dim);}
.day.on{background:#1f3a2c;border-color:var(--good);color:var(--good);}
.day.today{border-color:var(--accent);color:var(--accent);border-width:2px;}
.day.blank{border:none;}
.bigclaim{width:100%;padding:11px;border:none;border-radius:16px;background:var(--good);color:#0d1210;font-family:inherit;font-size:14px;font-weight:bold;margin-bottom:12px;}
.bigclaim.off{background:#1a2a22;color:var(--dim);}
/* ---- 立體按鈕：底部厚度，按下去會沉 ---- */
.opt, #menuBtn, .claim, .bigclaim, .mhead .tab{
  position:relative; transition:transform .06s, box-shadow .06s;
  box-shadow:0 4px 0 #07100b, 0 5px 8px rgba(0,0,0,.35);
}
.opt{ background:linear-gradient(#17261e,#111b16); margin-bottom:2px; }
.opt:active, #menuBtn:active, .claim:active, .bigclaim:active, .mhead .tab:active{
  transform:translateY(3px); box-shadow:0 1px 0 #07100b, 0 1px 3px rgba(0,0,0,.35);
}
.opt:active{ background:linear-gradient(#111b16,#17261e); }
.opt.off, .opt.off:active, .bigclaim.off{ transform:none; box-shadow:0 2px 0 #07100b; }
#opts{ gap:9px 7px; }
/* ---- 立體按鍵 ---- */
.opt,#menuBtn,.mhead .tab{
  background:linear-gradient(#27392f,#1a2a22);
  border:1px solid #3d6650;
  box-shadow:0 5px 0 #0a120e, 0 8px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .08s, box-shadow .08s;
  -webkit-tap-highlight-color:transparent;
}
.opt:active,.opt.pressed,#menuBtn:active,#menuBtn.pressed,
.mhead .tab:active,.mhead .tab.pressed{
  transform:translateY(4px);
  background:linear-gradient(#1a2a22,#1f3328);
  box-shadow:0 1px 0 #0a120e, 0 2px 3px rgba(0,0,0,.4), inset 0 2px 5px rgba(0,0,0,.4);
}
.mhead .tab.on{background:#1f3a2c;}
.claim,.bigclaim:not(.off){
  background:linear-gradient(#95f09d,#5fc86a);
  box-shadow:0 4px 0 #2f7a3a;
  transition:transform .08s, box-shadow .08s;
}
.claim:active,.claim.pressed,.bigclaim:active,.bigclaim.pressed{
  transform:translateY(3px); box-shadow:0 1px 0 #2f7a3a;
}
@keyframes btnRebound{
  0%{transform:translateY(4px);box-shadow:0 1px 0 #0a120e,0 2px 3px rgba(0,0,0,.4)}
  40%{transform:translateY(-3px);box-shadow:0 8px 0 #0a120e,0 11px 12px rgba(0,0,0,.35)}
  70%{transform:translateY(1px);box-shadow:0 4px 0 #0a120e,0 6px 8px rgba(0,0,0,.4)}
  100%{transform:translateY(0);box-shadow:0 5px 0 #0a120e,0 8px 10px rgba(0,0,0,.4)}
}
.opt.bounce,#menuBtn.bounce,.mhead .tab.bounce,.claim.bounce,.bigclaim.bounce{animation:btnRebound .24s ease-out;}
#opts{gap:11px 6px;}

</style>
</head>
<body>
<div id="app">
  <header>
    <div><div class="title">◆ 寶可夢文字冒險</div>
    <div class="sub" id="hdrsub">關都・城都 · 全國圖鑑 251 隻</div></div>
    <button id="menuBtn" onclick="openMenu()">☰ 選單<i id="menuDot"></i></button>
  </header>
  <div id="stage"></div>
  <div id="log"></div>
  <div id="bar"></div>
  <div id="opts"></div>
  <div id="turnbar"></div>
  <div id="modal" onclick="if(event.target===this)closeMenu()"><div class="mbox">
    <div class="mhead"><button class="tab" id="tabQuest" onclick="openMenu('quest')">📜 任務</button><button class="tab" id="tabAch" onclick="openMenu('ach')">🏆 成就</button><button class="tab" id="tabCheckin" onclick="openMenu('checkin')">📅 簽到</button><button class="x" onclick="closeMenu()">✕</button></div>
    <div id="mbody"></div></div></div>
  <div id="toast"></div>
</div>

<script src="data.js"></script>
<script>
function eff(atkType, defTypes){
  let m = 1;
  const c = CHART[atkType];
  if(!c) return m;
  for(const t of defTypes){
    if(!t) continue;
    if(c.n && c.n.includes(t)) return 0;
    if(c.s.includes(t)) m *= 2;
    if(c.w.includes(t)) m *= 0.5;
  }
  return m;
}

/* ---------- CONSTANTS ---------- */
const MAX_LEVEL = 100;
const SHINY_RATE = 1/1024;
const START_MONEY = 500;
const TOWER_EXP_MUL = 1.5;
const BOSS_LEVEL_BONUS = 5;
const ENDLESS_STAT_STEP = 0.1; // 無盡小魔王每一輪能力 +10%

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function monName(m){ return (m.shiny ? '✨' : '') + m.name; }
function nm(m){ return m.shiny ? `<span class="shiny">${esc(monName(m))}</span>` : esc(m.name); }

function applyMoveEffect(atkMon, defMon, move){
  const fx = STATUS_FX[move.type];
  if(!fx || Math.random() > fx.chance) return '';
  switch(fx.kind){
    case 'burn': if(defMon.status) return ''; defMon.status='burn'; return `<span class="bad">${nm(defMon)} 陷入了灼傷！</span>`;
    case 'poison': if(defMon.status) return ''; defMon.status='poison'; return `<span class="bad">${nm(defMon)} 中毒了！</span>`;
    case 'paralyze': if(defMon.status) return ''; defMon.status='paralyze'; return `<span class="bad">${nm(defMon)} 被麻痺了！</span>`;
    case 'atkDown': defMon.atkMul = Math.max(0.4, (defMon.atkMul||1)*0.75); return `<span class="bad">${nm(defMon)} 的攻擊下降了！</span>`;
    case 'defDown': defMon.defMul = Math.max(0.4, (defMon.defMul||1)*0.75); return `<span class="bad">${nm(defMon)} 的防禦下降了！</span>`;
    case 'selfDefUp': atkMon.defMul = Math.min(2, (atkMon.defMul||1)*1.3); return `<span class="good">${nm(atkMon)} 的防禦提升了！</span>`;
  }
  return '';
}
function tickStatus(mon){
  if(!mon.status || mon.hp<=0) return '';
  if(mon.status==='poison'){ const d=Math.max(1,Math.floor(mon.maxhp/8)); mon.hp=Math.max(0,mon.hp-d); return `<span class="bad">${nm(mon)} 因中毒損失了 ${d} 點HP。</span>`; }
  if(mon.status==='burn'){ const d=Math.max(1,Math.floor(mon.maxhp/16)); mon.hp=Math.max(0,mon.hp-d); return `<span class="bad">${nm(mon)} 因灼傷損失了 ${d} 點HP。</span>`; }
  return '';
}
function buildMoves(entry){
  const t1=entry[1], t2=entry[2];
  const m1 = MOVES[t1] || MOVES["一般"];
  const fourth = t2 ? {name:(MOVES[t2]||MOVES["一般"]).q, type:t2, power:45, pp:25, maxpp:25}
                     : {name:"捨身衝撞", type:"一般", power:65, recoil:0.25, pp:15, maxpp:15};
  return [
    {name:"撞擊", type:"一般", power:40, pp:35, maxpp:35},
    {name:m1.q, type:t1, power:45, pp:25, maxpp:25},
    fourth,
    {name:m1.s, type:t1, power:75, pp:10, maxpp:10}
  ];
}
function statsFor(entry, level){
  const tier = entry[3];
  const base = 28 + tier*11;
  const hp = Math.floor(base*1.7 + level*4.4);
  const atk = Math.floor(base*0.9 + level*1.7);
  const def = Math.floor(base*0.8 + level*1.5);
  const spd = Math.floor(base*0.75 + level*1.3);
  return {hp,atk,def,spd};
}
function makeMon(dexIndex, level, opts){
  opts = opts || {};
  level = Math.max(1, Math.min(MAX_LEVEL, level));
  const e = DEX[dexIndex];
  const st = statsFor(e, level);
  const shiny = (opts.shiny !== undefined) ? opts.shiny : (Math.random() < SHINY_RATE);
  return {
    dex: dexIndex, name:e[0], t1:e[1], t2:e[2], tier:e[3],
    level, hp:st.hp, maxhp:st.hp, atk:st.atk, def:st.def, spd:st.spd,
    exp:0, expNext: 18 + level*9, moves: buildMoves(e),
    status:null, atkMul:1, defMul:1, shiny
  };
}
const STRUGGLE = {name:'掙扎', type:'一般', power:50, recoil:0.25, struggle:true};
function restorePP(m){ (m.moves||[]).forEach(mv=>{ if(mv.maxpp) mv.pp = mv.maxpp; }); }
function typesOf(m){ return [m.t1, m.t2]; }
function typeStr(m){ return m.t2 ? m.t1+"／"+m.t2 : m.t1; }
function isFinalForm(dexIdx){ return !EVO[dexIdx] && !STONE_EVO[dexIdx] && !TIME_EVO[dexIdx]; }

/* ---------- TOWER MODE ---------- */
const LEGENDARIES = [143,144,145,149,150, 242,243,244,248,249,250]; // 急凍鳥 閃電鳥 火焰鳥 超夢 夢幻 雷公 炎帝 水君 洛奇亞 鳳王 時拉比
const NONLEG = []; for(let i=0;i<DEX.length;i++){ if(!LEGENDARIES.includes(i)) NONLEG.push(i); }
const BOSSES = NONLEG.filter(isFinalForm); // 最終進化型（含無進化的單一型態），全破後的無盡循環名單
const COIN_COST = 50;
const LEGENDARY_COST = [50,50,60,90,150, 80,80,80,120,120,200];
// 幻之寶可夢（夢幻=第一世代、時拉比=第二世代）：需清空該世代的普通樓層＋第二輪小魔王（無等級限制）
const MYTHIC_GEN = {4:1, 10:2}; // 神獸順序編號 -> 世代
const GEN_SPLIT = 151;          // 圖鑑編號 0~150 為第一世代
function isMythicPtr(ptr){ return MYTHIC_GEN[ptr] !== undefined; }
const ROUND2_MUL = 1.3, ROUND2_HP_MUL = 1.8; // 第二輪小魔王：能力 ×1.3、HP ×1.8，之後每多一輪再加強
function genProgress(gen){
  const t = state.tower, inGen = i => gen===1 ? i<GEN_SPLIT : i>=GEN_SPLIT;
  const floors = NONLEG.filter(inGen), bosses = BOSSES.filter(inGen);
  const floorsDone = Math.max(0, Math.min(floors.length, t.floorPtr - NONLEG.indexOf(floors[0])));
  const bossDone = t.loop>=1 ? bosses.length : Math.max(0, Math.min(bosses.length, t.endlessPtr - BOSSES.indexOf(bosses[0])));
  return {floorsDone, floorsTotal:floors.length, bossDone, bossTotal:bosses.length};
}
function isBossFloor(ptr){ return ptr >= NONLEG.length || isFinalForm(NONLEG[ptr]); }
// 本段（進化鏈）第一層：往回找到上一個小魔王之後那一層
function segmentStart(ptr){
  if(ptr >= NONLEG.length) return ptr;
  let s = ptr;
  while(s > 0 && !isFinalForm(NONLEG[s-1])) s--;
  return s;
}
function atSegmentStart(){ return state.tower.floorPtr === segmentStart(state.tower.floorPtr); }
function segmentBossName(){
  let p = state.tower.floorPtr;
  while(p < NONLEG.length && !isFinalForm(NONLEG[p])) p++;
  return p < NONLEG.length ? DEX[NONLEG[p]][0] : '';
}
function legendaryGate(ptr){
  const cost = LEGENDARY_COST[ptr] ?? COIN_COST;
  const coinsOk = state.tower.coins >= cost;
  if(!isMythicPtr(ptr)) return { ok: coinsOk, cost, coinsOk, floorsOk:true, bossOk:true };
  const gen = MYTHIC_GEN[ptr], gp = genProgress(gen);
  const floorsOk = gp.floorsDone >= gp.floorsTotal, bossOk = gp.bossDone >= gp.bossTotal;
  return { ok: coinsOk && floorsOk && bossOk, cost, coinsOk, floorsOk, bossOk, gp, gen };
}

function towerFloorLevel(ptr){ return Math.min(MAX_LEVEL, 6 + Math.floor(ptr*1.15)); }
function legendaryLevel(ptr){ return Math.min(MAX_LEVEL, ptr < 5 ? 48 + ptr*12 : 62 + (ptr-5)*7); }
function endlessMul(){ return ROUND2_MUL + state.tower.loop * ENDLESS_STAT_STEP; }
function endlessHpMul(){ return ROUND2_HP_MUL + state.tower.loop * 0.2; }

function totalBalls(){ return BALL_KEYS.reduce((a,k)=>a+(state.bag[k]||0),0); }
function defaultBag(){ return {pokeball:5, greatball:0, ultraball:0, masterball:0, potion:3, superpotion:0, maxpotion:0, ether:0, antidote:2, burnheal:2, paralyzeheal:2, firestone:0, waterstone:0, thunderstone:0, leafstone:0, moonstone:0, sunstone:0}; }
function defaultTower(){ return {rev:3, floorPtr:0, coinPtr:0, coins:0, legendaryPtr:0, endlessPtr:0, loop:0, inTower:false}; }

function pctHp(m){ return Math.max(0, Math.round(100*m.hp/m.maxhp)); }
function stChip(m){ const t={burn:'🔥灼傷',poison:'☠️中毒',paralyze:'⚡麻痺'}[m.status]; return t ? ' · '+t : ''; }
// 對戰卡片：at = 幾毫秒後才更新（讓血條跟著文字一起變），換了寶可夢則立即更新
let stageTimers = [], stageLatest = null, stageKey = null;
function flushStage(){ stageTimers.forEach(clearTimeout); stageTimers = []; if(stageLatest){ stageLatest(); stageLatest = null; } }
function renderStage(at){
  const b=state.battle, p=state.party[b.playerIdx], w=b.wild;
  const nmx = m => (m.shiny?'✨':'')+esc(m.name);
  const xp = p.level>=MAX_LEVEL ? 100 : Math.min(100, Math.round(100*p.exp/p.expNext));
  const html =
    `<div class="card foe"><div class="r1"><span>${nmx(w)}</span><span>Lv.${w.level}</span></div><div class="r2">#${String(w.dex+1).padStart(4,'0')} · ${esc(typeStr(w))}${stChip(w)}${b.foes&&b.foes.length?` · 還有 ${b.foes.length} 隻`:''}</div><div class="bar${pctHp(w)<30?' low':''}"><i style="width:${pctHp(w)}%"></i></div></div>`+
    `<div class="card me"><div class="r1"><span>${nmx(p)}</span><span>Lv.${p.level}</span></div><div class="r2">${esc(typeStr(p))} · 速度 ${p.spd}${stChip(p)}</div><div class="bar${pctHp(p)<30?' low':''}"><i style="width:${pctHp(p)}%"></i></div><div class="hpt">HP: ${p.hp}/${p.maxhp}</div><div class="xp"><i style="width:${xp}%"></i></div></div>`;
  const turnHtml = `<div>回合<br><b>${b.turn||1}</b></div><div>狀態<br><b>${b.phase||'選擇行動'}</b></div>`;
  const apply = ()=>{ stageEl.innerHTML = html; turnEl.innerHTML = turnHtml; if(stageLatest===apply) stageLatest=null; };
  const fresh = stageKey && (stageKey[0]!==w || stageKey[1]!==p);
  stageKey = [w,p];
  if(!at || at<=0 || fresh || !stageEl.innerHTML){ apply(); return; }
  stageLatest = apply;
  stageTimers.push(setTimeout(apply, at));
}
function syncBattleUI(phase){
  const b=state.battle;
  if(b && state.party[b.playerIdx]){ if(phase) b.phase=phase; appEl.classList.add('battle'); renderStage(curDelay()); }
  else appEl.classList.remove('battle');
}

const LINE_DELAY = 260;
const ATTACK_GAP = 1000; // 雙方出招之間多停一下
let lineCount = 0, extraDelay = 0;
function curDelay(){ return lineCount*LINE_DELAY + extraDelay; }
function gap(ms){ extraDelay += ms; }
let pendingTimer = null;
function print(html){
  const div = document.createElement('div');
  div.className = 'line';
  div.style.animationDelay = curDelay()+'ms';
  div.innerHTML = html;
  logEl.appendChild(div);
  lineCount++;
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog(){ flushStage(); logEl.innerHTML=""; lineCount=0; extraDelay=0; }
function hr(){ print('<div class="hr"></div>'); }
function holdOptionsUntilRevealed(){
  optsEl.classList.add('pending');
  if(pendingTimer) clearTimeout(pendingTimer);
  const wait = Math.max(0, curDelay());
  pendingTimer = setTimeout(()=>optsEl.classList.remove('pending'), wait);
}
logEl.addEventListener('click', ()=>{
  document.querySelectorAll('#log .line').forEach(el=>el.style.animationDelay='0ms');
  if(pendingTimer) clearTimeout(pendingTimer);
  optsEl.classList.remove('pending');
  flushStage();
});

function renderBar(){
  const lead = state.party[0];
  const money = `<span>💰 ${state.money}</span><span>🪙 ${state.tower.coins}</span>`;
  barEl.innerHTML = lead
    ? `<span>📍 ${zoneName(state.zone)}</span><span>隊長: ${esc(monName(lead))} Lv.${lead.level} HP ${lead.hp}/${lead.maxhp}</span><span>圖鑑 ${state.caught.size}/${DEX.length}</span><span>球 x${totalBalls()}</span>${money}`
    : `<span>圖鑑 ${state.caught.size}/${DEX.length}</span>`;
}
function setOptions(list, phase){
  syncBattleUI(phase);
  refreshMenuDot();
  holdOptionsUntilRevealed();
  optsEl.innerHTML = "";
  list.forEach(o=>{
    const b = document.createElement('button');
    b.className = 'opt' + (o.half?' half':'') + (o.cls?' '+o.cls:'');

    b.onclick = o.action;

  });

  hint.id = 'skipHint';

}

/* ---------- SAVE / LOAD ---------- */
const SAVE_KEY = 'pkmn_tower_save_v2';
const OLD_SAVE_KEY = 'pkmn_tower_save_v1';
function saveGame(){
  try{
    const data = {
      v:2, party:state.party, box:state.box,
      seen:Array.from(state.seen), caught:Array.from(state.caught), shinyCaught:Array.from(state.shinyCaught),
      bag:state.bag, money:state.money, zone:state.zone, tower:state.tower,
      stats:state.stats, quest:state.quest, ach:state.ach, meta:state.meta, checkin:state.checkin
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  }catch(e){ return false; }
}
function fixMon(m){
  if(!m) return m;
  const fixed = Object.assign({status:null, atkMul:1, defMul:1, shiny:false}, m);
  if(!Array.isArray(fixed.moves) || fixed.moves.length!==4){ fixed.moves = buildMoves(DEX[fixed.dex]); }
  fixed.moves.forEach((mv,i)=>{ if(mv.maxpp===undefined){ mv.maxpp = i===0?35 : i===3?10 : mv.recoil?15 : 25; mv.pp = mv.maxpp; } });
  if(fixed.level > MAX_LEVEL) fixed.level = MAX_LEVEL;
  if(fixed.level >= MAX_LEVEL) fixed.exp = 0;
  return fixed;
}
function loadGame(){
  try{
    let raw = localStorage.getItem(SAVE_KEY);
    if(!raw) raw = localStorage.getItem(OLD_SAVE_KEY); // 舊版存檔自動轉移
    if(!raw) return false;
    const d = JSON.parse(raw);
    state.party = Array.isArray(d.party) ? d.party.map(fixMon) : [];
    state.box = Array.isArray(d.box) ? d.box.map(fixMon) : [];
    state.seen = new Set(d.seen||[]);
    state.caught = new Set(d.caught||[]);
    state.shinyCaught = new Set(d.shinyCaught||[]);
    state.bag = Object.assign(defaultBag(), d.bag||{});
    state.money = (typeof d.money === 'number') ? d.money : START_MONEY;
    state.zone = d.zone || 1;
    const oldTower = !(d.tower && d.tower.rev);
    state.tower = Object.assign(defaultTower(), d.tower||{});
    if(!(d.tower && d.tower.coinPtr!==undefined)) state.tower.coinPtr = state.tower.floorPtr; // 舊存檔：已通過的樓層視為已領過硬幣
    state.meta = Object.assign(defaultMeta(), d.meta||{});
    state.checkin = Object.assign({ym:'',days:[]}, d.checkin||{});
    state.stats = Object.assign({}, d.stats||{});
    state.quest = Object.assign({base:{}}, d.quest||{});
    state.ach = Object.assign({done:[],claimed:[]}, d.ach||{});
    if(oldTower){ state.tower.rev = 3; state.tower.endlessPtr = 0; state.tower.loop = 0; } // 舊版無盡進度與新規則不相容，重置
    return state.party.length>0;
  }catch(e){ return false; }
}
function resetGame(){
  try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(OLD_SAVE_KEY); }catch(e){}
  state.party=[]; state.box=[]; state.seen=new Set(); state.caught=new Set(); state.shinyCaught=new Set();
  state.bag=defaultBag(); state.money=START_MONEY; state.zone=1; state.battle=null;
  state.tower=defaultTower();
  state.stats={}; state.quest={base:{}}; state.ach={done:[],claimed:[]}; state.meta=defaultMeta(); state.checkin={ym:'',days:[]};
  screenTitle();
}

function fullHeal(){ state.party.forEach(m=>{ m.hp=m.maxhp; m.status=null; m.atkMul=1; m.defMul=1; restorePP(m); }); }
function healAll(returnTo){
  const mt = state.meta;
  if(mt.cd > 0 && !noAlive()){
    clearLog(); print(`<span class="bad">補給站還在整備中……要再打完 ${mt.cd} 場戰鬥才能使用。</span>`);
    return (returnTo||screenField)();
  }
  fullHeal(); mt.cd = 2;
  clearLog();
  print('<span class="good">補給站的護士治好了你隊伍中所有寶可夢！（再打完 2 場戰鬥才能再次使用）</span>');
  (returnTo||screenField)();
}
function noAlive(){ return state.party.length===0 || !state.party.some(m=>m.hp>0); }
function announceShiny(w){
  if(w.shiny) print('<span class="shiny">✨ 閃閃發光！是色違的寶可夢！</span>');
}
function encounter(){
  if(noAlive()){
    clearLog();
    print('<span class="bad">你的隊伍已經沒有能戰鬥的寶可夢了，先去補給站治療吧。</span>');
    screenField(); return;
  }
  if(Math.random() < 0.12) return findItem();
  const mt = state.meta; mt.since++;
  if(mt.since >= mt.next){ mt.since = 0; mt.next = 8 + Math.floor(Math.random()*5); return startTrainer(); }
  const lvl = Math.max(2, Math.min(MAX_LEVEL, state.zone*4 + Math.floor(Math.random()*5) - 2));
  const dexIndex = pickWildIndex(state.zone);
  const wild = makeMon(dexIndex, lvl);
  state.seen.add(dexIndex);
  clearBattleModifiers();
  state.battle = { wild, playerIdx: firstAlive(), mode:'wild' };
  clearLog();
  announceShiny(wild);
  print(`<span class="em">野生的 ${nm(wild)}（Lv.${wild.level}）出現了！</span>`);
  screenBattle();
}
function zoneName(z){ return MAP_NAMES[Math.min(z, MAP_NAMES.length)-1]; }
// 進化階段：1=基本、2=一階進化、3=二階進化；沒有進化的寶可夢依強度歸類
const EVO_FROM = {};
(function(){
  const link = (a,b)=>{ EVO_FROM[b] = a; };
  for(const k in EVO){ const t = EVO[k][0]; (Array.isArray(t)?t:[t]).forEach(b=>link(+k,b)); }
  for(const k in STONE_EVO) Object.values(STONE_EVO[k]).forEach(b=>link(+k,b));
  for(const k in TIME_EVO){ link(+k,TIME_EVO[k].day); link(+k,TIME_EVO[k].night); }
})();
function evoStage(i){
  let s = 1, c = i; while(EVO_FROM[c]!==undefined){ s++; c = EVO_FROM[c]; }
  if(s===1 && isFinalForm(i)) return Math.min(3, DEX[i][3]); // 單一型態：依強度 tier 分類
  return s;
}
const WILD_BY_STAGE = [[],[],[],[]];
DEX.forEach((e,i)=>{ if(!LEGENDARIES.includes(i)) WILD_BY_STAGE[evoStage(i)].push(i); }); // 神獸只能在塔裡遇到
// 各地點出現 [基本, 一階, 二階] 的機率
function stageWeights(zone){
  if(zone<=4)  return [1, 0, 0];
  if(zone<=8)  return [0.75, 0.25, 0];
  if(zone<=12) return [0.55, 0.45, 0];
  if(zone<=16) return [0.4, 0.45, 0.15];
  if(zone<=20) return [0.25, 0.45, 0.3];
  return [0.15, 0.4, 0.45];
}
function pickWildIndex(zone){
  const w = stageWeights(zone);
  let r = Math.random(), s = 1;
  if(r < w[0]) s = 1; else if(r < w[0]+w[1]) s = 2; else s = 3;
  const pool = WILD_BY_STAGE[s];
  return pool[Math.floor(Math.random()*pool.length)];
}
function firstAlive(){

function startTowerFloor(){
  if(noAlive()){

    const mul = endlessMul();
    wild.maxhp = Math.floor(wild.maxhp*endlessHpMul()); wild.hp = wild.maxhp;
    wild.atk = Math.floor(wild.atk*mul); wild.def = Math.floor(wild.def*mul); wild.spd = Math.floor(wild.spd*mul);
  }
  state.seen.add(f.dexIdx);
  clearBattleModifiers();

function hpBars(){ /* 改由 renderStage() 畫對戰卡片 */ }

function randomWildMove(w){ return w.moves[Math.floor(Math.random()*w.moves.length)]; }
function clearBattleModifiers(){ state.party.forEach(m=>{ m.status=null; m.atkMul=1; m.defMul=1; }); }
function effText(mult){
  if(mult === 0) return ' <span class="bad">沒有效果……</span>';
  if(mult >= 2) return ' <span class="good">效果絕佳！</span>';
  if(mult < 1) return ' <span class="bad">效果不好...</span>';
  return '';
}
function dmg(atkMon, defMon, move){
  const stab = typesOf(atkMon).includes(move.type) ? 1.3 : 1.0;
  const e = moveEff(move, defMon);
  if(e === 0) return 0;
  const variance = 0.85 + Math.random()*0.3;
  const atkStat = atkMon.atk * (atkMon.atkMul||1);
  const defStat = Math.max(1, defMon.def * (defMon.defMul||1));
  const raw = ((2*atkMon.level/5+2)*move.power*(atkStat/defStat)/50 + 2);
  return Math.max(1, Math.floor(raw*stab*e*variance));
}
function moveEff(move, defMon){ return move.struggle ? 1 : eff(move.type, typesOf(defMon)); }
function effSpd(m){ return m.spd * (m.status==='paralyze' ? 0.5 : 1); }
// 單次出招：處理麻痺、傷害、反作用力、吸血、附加效果
function doAttack(att, def, move){
  const t0 = curDelay();
  attackCore(att, def, move);
  if(state.battle) renderStage(t0 || 1);
  gap(ATTACK_GAP);
}
function attackCore(att, def, move){
  if(att.status==='paralyze' && Math.random()<0.25){
    print(`<span class="bad">${who(att)} 因麻痺而無法動彈！</span>`);
    return;
  }
  if(att !== state.battle.wild && move.maxpp !== undefined) move.pp = Math.max(0, move.pp - 1);
  const isEnemy = att === state.battle.wild;
  const e = moveEff(move, def);
  if(e === 0){
    print(`${who(att)} 使用了 ${esc(move.name)}！但是對 ${who(def)} 沒有效果……`);
    return;
  }
  const d = dmg(att, def, move);
  def.hp = Math.max(0, def.hp - d);
  print(`${who(att)} 使用了 ${esc(move.name)}！造成 <span class="${isEnemy?'bad':'em'}">${d}</span> 點傷害。${effText(e)}`);
  if(move.recoil){
    const rec = Math.max(1, Math.floor(d*move.recoil));
    att.hp = Math.max(0, att.hp-rec);
    print(`<span class="bad">${who(att)} 因反作用力受到了 ${rec} 點傷害！</span>`);
  }
  const fx = STATUS_FX[move.type];
  if(fx && fx.kind==='drain'){
    const heal = Math.floor(d*0.5);
    if(heal>0 && att.hp>0 && att.hp<att.maxhp){ att.hp=Math.min(att.maxhp, att.hp+heal); print(`<span class="good">${who(att)} 吸取了 ${heal} 點 HP！</span>`); }
  } else if(def.hp>0 || (fx && fx.kind==='selfDefUp')){
    const msg = applyMoveEffect(att, def, move);
    if(msg) print(msg);
  }
}
// 回傳 true 代表戰鬥已結束或已切換畫面
function checkBattleEnd(){
  const b = state.battle; const p = state.party[b.playerIdx]; const w = b.wild;
  if(w.hp<=0){
    if(p.hp<=0) print(`<span class="bad">${nm(p)} 也在同一擊中倒下了！</span>`);
    winBattle(); return true;
  }
  if(p.hp<=0){ afterFaintCheck(p); return true; }
  return false;
}
function enemyTurn(){
  const b = state.battle;
  doAttack(b.wild, state.party[b.playerIdx], randomWildMove(b.wild));
  return checkBattleEnd();
}
function endOfTurn(){
  const b = state.battle; const p = state.party[b.playerIdx]; const w = b.wild;
  const tW = tickStatus(w); if(tW) print(tW);
  if(w.hp<=0){ return winBattle(); }
  const tP = tickStatus(p); if(tP) print(tP);
  if(afterFaintCheck(p)) return;
  b.turn = (b.turn||1) + 1;
  screenBattle();
}
function playerMove(moveIdx){
  const b = state.battle; const p = state.party[b.playerIdx]; const w = b.wild;
  clearLog();
  if(moveIdx>=0 && !(p.moves[moveIdx].pp>0)) return screenMoveSelect();
  const pm = moveIdx<0 ? STRUGGLE : p.moves[moveIdx], wm = randomWildMove(w);
  const ps = effSpd(p), ws = effSpd(w);
  const playerFirst = ps > ws || (ps === ws && Math.random() < 0.5);
  const order = playerFirst ? [[p,w,pm],[w,p,wm]] : [[w,p,wm],[p,w,pm]];
  for(const [a,d,m] of order){
    if(a.hp<=0 || d.hp<=0) continue;
    doAttack(a, d, m);
    if(checkBattleEnd()) return;
  }
  endOfTurn();
}
function tryCatch(ballKey){
  if(typeof ballKey !== 'string') ballKey = 'pokeball';
  const b = state.battle; const w = b.wild; const ball = ITEMS[ballKey];
  clearLog();
  if(!(state.bag[ballKey]>0)){
    print(`<span class="bad">${ball.label}用完了！去商店補貨吧。</span>`);
    return screenBattle();
  }
  state.bag[ballKey]--;
  const hpRatio = w.hp/w.maxhp;
  const chance = ball.master ? 1 : Math.min(0.97, (1-hpRatio)*0.75 + 0.15 + ball.ball);
  print(`你對 ${nm(w)} 丟出了${ball.label}……`);
  if(Math.random() < chance){
    w.status = null; w.atkMul = 1; w.defMul = 1; bump('catches'); battleDone();
    state.caught.add(w.dex);
    if(w.shiny) state.shinyCaught.add(w.dex);
    print(`<span class="good">抓到了！${nm(w)} 已加入圖鑑！</span>`);
    if(state.party.length<6){ state.party.push(w); print('它加入了你的隊伍！'); }
    else { state.box.push(w); print('隊伍已滿，它被送到了倉庫。'); }
    const activeMon = state.party[b.playerIdx];
    if(activeMon && activeMon.hp>0 && activeMon!==w) grantExp(activeMon, w.level, 0.5, '因為成功捕捉獲得');
    state.battle=null;
    return screenField();
  }
  print('<span class="bad">牠掙脫了！</span>');
  if(enemyTurn()) return;
  endOfTurn();
}
function screenItemSelect(){
  const b = state.battle; const p = state.party[b.playerIdx];

function useItem(kind){

function screenSwitch(){

  clearLog();
  print('<span class="em">選擇要換上場的寶可夢：</span>');
  const opts = state.party.map((m,i)=>{
    const tag = i===b.playerIdx ? '（目前上場）' : (m.hp<=0 ? '（已無法戰鬥）' : `HP ${m.hp}/${m.maxhp}`);
    const usable = i!==b.playerIdx && m.hp>0;
    return { label:`${monName(m)} Lv.${m.level} ${tag}`, half:true, action: usable ? ()=>doSwitch(i) : screenSwitch };
  });
  opts.push({label:'取消，返回戰鬥', action:toBattle});
  setOptions(opts,'選擇寶可夢');
}
function doSwitch(idx){
  const b = state.battle;
  const old = state.party[b.playerIdx];
  b.playerIdx = idx;
  clearLog();
  print(`收回了 ${nm(old)}，換上 ${nm(state.party[idx])}！`);
  if(enemyTurn()) return;
  endOfTurn();
}
function evolveIfReady(p){
  const te = TIME_EVO[p.dex];
  if(te){
    if(p.level < te.lvl) return false;
    const h = nowFn().getHours();
    return evolveTo(p, (h>=6 && h<18) ? te.day : te.night);
  }
  const rule = EVO[p.dex];
  if(!rule) return false;
  let [toIdx, lvl] = rule;
  if(p.level < lvl) return false;
  if(Array.isArray(toIdx)) toIdx = toIdx[Math.floor(Math.random()*toIdx.length)]; // 多分支：隨機
  return evolveTo(p, toIdx);
}
function evolveTo(p, toIdx){
  const oldName = monName(p);
  const e = DEX[toIdx];
  p.dex = toIdx; p.name = e[0]; p.t1 = e[1]; p.t2 = e[2]; p.tier = e[3];
  const st = statsFor(e, p.level);
  const hpGain = st.hp - p.maxhp;
  p.maxhp = st.hp; p.hp = Math.max(1, Math.min(p.maxhp, p.hp + hpGain));
  p.atk = st.atk; p.def = st.def; p.spd = st.spd;
  p.moves = buildMoves(e);
  state.caught.add(toIdx); state.seen.add(toIdx);
  if(p.shiny) state.shinyCaught.add(toIdx);
  print(`<span class="em">✦ ${esc(oldName)} 進化成了 ${nm(p)}！</span>`);
  bump('evolves');
  return true;
}
function evolveFully(p){ while(evolveIfReady(p)){} }
function grantExp(p, oppLevel, mult, verb, quiet){
  if(p.level >= MAX_LEVEL){
    p.exp = 0;
    evolveFully(p); // 滿級才抓到、或舊存檔中尚未進化的寶可夢，也能進化
    if(!quiet) print(`<span class="sys">${nm(p)} 已經是 Lv.${MAX_LEVEL}，經驗值無法再增加。</span>`);
    return;
  }
  const gained = Math.max(1, Math.floor((10 + oppLevel*4) * mult));
  p.exp += gained;
  if(!quiet) print(`<span class="good">${nm(p)} ${verb} ${gained} 經驗值。</span>`);
  while(p.level < MAX_LEVEL && p.exp >= p.expNext){
    p.exp -= p.expNext; p.level++; p.expNext = 18 + p.level*9;
    const st = statsFor(DEX[p.dex], p.level);
    const gainHp = st.hp-p.maxhp;
    p.maxhp=st.hp; p.hp=Math.min(p.hp+gainHp, p.maxhp); p.atk=st.atk; p.def=st.def; p.spd=st.spd;
    print(`<span class="em">${nm(p)} 升到了 Lv.${p.level}！</span>`);
    evolveFully(p);
  }
  if(p.level >= MAX_LEVEL){ p.exp = 0; print(`<span class="em">${nm(p)} 達到等級上限 Lv.${MAX_LEVEL}！</span>`); }
}
// 沒出場但還能戰鬥的隊員分到部分經驗（倒下的不算）
const SHARE_EXP = 0.3;
function shareExp(active, oppLevel, mult){
  const others = state.party.filter(m=>m!==active && m.hp>0 && m.level<MAX_LEVEL);
  if(!others.length) return;
  const gained = Math.max(1, Math.floor((10 + oppLevel*4) * mult * SHARE_EXP));
  print(`<span class="good">隊伍中其他 ${others.length} 隻寶可夢各分到 ${gained} 經驗值。</span>`);
  others.forEach(m=>grantExp(m, oppLevel, mult*SHARE_EXP, '分到', true));
}
function giveMoney(amount){
  state.money += amount;
  print(`<span class="good">獲得了 💰 ${amount}！（目前 ${state.money}）</span>`);
}
function warnIfWiped(){
  if(noAlive()) print('<span class="bad">你的隊伍已經沒有能戰鬥的寶可夢了！請先回補給站治療。</span>');
}
function winBattle(){
  const b = state.battle; const p = state.party[b.playerIdx]; const w = b.wild;
  const mode = b.mode;
  bump('wins'); if(mode==='tower'){ bump('floors'); if(b.boss) bump('bosses'); }
  print(`<span class="good">擊敗了${mode==='wild'?'野生的 ':' '}${nm(w)}！</span>`);
  const expMul = (mode==='tower') ? TOWER_EXP_MUL : 1;
  if(p.hp>0) grantExp(p, w.level, expMul, '獲得');
  shareExp(p, w.level, expMul);
  if(b.foes && b.foes.length){
    const nx = b.foes.shift(); b.wild = nx;
    print(`<span class="em">${esc(b.title)} 派出了 ${nm(nx)}（Lv.${nx.level}）！</span>`);
    const cur = state.party[b.playerIdx];
    if(cur.hp<=0) return afterFaintCheck(cur);
    return screenBattle();
  }
  state.battle=null;
  battleDone();

  if(mode==='trainer'){
    giveMoney(b.reward); bump('trainers'); warnIfWiped(); return screenField();
  }
  if(mode==='gym'){
    giveMoney(b.reward); state.meta.badges++; bump('gyms');
    { const sk = STONE_KEYS[Math.floor(Math.random()*STONE_KEYS.length)]; state.bag[sk] = (state.bag[sk]||0) + 1; print(`<span class="good">館主另外送了你一顆 ${ITEMS[sk].label}！</span>`); }
    print(`<span class="boss">🏅 獲得了【${esc(GYMS[b.gymIdx][1])}】的徽章！（${state.meta.badges}/${GYMS.length}）</span>`);
    warnIfWiped(); return screenGym(true);
  }
  if(mode==='tower'){
    const t = state.tower;
    giveMoney(w.level * 10 * (b.boss ? 3 : 1));
    let gotCoin = true;
    if(b.endless){
      t.coins++;
      t.endlessPtr++;
      if(t.endlessPtr >= BOSSES.length){ t.endlessPtr = 0; t.loop++; print(`<span class="boss">第 ${t.loop+1} 輪小魔王全數擊破！下一輪再度強化。</span>`); }
    } else {
      gotCoin = t.floorPtr >= (t.coinPtr||0); // 只有第一次通過的樓層才有硬幣
      if(gotCoin){ t.coins++; t.coinPtr = t.floorPtr+1; }
      t.floorPtr++;
    }
    if(gotCoin) print(`<span class="good">🪙 ${b.boss?'小魔王擊破':'樓層突破'}！獲得 1 枚硬幣（目前 ${t.coins} 枚）</span>`);
    else print(`<span class="sys">${b.boss?'小魔王擊破':'樓層突破'}！這層已經領過硬幣了，不會重複獲得（目前 ${t.coins} 枚）</span>`);
    if(b.boss){
      fullHeal();
      print('<span class="good">小魔王倒下時留下了一道光，你的隊伍全部回滿了！現在可以返回地面。</span>');
    }
    if(!b.endless && t.floorPtr === NONLEG.length){
      print(`<span class="boss">塔內 ${NONLEG.length} 層全數突破！接下來進入第二輪小魔王（HP、能力大幅強化）。</span>`);
    }
    warnIfWiped();
    return screenTower(true);
  }
  if(mode==='legendary'){
    giveMoney(w.level * 20);
    w.hp = w.maxhp; w.status=null; w.atkMul=1; w.defMul=1;
    state.caught.add(w.dex); state.seen.add(w.dex);
    if(w.shiny) state.shinyCaught.add(w.dex);
    if(state.party.length<6){ state.party.push(w); print(`<span class="good">✦ ${nm(w)} 被你的實力降服，加入了隊伍！</span>`); }
    else { state.box.push(w); print(`<span class="good">✦ ${nm(w)} 被降服，送往了倉庫！</span>`); }
    state.tower.legendaryPtr++;
    warnIfWiped();
    return screenTower(true);
  }
  giveMoney(w.level * 10);
  warnIfWiped();
  screenField();
}
function loseBattle(){
  print('<span class="bad">你的隊伍全部失去戰鬥能力了……你被送回了補給站。</span>');
  state.party.forEach(m=>{ m.hp=Math.max(1, Math.floor(m.maxhp*0.5)); m.status=null; restorePP(m); });

  screenField();
}

function findItem(){
  let r = Math.random()*FIND_TABLE.reduce((a,x)=>a+x[1],0), key = FIND_TABLE[0][0];
  for(const [k,w] of FIND_TABLE){ if((r-=w) < 0){ key = k; break; } }
  const qty = key==='pokeball' ? 1 + Math.floor(Math.random()*2) : 1;
  state.bag[key] = (state.bag[key]||0) + qty; bump('found');
  clearLog();
  print(`<span class="good">🎁 你在路邊撿到了 ${ITEMS[key].label} ×${qty}！</span>`);
  screenField();
}

/* ---------- MONTHLY CHECK-IN ---------- */
let nowFn = () => new Date();
function checkinReward(n){ return CHECKIN_MILESTONE[n] || CHECKIN_BASE[n % 4]; }
function checkinNow(){
  const d = nowFn(), ym = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  if(state.checkin.ym !== ym) state.checkin = {ym, days:[]}; // 每月重置
  return {ym, day:d.getDate(), dim:new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(), first:new Date(d.getFullYear(), d.getMonth(), 1).getDay(), month:d.getMonth()+1};
}
function canCheckin(){ const t = checkinNow(); return !state.checkin.days.includes(t.day); }
function doCheckin(){
  const t = checkinNow(); if(state.checkin.days.includes(t.day)) return;
  state.checkin.days.push(t.day);
  const n = state.checkin.days.length, r = checkinReward(n);
  giveReward(r); bump('checkins'); saveGame();
  notify(`📅 簽到成功（本月第 ${n} 天）：${rewardText(r)}`); openMenu('checkin'); refreshMenuDot();
}
function checkinHtml(){
  const t = checkinNow(), got = state.checkin.days, n = got.length, next = checkinReward(n+1);
  let h = `<div class="mh">${t.month} 月簽到　本月已簽 ${n} 天（每月 1 號重置，不能補簽）</div>`;
  h += canCheckin() ? `<button class="bigclaim" onclick="doCheckin()">✅ 今日簽到　可得：${esc(rewardText(next))}</button>` : `<button class="bigclaim off" disabled>今天已簽到 ✔　明天可得：${esc(rewardText(next))}</button>`;
  h += '<div class="cal">' + ['日','一','二','三','四','五','六'].map(x=>`<div class="wd">${x}</div>`).join('');
  for(let i=0;i<t.first;i++) h += '<div class="day blank"></div>';
  for(let d=1; d<=t.dim; d++) h += `<div class="day${got.includes(d)?' on':''}${d===t.day?' today':''}">${got.includes(d)?'✓':d}</div>`;
  h += '</div><div class="mh">累計簽到獎勵</div>';
  Object.keys(CHECKIN_MILESTONE).forEach(k=>{
    h += `<div class="qi${n>=k?' done':''}"><div class="qrow"><span>${k} 天：${esc(rewardText(CHECKIN_MILESTONE[k]))}</span><span>${n>=k?'✅':`還差 ${k-n} 天`}</span></div></div>`;
  });
  return h + '<div style="color:var(--dim);font-size:12px">其他天數：輪流領 💰500／💰300／精靈球×5／藥水×3</div>';
}

/* ---------- QUESTS / ACHIEVEMENTS / MENU ---------- */
function bump(k, n){ state.stats[k] = (state.stats[k]||0) + (n||1); }
const modalEl = document.getElementById('modal'), mbodyEl = document.getElementById('mbody'), toastEl = document.getElementById('toast'), dotEl = document.getElementById('menuDot');
let menuTab = 'quest', toastTimer = null;
function notify(msg){ toastEl.textContent = msg; toastEl.classList.add('on'); if(toastTimer) clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove('on'), 2600); }
function giveReward(r){
  if(r.money) state.money += r.money;
  Object.keys(r.items||{}).forEach(k=>{ state.bag[k] = (state.bag[k]||0) + r.items[k]; });
}
function rewardText(r){ return [r.money?`💰 ${r.money}`:'', ...Object.keys(r.items||{}).map(k=>`${ITEMS[k].label} ×${r.items[k]}`)].filter(Boolean).join('、'); }
function questProg(q){ return Math.max(0, (state.stats[q.key]||0) - (state.quest.base[q.id]||0)); }
function claimQuest(id){
  const q = QUESTS.find(x=>x.id===id); if(!q || questProg(q) < q.target) return;
  state.quest.base[id] = (state.quest.base[id]||0) + q.target;
  giveReward(q.reward); saveGame(); notify('📜 任務完成！獲得 '+rewardText(q.reward)); openMenu('quest'); refreshMenuDot();
}
const ACH = [
  {id:'a_win1',   name:'初出茅廬',   desc:'贏得 1 場戰鬥',           pts:1,  cur:()=>state.stats.wins||0, target:1},
  {id:'a_win50',  name:'身經百戰',   desc:'贏得 50 場戰鬥',          pts:3,  cur:()=>state.stats.wins||0, target:50},
  {id:'a_win300', name:'戰鬥狂人',   desc:'贏得 300 場戰鬥',         pts:6,  cur:()=>state.stats.wins||0, target:300},
  {id:'a_cat10',  name:'捕獲新手',   desc:'捕捉 10 隻寶可夢',        pts:2,  cur:()=>state.stats.catches||0, target:10},
  {id:'a_cat50',  name:'捕獲達人',   desc:'捕捉 50 隻寶可夢',        pts:5,  cur:()=>state.stats.catches||0, target:50},
  {id:'a_dex50',  name:'圖鑑收藏家', desc:'圖鑑收集 50 隻',          pts:3,  cur:()=>state.caught.size, target:50},
  {id:'a_dex150', name:'圖鑑大師',   desc:'圖鑑收集 150 隻',         pts:8,  cur:()=>state.caught.size, target:150},
  {id:'a_dex251', name:'全圖鑑達成', desc:'圖鑑收集全部 251 隻',     pts:20, cur:()=>state.caught.size, target:251},
  {id:'a_flr30',  name:'塔的挑戰者', desc:'在塔中通過 30 層',        pts:3,  cur:()=>state.stats.floors||0, target:30},
  {id:'a_flr150', name:'攀塔勇者',   desc:'在塔中通過 150 層',       pts:8,  cur:()=>state.stats.floors||0, target:150},
  {id:'a_top',    name:'登頂',       desc:'清空塔內全部普通樓層',    pts:12, cur:()=>Math.min(state.tower.floorPtr, NONLEG.length), target:NONLEG.length},
  {id:'a_boss10', name:'小魔王剋星', desc:'擊破 10 隻小魔王',        pts:4,  cur:()=>state.stats.bosses||0, target:10},
  {id:'a_evo10',  name:'進化培育家', desc:'讓寶可夢進化 10 次',      pts:3,  cur:()=>state.stats.evolves||0, target:10},
  {id:'a_shiny',  name:'閃亮登場',   desc:'捕獲 1 隻色違寶可夢',     pts:10, cur:()=>state.shinyCaught.size, target:1},
  {id:'a_leg1',   name:'傳說降臨',   desc:'收服 1 隻傳說寶可夢',     pts:5,  cur:()=>state.tower.legendaryPtr, target:1},
  {id:'a_legall', name:'傳說收集家', desc:'收服全部 11 隻傳說寶可夢', pts:15, cur:()=>state.tower.legendaryPtr, target:LEGENDARIES.length},
  {id:'a_max',    name:'極限突破',   desc:'讓寶可夢升到 Lv.100',     pts:5,  cur:()=>[...state.party,...state.box].some(m=>m.level>=MAX_LEVEL)?1:0, target:1},
  {id:'a_r2',     name:'二周目霸者', desc:'打完第二輪全部小魔王',    pts:15, cur:()=>state.tower.loop, target:1},
  {id:'a_tr1',    name:'初次交鋒',   desc:'擊敗 1 位訓練家',         pts:1,  cur:()=>state.stats.trainers||0, target:1},
  {id:'a_tr30',   name:'訓練家殺手', desc:'擊敗 30 位訓練家',        pts:4,  cur:()=>state.stats.trainers||0, target:30},
  {id:'a_gym1',   name:'徽章收藏',   desc:'取得第 1 枚道館徽章',     pts:3,  cur:()=>state.meta.badges, target:1},
  {id:'a_gym8',   name:'關都制霸',   desc:'集滿前 8 枚徽章（第一世代）', pts:10, cur:()=>state.meta.badges, target:8},
  {id:'a_gym16',  name:'道館大師',   desc:'集滿全部 16 枚徽章',      pts:20, cur:()=>state.meta.badges, target:16},
  {id:'a_ci7',    name:'每日報到',   desc:'累計簽到 7 天',           pts:2,  cur:()=>state.stats.checkins||0, target:7},
  {id:'a_ci30',   name:'簽到達人',   desc:'累計簽到 30 天',          pts:5,  cur:()=>state.stats.checkins||0, target:30}
];
function achPoints(){ return ACH.filter(a=>state.ach.done.includes(a.id)).reduce((n,a)=>n+a.pts,0); }
function checkAch(){
  ACH.forEach(a=>{ if(!state.ach.done.includes(a.id) && a.cur() >= a.target){ state.ach.done.push(a.id); notify(`🏆 成就解鎖：${a.name}（+${a.pts} 點）`); } });
}
function claimMilestone(pts){
  const m = MILESTONES.find(x=>x.pts===pts);
  if(!m || achPoints() < pts || state.ach.claimed.includes(pts)) return;
  state.ach.claimed.push(pts); giveReward(m.reward); saveGame(); notify('🏆 領取成就獎勵：'+rewardText(m.reward)); openMenu('ach'); refreshMenuDot();
}
function hasClaimable(){
  return canCheckin() || QUESTS.some(q=>questProg(q)>=q.target) || MILESTONES.some(m=>achPoints()>=m.pts && !state.ach.claimed.includes(m.pts));
}
function refreshMenuDot(){ checkAch(); if(hasClaimable()) dotEl.classList.add('on'); else dotEl.classList.remove('on'); }
function closeMenu(){ modalEl.classList.remove('open'); }
function openMenu(tab){
  if(typeof tab === 'string') menuTab = tab;
  checkAch();
  const bar = (c,t)=>`<div class="qbar"><i style="width:${Math.min(100,Math.round(100*c/t))}%"></i></div>`;
  let h = '';
  if(menuTab==='checkin'){
    h = checkinHtml();
  } else if(menuTab==='quest'){
    h += '<div class="mh">可重複完成的任務，完成後可再次挑戰</div>';
    QUESTS.forEach(q=>{
      const c = questProg(q), ok = c >= q.target;
      h += `<div class="qi${ok?' done':''}"><div>${esc(q.name)}<small>獎勵：${esc(rewardText(q.reward))}</small></div>${bar(Math.min(c,q.target),q.target)}<div class="qrow"><span>${Math.min(c,q.target)} / ${q.target}</span>${ok?`<button class="claim" onclick="claimQuest('${q.id}')">領取</button>`:''}</div></div>`;
    });
  } else {
    const pts = achPoints();
    h += `<div class="mh">成就點數：${pts}</div>`;
    MILESTONES.forEach(m=>{
      const got = state.ach.claimed.includes(m.pts), can = pts >= m.pts && !got;
      h += `<div class="qi${can?' done':''}"><div class="qrow"><span>${m.pts} 點：${esc(rewardText(m.reward))}</span>${got?'<span>✅ 已領取</span>':can?`<button class="claim" onclick="claimMilestone(${m.pts})">領取</button>`:`<span style="color:var(--dim)">還差 ${m.pts-pts} 點</span>`}</div></div>`;
    });
    h += '<div class="mh" style="margin-top:12px">成就列表</div>';
    ACH.forEach(a=>{
      const done = state.ach.done.includes(a.id), c = Math.min(a.cur(), a.target);
      h += `<div class="qi${done?' done':''}"><div>${done?'✅ ':''}${esc(a.name)}　<span style="color:var(--accent)">+${a.pts} 點</span><small>${esc(a.desc)}</small></div>${done?'':bar(c,a.target)+`<div class="qrow"><span>${c} / ${a.target}</span></div>`}</div>`;
    });
  }
  mbodyEl.innerHTML = h;
  document.getElementById('tabQuest').className = 'tab' + (menuTab==='quest'?' on':'');
  document.getElementById('tabAch').className = 'tab' + (menuTab==='ach'?' on':'');
  document.getElementById('tabCheckin').className = 'tab' + (menuTab==='checkin'?' on':'');
  modalEl.classList.add('open');
}

/* ---------- BOOT ---------- */
loadGame();
screenCover();
</script>
<script>
/* 按下去先陷 0.2 秒，再執行動作 */
(function(){
  const DELAY = 40;   // 按住多久（毫秒）
  const REBOUND = 40; // 彈回動畫播多久才執行動作（毫秒）
  let pressLock = false;
  document.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if(!btn || btn._go) return;
    e.stopImmediatePropagation(); e.preventDefault();
    if(pressLock) return;
    pressLock = true;
    btn.classList.add('pressed');
    setTimeout(function(){
      btn.classList.remove('pressed');
      btn.classList.add('bounce');          // 彈回來
      setTimeout(function(){
        btn.classList.remove('bounce');
        pressLock = false;
        btn._go = true; btn.click(); btn._go = false;
      }, REBOUND);
    }, DELAY);
  }, true);
})();
</script>
