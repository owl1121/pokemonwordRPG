<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>寶可夢文字冒險</title>
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;}</style>
<script>
// 禁止縮放（iOS Safari 會無視 user-scalable=no，要另外擋）
['gesturestart','gesturechange','gestureend'].forEach(function(e){document.addEventListener(e,function(ev){ev.preventDefault();},{passive:false});});
document.addEventListener('touchmove',function(ev){if(ev.touches&&ev.touches.length>1)ev.preventDefault();},{passive:false});
var _lt=0;document.addEventListener('touchend',function(ev){var n=Date.now();if(n-_lt<300)ev.preventDefault();_lt=n;},{passive:false});
document.addEventListener('wheel',function(ev){if(ev.ctrlKey)ev.preventDefault();},{passive:false});
</script>
<!-- 寶可夢風格像素字型：俐方體11號 Cubic 11（繁體中文點陣體，SIL OFL 授權，可免費商用） -->
<link rel="preconnect" href="https://fontsapi.zeoseven.com" crossorigin>
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/101/main/result.css">
<style>
/* 自己倉庫裡的字型檔（fonts/Cubic_11.ttf）；檔案不存在時會自動改用上面 CDN 載入的 'Cubic 11' */
@font-face{font-family:'Cubic 11 Local';src:url('fonts/Cubic_11.ttf') format('truetype');font-display:swap;}
:root{
  --bg:#0d1210; --panel:#111a16; --line:#2c4a3a; --text:#c9f7d8; --dim:#6f9a84;
  --accent:#ffcb3c; --accent2:#5fd0ff; --danger:#ff6b6b; --good:#7ee787;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#0d1210; --panel:#111a16; --text:#c9f7d8; }
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:'Cubic 11 Local','Cubic 11','DotGothic16','Courier New',ui-monospace,monospace;
  display:flex; justify-content:center;
}
#app{
  width:100%; max-width:480px; min-height:100%;
  display:flex; flex-direction:column;
  border-left:1px solid var(--line); border-right:1px solid var(--line);
}
header{
  padding:14px 16px 10px; border-bottom:1px solid var(--line);
  position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5;
}
header .title{font-size:15px; letter-spacing:2px; color:var(--accent);}
header .sub{font-size:11px; color:var(--dim); margin-top:2px;}
#log{
  flex:1; padding:16px; white-space:pre-wrap; line-height:1.65; font-size:14px;
  overflow-x:auto;
}
#log .sys{color:var(--dim);}
#log .em{color:var(--accent);}
#log .good{color:var(--good);}
#log .bad{color:var(--danger);}
#log .hr{border-top:1px dashed var(--line); margin:10px 0;}
#log .dexwrap{white-space:normal;}
#log .dexhead{position:sticky; top:-16px; background:var(--bg); padding:6px 0 8px; margin-top:-6px; border-bottom:1px solid var(--line); z-index:1;}
#log .dexrow{display:flex; gap:10px; align-items:baseline; padding:5px 0; border-bottom:1px dashed var(--line);}
#log .dexrow:last-child{border-bottom:none;}
#log .dexno{color:var(--dim); min-width:4.2em; font-variant-numeric:tabular-nums;}
#bar{
  padding:8px 16px; font-size:12px; color:var(--dim); border-top:1px solid var(--line);
  display:flex; gap:14px; flex-wrap:wrap;
}
#opts{
  padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--line);
  background:var(--panel);
}
.opt{
  background:transparent; color:var(--text); border:1px solid var(--line);
  padding:11px 12px; font-family:inherit; font-size:14px; text-align:left;
  border-radius:2px; cursor:pointer;
}
.opt:active{background:#1a2a22;}
.opt .k{color:var(--accent2); margin-right:8px;}
.hpwrap{height:6px; background:#1a2a22; border-radius:3px; overflow:hidden; margin:2px 0 6px;}
.hpfill{height:100%; background:var(--good);}
.line{opacity:0; transform:translateY(4px); animation:lineIn .5s ease forwards;}
@keyframes lineIn{ to{opacity:1; transform:translateY(0);} }
#opts.pending .opt{opacity:0;}   /* 仍可點：點下去 = 跳過動畫（見最底下的按鈕腳本） */
#opts{transition:opacity .2s;}
#skipHint{font-size:11px; color:var(--dim); text-align:center; padding:4px 0 0;}
.shiny{color:#ff9ef5;}
.boss{color:#ff9d4d;}
.cover{ text-align:center; padding:22px 6px 10px; }
.pokeball{
  width:68px; height:68px; margin:0 auto 16px; border-radius:50%;
  background:linear-gradient(to bottom, #e0473f 0%, #e0473f 44%, #1a1a1a 44%, #1a1a1a 56%, #f2f2f2 56%, #f2f2f2 100%);
  border:3px solid #1a1a1a; position:relative; box-shadow:0 2px 10px rgba(0,0,0,.4);
}
.pokeball span{
  position:absolute; top:50%; left:50%; width:22px; height:22px; margin:-11px 0 0 -11px;
  background:#f2f2f2; border:3px solid #1a1a1a; border-radius:50%; box-sizing:border-box;
}
.cover-title{ font-size:23px; letter-spacing:5px; color:var(--accent); margin-bottom:6px; }
.cover-sub{ font-size:12px; color:var(--accent2); letter-spacing:2px; margin-bottom:12px; }
.cover-tagline{ font-size:12px; color:var(--dim); line-height:1.7; max-width:320px; margin:0 auto; }
.intro-h{ color:var(--good); }

#opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));}
.opt{grid-column:1/-1;padding:9px 10px;font-size:13px;line-height:1.35;border-radius:8px;}
.opt.half{grid-column:span 2;}
.opt.q{grid-column:span 1;text-align:center;padding:10px 2px;}
.mvpp{flex-basis:100%;font-size:13px;font-weight:bold;color:var(--accent2);}
.mvpp.low{color:var(--accent);}
.mvpp.zero{color:var(--danger);}
#app.battle #skipHint{display:none;}
#menuBtn{white-space:nowrap;}
header .title{white-space:nowrap;}
#skipHint{grid-column:1/-1;}
.opt .sub{display:block;font-size:11px;color:var(--dim);}
.opt.mv{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 6px;}
.mvn{font-weight:bold;font-size:14px;}
.mvt{font-size:11px;padding:1px 8px;border-radius:9px;color:#fff;}
.mvp{flex-basis:100%;font-size:11px;color:var(--dim);}
#stage{display:none;flex-direction:column;gap:14px;margin:12px 12px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:#0f1613;}
#app.battle #stage{display:flex;}
#app.detail #stage{display:flex;align-items:center;gap:4px;padding:8px 10px;}
.hexsvg{width:100%;max-width:330px;height:auto;display:block;}
.hexsvg .ax{stroke:var(--line);stroke-width:1;fill:none;}
.hexsvg .ring{stroke:var(--line);stroke-width:1;fill:none;}
.hexsvg .ring.cap{stroke-dasharray:3 3;}
.hexsvg .orig{fill:none;stroke:var(--dim);stroke-width:1.5;stroke-dasharray:4 3;}
.hexsvg .val{fill:rgba(38,198,218,.35);stroke:#26c6da;stroke-width:2;stroke-linejoin:round;}
.hexsvg text{fill:var(--dim);font-size:12px;text-anchor:middle;dominant-baseline:middle;}
.hexsvg text b,.hexsvg .num{fill:var(--accent2);font-weight:bold;}
.hexsvg .sel{fill:var(--accent);}
.hexinfo{font-size:12px;color:var(--dim);text-align:center;line-height:1.6;}
.hexinfo b{color:var(--accent2);}
#app.battle #bar{display:none;}
#app.battle #log{flex:none;margin:10px 12px 0;min-height:84px;max-height:30vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:#0b0f0d;padding:10px 14px;}
.card{width:66%;padding:8px 12px;border-radius:8px;border:3px solid;}
.card.foe{align-self:flex-end;background:#ffe9ec;border-color:#ef5350;color:#b71c1c;}
.card.me{align-self:flex-start;background:#dff6f8;border-color:#26c6da;color:#00838f;}
.card .r1{display:flex;justify-content:space-between;font-weight:bold;font-size:15px;}
.card .r2{font-size:11px;opacity:.75;margin:2px 0 5px;}
.ab{color:#ffd166;font-weight:bold;}
.card .bar{height:8px;border-radius:4px;background:rgba(0,0,0,.14);overflow:hidden;}
.card .bar i{display:block;height:100%;background:#4caf50;}
.card .bar.low i{background:#e53935;}
.card .hpt{text-align:right;font-size:12px;margin-top:3px;}
.card .xp{height:4px;border-radius:2px;background:rgba(0,0,0,.1);margin-top:3px;overflow:hidden;}
.card .xp i{display:block;height:100%;background:#4fc3f7;}

header{display:flex;justify-content:space-between;align-items:center;gap:8px;}
#menuBtn{position:relative;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:13px;cursor:pointer;}
#menuDot{display:none;position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--danger);}
#menuDot.on{display:block;}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;align-items:center;justify-content:center;padding:14px;}
#modal.open{display:flex;}
.mbox{width:100%;max-width:460px;max-height:86vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.mhead{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-bottom:1px solid var(--line);}
.mhead .tab.wide{flex:1 1 40%;order:5;}
.mhead .x{order:4;}
.ptbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
.ptbar .claim.off{background:transparent;color:var(--text);border:1px solid var(--line);}
.ptbar input{flex:1;min-width:90px;box-sizing:border-box;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:16px;font-family:inherit;}
.ptrow .qrow .claim,.ptrow .qrow .lk{flex:1;text-align:center;}
.ptrow .lk{color:var(--dim);font-size:12px;border:1px dashed var(--line);border-radius:10px;padding:4px 2px;}
.ptrow .on{font-size:12px;color:var(--good);border:1px solid var(--good);border-radius:10px;padding:4px 2px;}
.mhead .tab{flex:1;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;font-size:13px;}
.mhead .tab.on{background:#1f3a2c;border-color:var(--accent2);}
.mhead .x{background:transparent;color:var(--dim);border:none;font-size:18px;padding:0 8px;}
#mbody{padding:12px;overflow-y:auto;font-size:13px;line-height:1.5;}
.qi{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;}
.qi.done{border-color:var(--good);}
.qi small{color:var(--dim);display:block;}
.qbar{height:5px;background:#1a2a22;border-radius:3px;margin:6px 0;overflow:hidden;}
.qbar i{display:block;height:100%;background:var(--accent2);}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.claim{background:var(--good);color:#0d1210;border:none;border-radius:6px;padding:5px 12px;font-family:inherit;font-size:12px;font-weight:bold;}
.mh{color:var(--accent);margin:4px 0 8px;}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f3a2c;border:1px solid var(--good);color:var(--text);padding:8px 14px;border-radius:20px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;}
#toast.on{opacity:1;}
.opt.off{opacity:.38;}

/* ---- 圓角統一 ---- */
#app{border:1px solid var(--line);border-radius:24px;}
header{border-radius:24px 24px 0 0;}
#bar{margin:0 12px 8px;border:1px solid var(--line);border-radius:16px;background:var(--panel);}
#opts{margin:0 12px 12px;border:1px solid var(--line);border-radius:20px;}
.opt{border-radius:14px;}
#menuBtn{border-radius:14px;}
#stage{border-radius:20px;}
#app.battle #log{border-radius:16px;}
.card{border-radius:16px;}
.card .bar{border-radius:6px;}
.card .xp{border-radius:4px;}
.mbox{border-radius:24px;}
.mhead .tab{border-radius:14px;}
.qi{border-radius:16px;}
.qbar{border-radius:6px;}
.claim{border-radius:12px;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px;}
.cal .wd{text-align:center;color:var(--dim);font-size:11px;}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--dim);}
.day.on{background:#1f3a2c;border-color:var(--good);color:var(--good);}
.day.today{border-color:var(--accent);color:var(--accent);border-width:2px;}
.day.blank{border:none;}
.bigclaim{width:100%;padding:11px;border:none;border-radius:16px;background:var(--good);color:#0d1210;font-family:inherit;font-size:14px;font-weight:bold;margin-bottom:12px;}
.bigclaim.off{background:#1a2a22;color:var(--dim);}
/* ---- 立體按鈕：底部厚度，按下去會沉 ---- */
.opt, #menuBtn, .claim, .bigclaim, .mhead .tab{
  position:relative; transition:transform .06s, box-shadow .06s;
  box-shadow:0 4px 0 #07100b, 0 5px 8px rgba(0,0,0,.35);
}
.opt{ background:linear-gradient(#17261e,#111b16); margin-bottom:2px; }
.opt:active, #menuBtn:active, .claim:active, .bigclaim:active, .mhead .tab:active{
  transform:translateY(3px); box-shadow:0 1px 0 #07100b, 0 1px 3px rgba(0,0,0,.35);
}
.opt:active{ background:linear-gradient(#111b16,#17261e); }
.opt.off, .opt.off:active, .bigclaim.off{ transform:none; box-shadow:0 2px 0 #07100b; }
#opts{ gap:9px 7px; }
/* ---- 立體按鍵 ---- */
.opt,#menuBtn,.hbtn,.mhead .tab{
  background:linear-gradient(#27392f,#1a2a22);
  border:1px solid #3d6650;
  box-shadow:0 5px 0 #0a120e, 0 8px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .08s, box-shadow .08s;
  -webkit-tap-highlight-color:transparent;
}
.opt:active,.opt.pressed,#menuBtn:active,#menuBtn.pressed,.hbtn:active,.hbtn.pressed,
.mhead .tab:active,.mhead .tab.pressed{
  transform:translateY(4px);
  background:linear-gradient(#1a2a22,#1f3328);
  box-shadow:0 1px 0 #0a120e, 0 2px 3px rgba(0,0,0,.4), inset 0 2px 5px rgba(0,0,0,.4);
}
.mhead .tab.on{background:#1f3a2c;}
.claim,.bigclaim:not(.off){
  background:linear-gradient(#95f09d,#5fc86a);
  box-shadow:0 4px 0 #2f7a3a;
  transition:transform .08s, box-shadow .08s;
}
.claim:active,.claim.pressed,.bigclaim:active,.bigclaim.pressed{
  transform:translateY(3px); box-shadow:0 1px 0 #2f7a3a;
}
@keyframes btnRebound{
  0%{transform:translateY(4px);box-shadow:0 1px 0 #0a120e,0 2px 3px rgba(0,0,0,.4)}
  40%{transform:translateY(-3px);box-shadow:0 8px 0 #0a120e,0 11px 12px rgba(0,0,0,.35)}
  70%{transform:translateY(1px);box-shadow:0 4px 0 #0a120e,0 6px 8px rgba(0,0,0,.4)}
  100%{transform:translateY(0);box-shadow:0 5px 0 #0a120e,0 8px 10px rgba(0,0,0,.4)}
}
.opt.bounce,#menuBtn.bounce,.mhead .tab.bounce,.claim.bounce,.bigclaim.bounce{animation:btnRebound .24s ease-out;}
#opts{gap:11px 6px;}

/* ---- 個人檔案 ---- */
#hdrleft{min-width:0;flex:1;}
#profBtn{display:flex;align-items:center;gap:9px;max-width:100%;background:transparent;border:none;padding:0;color:var(--text);font-family:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.av,.pav{flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5fe0a0,#1f5a3c);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:bold;color:#0d1210;box-shadow:0 3px 0 #07100b;}
.av{width:40px;height:40px;font-size:18px;transition:transform .06s,box-shadow .06s;}
#profBtn:active .av,#profBtn.pressed .av{transform:translateY(2px);box-shadow:0 1px 0 #07100b;}
#profBtn .pn{display:flex;flex-direction:column;min-width:0;line-height:1.3;}
#profBtn .pn b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#profBtn .pn i{font-style:normal;font-size:11px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mhead .tab{padding:8px 2px;font-size:12px;}
.pcard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;}
.pav{width:52px;height:52px;font-size:24px;}
.pinfo{flex:1;min-width:0;}
.pname{font-size:16px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ptitle{color:var(--accent);font-size:12px;}
.pstat{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;}
.pstat .qi{margin:0;padding:6px 9px;}
.qi.lock{opacity:.5;}
/* ---- 受擊：卡片左右晃一下 ---- */
@keyframes cardHit{
  0%{transform:translateX(0);filter:none}
  12%{transform:translateX(-10px);filter:brightness(1.6)}
  27%{transform:translateX(9px)}
  42%{transform:translateX(-7px);filter:brightness(1.3)}
  58%{transform:translateX(5px)}
  74%{transform:translateX(-3px)}
  100%{transform:translateX(0);filter:none}
}
.card.hit{animation:cardHit .42s ease-out;}
@keyframes cardHitStrong{
  0%{transform:translateX(0) rotate(0);filter:none}
  10%{transform:translateX(-18px) rotate(-2deg);filter:brightness(2) saturate(1.5)}
  24%{transform:translateX(16px) rotate(2deg);filter:brightness(1.5)}
  38%{transform:translateX(-13px) rotate(-1.5deg);filter:brightness(1.8)}
  52%{transform:translateX(10px) rotate(1deg)}
  68%{transform:translateX(-6px)}
  84%{transform:translateX(3px)}
  100%{transform:translateX(0) rotate(0);filter:none}
}
@keyframes cardHitWeak{
  0%{transform:translateX(0)}
  25%{transform:translateX(-4px)}
  55%{transform:translateX(3px)}
  100%{transform:translateX(0)}
}
.card.hit.strong{animation:cardHitStrong .6s ease-out;}
.card.hit.weak{animation:cardHitWeak .3s ease-out;}
@media (prefers-reduced-motion:reduce){.card.hit,.card.hit.strong,.card.hit.weak{animation:none;}}
/* ---- 像素字型 ---- */
html{font-synthesis:none;}                      /* 點陣字型沒有粗體，禁止瀏覽器假粗體把像素糊掉 */
body{-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed;letter-spacing:.3px;}
button,input,textarea,select{font-family:inherit;}
.card .r1,.mvn,.pname{letter-spacing:.5px;}
/* ---- 對戰前轉場動畫 ---- */
#introFx{position:fixed;z-index:100;overflow:hidden;border-radius:20px;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace;pointer-events:none;}
#introFx pre{position:absolute;left:0;top:0;margin:0;font-size:14px;line-height:1;letter-spacing:0;white-space:pre;user-select:none;}
#introFx .introTxt{display:none;position:relative;text-align:center;animation:introPop .35s ease-out;}
#introFx .vs{font-size:44px;font-weight:bold;letter-spacing:6px;color:#eafff2;text-shadow:0 0 14px #3fbf7f,0 3px 0 #07100b;}
#introFx .sub{font-size:14px;color:#9ad9b6;margin-top:6px;}
@keyframes introPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
/* ---- 擊倒／捕捉動畫 ---- */
#stage{position:relative;}
.koCrack{position:absolute;z-index:4;pointer-events:none;overflow:hidden;border-radius:12px;}
.koCrack path{fill:none;stroke:#3a3f55;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 2px rgba(255,255,255,.9));}
.koShard{position:absolute;z-index:4;pointer-events:none;box-sizing:border-box;}
.dexclick{cursor:pointer;}.dexclick:active{opacity:.6;}
.bsrow{display:flex;align-items:center;gap:8px;margin:2px 0;}.bsrow span{width:3em;opacity:.8;}.bsrow b{width:2.4em;text-align:right;}.bsrow i{display:block;height:8px;border-radius:4px;background:var(--accent2,#3fae7a);}
.gd{font-weight:bold;margin-left:2px;}.gm{color:#4a90e2;}.gf{color:#e2547a;}
.card.dmax{box-shadow:0 0 0 3px #ff3b3b,0 0 18px 6px rgba(255,40,40,.65);}
.card.tera{box-shadow:0 0 0 2px #bfefff,0 0 14px 4px rgba(120,220,255,.7);}
.shinyStar{position:fixed;z-index:30;pointer-events:none;font-size:28px;line-height:1;color:#ffe14d;text-shadow:0 0 2px #8a5a00,0 0 3px #8a5a00,0 0 10px #fff3a0,0 0 18px #ffd23a;}

/* 萬聖節 */
:root[data-fest="halloween"]{--bg:#150b1f;--panel:#1f1030;--line:#5b2f86;--text:#ffe9cf;--dim:#b895d6;--accent:#ff9a1f;--accent2:#c58bff;--danger:#ff5d73;--good:#ffcf5a;}
:root[data-fest="halloween"] body{background:radial-gradient(ellipse at 15% 0%,rgba(255,138,31,.18),transparent 45%),radial-gradient(ellipse at 90% 100%,rgba(138,63,255,.24),transparent 50%),var(--bg);background-attachment:fixed;}
:root[data-fest="halloween"] #app{position:relative;z-index:1;}
:root[data-fest="halloween"] header{background:rgba(21,11,31,.9);}
:root[data-fest="halloween"] .opt,:root[data-fest="halloween"] #menuBtn,:root[data-fest="halloween"] .mhead .tab{
  background:linear-gradient(#5b2d8a,#3a1a5c);border-color:#a75cff;

:root[data-fest="halloween"] .opt:active,:root[data-fest="halloween"] .opt.pressed,
:root[data-fest="halloween"] #menuBtn:active,:root[data-fest="halloween"] #menuBtn.pressed,
:root[data-fest="halloween"] .mhead .tab:active,:root[data-fest="halloween"] .mhead .tab.pressed{
  background:linear-gradient(#3a1a5c,#44206b);
  box-shadow:0 1px 0 #1a0a2a,0 2px 3px rgba(0,0,0,.4),inset 0 2px 5px rgba(0,0,0,.45);}
:root[data-fest="halloween"] .mhead .tab.on{background:#6a2f12;border-color:#ff9a1f;}
:root[data-fest="halloween"] .claim,:root[data-fest="halloween"] .bigclaim:not(.off){
  background:linear-gradient(#ffc36b,#ff8a1f);color:#2a1100;box-shadow:0 4px 0 #a14c00;}
:root[data-fest="halloween"] .claim:active,:root[data-fest="halloween"] .claim.pressed,
:root[data-fest="halloween"] .bigclaim:active,:root[data-fest="halloween"] .bigclaim.pressed{box-shadow:0 1px 0 #a14c00;}
:root[data-fest="halloween"] .av,:root[data-fest="halloween"] .pav{background:radial-gradient(circle at 35% 30%,#ffb85c,#9a3f0c);box-shadow:0 3px 0 #1a0a2a;}
:root[data-fest="halloween"] #introFx .vs{color:#ffe3b8;text-shadow:0 0 14px #ff8a1f,0 3px 0 #1a0a2a;}
:root[data-fest="halloween"] #introFx .sub{color:#e6b8ff;}
#festFx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
#festFx .moon{position:absolute;top:70px;right:6%;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d6,#ffd98a 60%,#e0a94a);box-shadow:0 0 40px 10px rgba(255,190,90,.30);opacity:.5;}
#festFx .web{position:absolute;top:-6px;left:0;font-size:72px;opacity:.28;transform:rotate(-8deg);}
#festFx .bat{position:absolute;left:-12%;font-size:22px;opacity:.7;animation:fxFly 15s linear infinite;}
#festFx .b1{top:8%;} #festFx .b2{top:20%;animation-duration:21s;animation-delay:-7s;font-size:16px;} #festFx .b3{top:34%;animation-duration:18s;animation-delay:-12s;font-size:26px;}
@keyframes fxFly{0%{transform:translate(0,0)}25%{transform:translate(35vw,-14px)}50%{transform:translate(70vw,8px)}75%{transform:translate(95vw,-10px)}100%{transform:translate(125vw,0)}}
#festFx .gh{position:absolute;right:10px;bottom:30%;font-size:34px;opacity:.35;animation:fxFloat 4s ease-in-out infinite;}
@keyframes fxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#festFx .pk{position:absolute;bottom:6px;font-size:40px;opacity:.45;} #festFx .pl{left:8px;} #festFx .pr{right:8px;}
@media (prefers-reduced-motion:reduce){#festFx .bat,#festFx .gh{animation:none;}}

/* =====================================================
   events.js — 節日活動系統
   玩法：活動期間內完成活動任務 → 全部領完就解鎖該節日的「背景主題」，
        解鎖後在「🎉 活動」分頁選用，整個遊戲介面會換成節日風格。
   載入順序：data.js → battle.js → events.js → index.html 內的主程式
   新增節日：在 EVENTS 加一筆（日期、任務、theme.id），再到 index.html 的 CSS
            加上 :root[data-fest="主題id"] 的配色，以及下方 festFxHtml() 的裝飾即可。
   測試用：網址後面加 ?fest=halloween 可以強制開啟該活動（不受日期限制）。
   ===================================================== */

const EVENTS = [
  {
    id:'halloween', name:'萬聖節活動', emoji:'🎃',
    start:[10,1], end:[11,7],               // 每年 10/1 ~ 11/7
    intro:'夜晚的寶可夢們變得躁動不安……幫忙完成南瓜村的委託，就能解鎖萬聖節限定背景！',
    quests:[
      {id:'h1', name:'🎃 南瓜糖果：擊敗 20 隻寶可夢',            key:'wins',      target:20, reward:{items:{superpotion:3}}},
      {id:'h2', name:'👻 抓鬼大作戰：捕捉 3 隻幽靈或惡屬性寶可夢', key:'ghostCatch',target:3,  reward:{items:{ultraball:3}}},
      {id:'h3', name:'🕸️ 蛛網迷宮：在無限之塔通過 10 層',         key:'floors',    target:10, reward:{money:1500}},
      {id:'h4', name:'🦇 蝙蝠突襲：擊破 2 隻小魔王',              key:'bosses',    target:2,  reward:{items:{greatball:5}}},
      {id:'h5', name:'🧙 魔女的藥水：讓寶可夢進化 2 次',          key:'evolves',   target:2,  reward:{items:{ether:3}}},
      {id:'h6', name:'🍬 不給糖就搗蛋：擊敗 5 位訓練家',          key:'trainers',  target:5,  reward:{items:{maxpotion:2}}}
    ],
    finalReward:{money:3000},
    theme:{id:'halloween', name:'萬聖節背景', emoji:'🎃'}
  }
];

/* ---------- 日期 ---------- */
function festNow(){ return new Date(); }
function festForced(){ try{ return new URLSearchParams(location.search).get('fest'); }catch(e){ return null; } }
// 回傳 {active, start, end}：目前這一輪（或下一輪）活動的起訖日期
function festWindow(ev, now){
  now = now || festNow();
  const y = now.getFullYear();
  const mk = (yy)=>({ s:new Date(yy, ev.start[0]-1, ev.start[1]), e:new Date(yy, ev.end[0]-1, ev.end[1], 23, 59, 59) });
  let {s, e} = mk(y);
  if(e < s){ // 跨年（例如 12/15 ~ 1/5）
    if(now <= e){ s = mk(y-1).s; } else { e = mk(y+1).e; }
  }
  if(now > e){ const n = mk(y+1); s = n.s; e = n.e; }   // 今年已結束 → 顯示明年
  return {active: now >= s && now <= e, start: s, end: e};
}
function festActive(ev){ return festForced() === ev.id || festWindow(ev).active; }
function festActiveList(){ return EVENTS.filter(festActive); }
function festYear(){ return festNow().getFullYear(); }
const fmtMD = d => `${d.getMonth()+1}/${d.getDate()}`;

/* ---------- 進度 ---------- */
function festState(){
  if(!state.fest) state.fest = {joined:{}, themes:[], theme:'default'};
  if(!state.fest.joined) state.fest.joined = {};
  if(!Array.isArray(state.fest.themes)) state.fest.themes = [];
  return state.fest;
}
// 活動開始（或新的一年）第一次進來時，記下現在的統計數字當起點，之後只算活動期間的進度
function festTick(){
  const f = festState();
  festActiveList().forEach(ev=>{
    const j = f.joined[ev.id];
    if(!j || j.year !== festYear()){
      f.joined[ev.id] = {year:festYear(), base:Object.assign({}, state.stats), claimed:[], done:false};
      const w = festWindow(ev);
      mailAdd({id:`ev_${ev.id}_${festYear()}`, from:'活動中心', title:`${ev.emoji} ${ev.name}開始了！`,
        body:`${ev.intro}\n\n活動期間：${fmtMD(w.start)} – ${fmtMD(w.end)}\n點右上角的 🎉 → 活動，就能看到任務。`});
    }
  });
}
function festProg(ev, q){
  const j = festState().joined[ev.id]; if(!j) return 0;
  return Math.max(0, (state.stats[q.key]||0) - ((j.base && j.base[q.key])||0));
}
function festClaimable(){
  const f = festState();
  return festActiveList().some(ev=>{
    const j = f.joined[ev.id]; if(!j) return false;
    return ev.quests.some(q=> !j.claimed.includes(q.id) && festProg(ev,q) >= q.target);
  });
}
function festClaim(evId, qid){
  const ev = EVENTS.find(e=>e.id===evId); if(!ev || !festActive(ev)) return;
  festTick();
  const f = festState(), j = f.joined[evId], q = ev.quests.find(x=>x.id===qid);
  if(!j || !q || j.claimed.includes(qid) || festProg(ev,q) < q.target) return;
  j.claimed.push(qid);
  giveReward(q.reward);
  let msg = `${ev.emoji} 活動任務完成！獲得 ${rewardText(q.reward)}`;
  if(ev.quests.every(x=>j.claimed.includes(x.id)) && !j.done){
    j.done = true;
    giveReward(ev.finalReward);
    if(!f.themes.includes(ev.theme.id)){
      f.themes.push(ev.theme.id);
      f.theme = ev.theme.id;                  // 解鎖後直接套用
      applyFestTheme();
      msg = `${ev.emoji} 全部完成！解鎖【${ev.theme.name}】，並獲得 ${rewardText(ev.finalReward)}`;
      mailAdd({id:`evdone_${ev.id}_${festYear()}`, from:'活動中心', title:`${ev.emoji} ${ev.name}完成！`,
        body:`你完成了「${ev.name}」的全部任務，解鎖了【${ev.theme.name}】。\n\n到右上角的 🎉 → 活動，或選單的「檔案」分頁，就能切換背景。`});
    } else {
      msg = `${ev.emoji} 全部完成！獲得 ${rewardText(ev.finalReward)}`;
    }
  }
  if(state.party.length) saveGame();
  notify(msg); refreshPanels(); refreshMenuDot();
}

/* ---------- 背景主題 ---------- */
function festSetTheme(id){
  const f = festState();
  if(!themeOpen(id)){
    const ev = EVENTS.find(e=>e.theme.id===id);
    notify('🔒 尚未解鎖：完成「' + (ev ? ev.name : '活動') + '」全部任務'); return;
  }
  f.theme = id;
  applyFestTheme();
  if(state.party.length) saveGame();
  refreshPanels();   // 留在目前開著的視窗（檔案分頁或活動）
  const ev = EVENTS.find(e=>e.theme.id===id);
  notify('🖼 背景：' + (ev ? ev.theme.name : id==='light' ? LIGHT_THEME.name : DEFAULT_THEME.name));
}
function festFxHtml(id){
  if(id === 'halloween'){
    return '<div class="moon"></div><span class="web">🕸️</span>'
      + '<span class="bat b1">🦇</span><span class="bat b2">🦇</span><span class="bat b3">🦇</span>'
      + '<span class="gh">👻</span><span class="pk pl">🎃</span><span class="pk pr">🎃</span>';
  }
  return '';
}
function themeOpen(id){ return id==='default' || id==='light' || festState().themes.includes(id); }   // 終端機（黑／白）一開始就能用，節日背景要完成活動才解鎖
function applyFestTheme(){
  const f = festState(), id = (f.theme && themeOpen(f.theme)) ? f.theme : 'default';
  const root = document.documentElement;
  if(id === 'default') root.removeAttribute('data-fest'); else root.setAttribute('data-fest', id);
  const old = document.getElementById('festFx'); if(old) old.remove();
  const html = festFxHtml(id);
  if(html){ const d = document.createElement('div'); d.id = 'festFx'; d.innerHTML = html; document.body.appendChild(d); }
}

/* ---------- 「🎉 活動」分頁 ---------- */
// 背景主題選擇區（「🎉 活動」分頁和「👤 檔案」分頁共用）：預設叫「終端機」，其餘都是完成節日活動後解鎖
const DEFAULT_THEME = {id:'default', name:'終端機', emoji:'>_'};
const LIGHT_THEME = {id:'light', name:'終端機（白）', emoji:'>_'};
function festThemeGrid(){
  const f = festState();
  const themes = [DEFAULT_THEME, LIGHT_THEME].concat(EVENTS.map(ev=>Object.assign({}, ev.theme)));
  const cur = (f.theme && themeOpen(f.theme)) ? f.theme : 'default';
  let h = '<div class="frgrid">';
  themes.forEach(t=>{
    const open = themeOpen(t.id), on = cur===t.id;
    h += `<button class="frbtn${on?' on':''}${open?'':' lock'}" onclick="festSetTheme('${t.id}')"><span class="thchip th-${t.id}">${t.emoji}</span><small>${esc(t.name)}${on?' ✓':open?'':' 🔒'}</small></button>`;
  });
  return h + '</div>';
}
function festHtml(){
  const f = festState();
  const bar = (c,t)=>`<div class="qbar"><i style="width:${Math.min(100,Math.round(100*c/t))}%"></i></div>`;
  let h = '<div class="mh">🖼 背景（完成節日活動就能解鎖更多）</div>' + festThemeGrid();

  const act = festActiveList();
  if(!act.length) h += '<div class="qi"><div>目前沒有進行中的活動<small>敬請期待下一個節日！</small></div></div>';
  act.forEach(ev=>{
    const w = festWindow(ev), j = f.joined[ev.id] || {claimed:[], done:false};
    const left = Math.max(0, Math.ceil((w.end - festNow())/86400000));
    const forced = festForced() === ev.id && !w.active;
    h += `<div class="mh" style="margin-top:12px">${ev.emoji} ${esc(ev.name)}　<span class="sys">${forced?'（測試模式）':`${fmtMD(w.start)} – ${fmtMD(w.end)}・剩 ${left} 天`}</span></div>`;
    h += `<div class="qi"><div><small>${esc(ev.intro)}</small></div></div>`;
    ev.quests.forEach(q=>{
      const c = Math.min(festProg(ev,q), q.target), claimed = j.claimed.includes(q.id), ok = c >= q.target;
      h += `<div class="qi${ok&&!claimed?' done':''}"><div>${claimed?'✅ ':''}${esc(q.name)}<small>獎勵：${esc(rewardText(q.reward))}</small></div>${bar(c,q.target)}<div class="qrow"><span>${c} / ${q.target}</span>${claimed?'<span>已領取</span>':ok?`<button class="claim" onclick="festClaim('${ev.id}','${q.id}')">領取</button>`:'<span></span>'}</div></div>`;
    });
    const got = f.themes.includes(ev.theme.id);
    const doneN = ev.quests.filter(x=>j.claimed.includes(x.id)).length;
    h += `<div class="qi${got?' done':''}"><div>${got?'✅ ':'🎁 '}全部完成獎勵：${esc(ev.theme.name)}　${esc(rewardText(ev.finalReward))}<small>${got?'已解鎖，可在上方切換背景':`已領取 ${doneN} / ${ev.quests.length} 個任務`}</small></div></div>`;
  });

  const upcoming = EVENTS.filter(ev=>!festActive(ev)).map(ev=>({ev, w:festWindow(ev)})).sort((a,b)=>a.w.start-b.w.start);
  if(upcoming.length){
    h += '<div class="mh" style="margin-top:12px">即將到來</div>';
    upcoming.forEach(({ev,w})=>{ h += `<div class="qi"><div>${ev.emoji} ${esc(ev.name)}<small>${fmtMD(w.start)} – ${fmtMD(w.end)}</small></div></div>`; });
  }
  return h;
}


/* =====================================================
   信箱：系統信件、活動通知。信件可以附帶獎勵（附件領過就不能再領）。
   新增系統信件：在 MAIL_DEFS 加一筆；有 start:[年,月,日] 的信會等到那天才寄出。
   ===================================================== */
const MAIL_DEFS = [
  {id:'welcome', from:'大木博士', title:'歡迎來到寶可夢的世界！',
   body:'冒險的路上有很多挑戰：道館、無限之塔，還有傳說中的寶可夢。\n\n這是我準備的一點見面禮，祝你旅途順利！',
   reward:{items:{pokeball:5, potion:3}}},
  {id:'mailbox_open', from:'冒險事務局', title:'信箱開通了',
   body:'從現在開始，活動消息和系統通知都會寄到這裡。\n\n有 📎 的信帶有附件，記得打開領取。',
   reward:{items:{greatball:3}}},
  {id:'admin_title', from:'管理員', title:'🎖 專屬稱號「管理員」',
   body:'感謝你一起遊玩這款遊戲！\n\n這是送給你的專屬稱號「管理員」。\n\n⏳ 請在收到信件後 1 天內領取，超過期限就無法領取囉。\n領取後到「👤 檔案」分頁的稱號區按「裝備」，稱號就會顯示在主頁左上角。',
   start:[2026,10,10], claimDays:1, reward:{title:'admin'}},   // 10/10 起寄出；領取期限：收到後 1 天（想改期限就改這個天數）
  {id:'gen4_open', from:'冒險事務局', title:'神奧地方現已開放',
   body:'第四世代（神奧地方）的寶可夢、道館與傳說寶可夢都已經開放，期待你去挑戰！',
   reward:{items:{ultraball:3}}},
  {id:'shiny_gift', from:'冒險事務局', title:'✨ 色違寶可夢大贈送',
   body:'感謝你的遊玩！這是送給你的禮物：打開附件，會從全圖鑑（一般寶可夢、神獸、地區型態都有可能）隨機抽出一隻色違寶可夢送給你。\n\n抽到的寶可夢是 Lv.1，隊伍滿了會直接送到倉庫。',
   start:[2026,10,11], reward:{shiny:1}},
  {id:'gen9_open', from:'冒險事務局', title:'帕底亞地方現已開放',
   body:'第九世代（帕底亞地方）的 120 隻寶可夢、8 間新道館與 8 個新地點都已經開放，還有故勒頓、密勒頓等傳說寶可夢等你挑戰！',
   reward:{items:{ultraball:3, maxpotion:2}}}
];
const hubEl = document.getElementById('hub'), hbodyEl = document.getElementById('hbody');
let hubTab = 'event', hubMail = null;
function mailState(){
  if(!state.mail) state.mail = {box:[], seen:[]};
  if(!Array.isArray(state.mail.box)) state.mail.box = [];
  if(!Array.isArray(state.mail.seen)) state.mail.seen = [];
  return state.mail;
}
function mailAdd(m){
  const ms = mailState();
  if(ms.seen.includes(m.id)) return false;
  ms.seen.push(m.id);
  const now = festNow();
  ms.box.unshift({id:m.id, from:m.from||'系統', title:m.title, body:m.body||'', reward:m.reward||null,
                  date:now.toISOString(), read:false, claimed:false,
                  expires: m.claimDays ? new Date(now.getTime() + m.claimDays*86400000).toISOString() : null});   // 附件領取期限
  while(ms.box.length > 60){                     // 太多時，先清掉最舊的「已讀且附件已領」信件
    let k = -1; for(let i=ms.box.length-1;i>=0;i--){ const x = ms.box[i]; if(x.read && (!x.reward || x.claimed)){ k = i; break; } }
    if(k < 0) break; ms.box.splice(k,1);
  }
  return true;
}
function mailTick(){
  const now = festNow(); let added = false;
  MAIL_DEFS.forEach(d=>{
    if(d.start && now < new Date(d.start[0], d.start[1]-1, d.start[2])) return;
    if(mailAdd(d)) added = true;
  });
  if(added && state.party && state.party.length) saveGame();
}
const mailExpired = m => !!m.expires && festNow() > new Date(m.expires);
const mailClaimable = m => !!m.reward && !m.claimed && !mailExpired(m);
function mailLeft(m){   // 回傳「剩 N 天／N 小時」或「已過期」；沒有期限或已領取則回傳空字串
  if(!m.expires || !m.reward || m.claimed) return '';
  const ms = new Date(m.expires) - festNow();
  if(ms <= 0) return '已過期，無法領取';
  const h = Math.ceil(ms/3600000), d = Math.ceil(h/24);
  if(d >= 730) return `剩約 ${Math.floor(d/365)} 年`;
  if(d >= 60)  return `剩約 ${Math.floor(d/30)} 個月`;
  return h >= 24 ? `剩 ${d} 天` : `剩 ${h} 小時`;
}
function mailAttention(){ return mailState().box.some(m=>!m.read || mailClaimable(m)); }
const mailDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getMonth()+1}/${d.getDate()}`; };
function mailOpen(id){
  const m = mailState().box.find(x=>x.id===id); if(!m) return;
  m.read = true; hubMail = id;
  if(state.party.length) saveGame();
  renderHub(); refreshMenuDot();
}
function mailBack(){ hubMail = null; renderHub(); }
function mailClaim(id){
  const m = mailState().box.find(x=>x.id===id); if(!m || !mailClaimable(m)) return;
  m.claimed = true; m.read = true; const got = giveReward(m.reward);
  if(got.length) m.got = got.join('、');
  if(state.party.length) saveGame();
  notify('✉️ 領取附件：' + rewardText(m.reward) + (got.length ? '　抽到了 ' + got.join('、') + '！' : '')); renderHub(); refreshMenuDot();
}
function mailClaimAll(){
  const list = mailState().box.filter(mailClaimable);
  if(!list.length) return;
  const gots = [];
  list.forEach(m=>{ m.claimed = true; m.read = true; const got = giveReward(m.reward); if(got.length){ m.got = got.join('、'); gots.push(...got); } });
  if(state.party.length) saveGame();
  notify(`✉️ 一次領取了 ${list.length} 封信的附件` + (gots.length ? '　抽到了 ' + gots.join('、') + '！' : '')); renderHub(); refreshMenuDot();
}
function mailDelete(id){
  const ms = mailState(), m = ms.box.find(x=>x.id===id); if(!m) return;
  if(mailClaimable(m)){ notify('📎 這封信還有附件沒領，先領取再刪除'); return; }
  ms.box = ms.box.filter(x=>x.id!==id); hubMail = null;
  if(state.party.length) saveGame();
  renderHub(); refreshMenuDot();
}
function mailClean(){
  const ms = mailState(), n = ms.box.length;
  ms.box = ms.box.filter(m => !(m.read && !mailClaimable(m)));
  notify(n === ms.box.length ? '沒有可以清除的信件' : `已清除 ${n - ms.box.length} 封已讀信件`);
  if(state.party.length) saveGame();
  renderHub(); refreshMenuDot();
}
function mailHtml(){
  const ms = mailState();
  if(hubMail){
    const m = ms.box.find(x=>x.id===hubMail);
    if(m){
      let h = `<div class="mh">${esc(m.title)}</div><div class="sys">寄件人：${esc(m.from)}　${mailDate(m.date)}</div>`;
      h += `<div class="qi"><div style="white-space:pre-wrap">${esc(m.body)}</div></div>`;
      if(m.reward) h += `<div class="qi${mailClaimable(m)?' done':''}"><div>📎 附件：${esc(rewardText(m.reward))}${mailLeft(m)?`<small>⏳ 領取期限：${mailLeft(m)}</small>`:''}${m.got?`<small>🎁 抽到了：${esc(m.got)}</small>`:''}</div><div class="qrow"><span>${m.claimed?'✅ 已領取':mailExpired(m)?'⌛ 已過期':'尚未領取'}</span>${mailClaimable(m)?`<button class="claim" onclick="mailClaim('${m.id}')">領取附件</button>`:''}</div></div>`;
      h += `<div class="mailbtns"><button class="claim" onclick="mailBack()">← 返回信箱</button><button class="claim" onclick="mailDelete('${m.id}')">🗑 刪除</button></div>`;
      return h;
    }
    hubMail = null;
  }
  const un = ms.box.filter(m=>!m.read).length, att = ms.box.filter(mailClaimable).length;
  let h = `<div class="mh">共 ${ms.box.length} 封${un?`　<span style="color:var(--danger)">${un} 封未讀</span>`:''}${att?`　📎 ${att} 封有附件`:''}</div>`;
  if(ms.box.length){
    h += `<div class="mailbtns">${att?'<button class="claim" onclick="mailClaimAll()">全部領取</button>':''}<button class="claim" onclick="mailClean()">清除已讀</button></div>`;
    ms.box.forEach(m=>{
      h += `<div class="qi mailrow${m.read?'':' unread'}" onclick="mailOpen('${m.id}')"><div>${m.read?'':'🔴 '}${mailClaimable(m)?'📎 ':''}${esc(m.title)}<small>${esc(m.from)}　${mailDate(m.date)}${mailLeft(m)?'　⏳ '+mailLeft(m):''}</small></div></div>`;
    });
  } else h += '<div class="qi"><div>信箱是空的<small>活動消息和系統通知會寄到這裡</small></div></div>';
  return h;
}

/* ---------- 右上角「🎉 活動」「✉️ 信箱」視窗（各自獨立的按鈕，共用同一個視窗外框） ---------- */
function renderHub(){
  hbodyEl.innerHTML = (hubTab === 'mail') ? mailHtml() : festHtml();
  document.getElementById('hubTitle').textContent = (hubTab==='mail') ? '✉️ 信箱' : '🎉 活動';
}
function openHub(tab){
  if(typeof tab === 'string'){ if(tab !== hubTab) hubMail = null; hubTab = tab; }
  festTick(); mailTick();
  renderHub(); hubEl.classList.add('open'); refreshMenuDot();
}
function closeHub(){ hubEl.classList.remove('open'); hubMail = null; }
function refreshPanels(){   // 目前開著哪個視窗就重畫哪個
  if(hubEl.classList.contains('open')) renderHub();
  else if(typeof modalEl !== 'undefined' && modalEl.classList.contains('open')) openMenu();
}
</script>
<script>

/* ---------- CONSTANTS ---------- */
const MAX_LEVEL = 100;
const SHINY_RATE = 1/100;

const TOWER_EXP_MUL = 1.5;
const BOSS_LEVEL_BONUS = 5;
const ENDLESS_STAT_STEP = 0.1; // 無盡小魔王每一輪能力 +10%

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function monName(m){ return (m.shiny ? '✨' : '') + m.name; }

// 能力值：本傳公式（種族值 BASE_STATS 在 poke-data.js；個體值、努力值的部分由下面的「能力點」代替）
function statsFor(base, level){
  const f = b => Math.floor(2*b*level/100);
  return {hp: base[0] === 1 ? 1 : f(base[0]) + level + 10, atk:f(base[1])+5, def:f(base[2])+5, spa:f(base[3])+5, sdf:f(base[4])+5, spd:f(base[5])+5};
}
function baseStatsOf(dex, megaId){ return (megaId && MEGA_STATS[megaId]) || BASE_STATS[dex] || [70,70,70,70,70,70]; }
const STAT_VER = 2;   // 能力值公式版本：舊存檔讀進來時重算
/* ---------- 能力點（參考寶可夢冠軍：每一點直接加固定數值，不是百分比）----------
   六項各 20~60 點，遇到時隨機決定。抓到後可以重新分配，但六項總和不能超過抓到時的總和（ivCap）。
   加成：每點 +等級/100（HP 加倍，因為 HP 的數值本來就比較大）。Lv.50 時 60 點 ≈ +30。 */
const IV_KEYS = ['hp','atk','def','spa','sdf','spd'];
const IV_NAMES = {hp:'HP', atk:'攻擊', def:'防禦', spa:'特攻', sdf:'特防', spd:'速度'};
const IV_MIN = 20, IV_MAX = 60;
const PHYS_MOVES = new Set(['撞擊','捨身衝撞','掙扎']);   // 物理招式（吃攻擊／防禦），其他屬性招式吃特攻／特防
function rollIv(){ const iv = {}; IV_KEYS.forEach(k=>{ iv[k] = IV_MIN + Math.floor(Math.random()*(IV_MAX-IV_MIN+1)); }); return iv; }
const ivSum = iv => IV_KEYS.reduce((a,k)=>a + (iv[k]||0), 0);
function ensureIv(m){
  if(!m.iv || typeof m.iv !== 'object') m.iv = rollIv();
  IV_KEYS.forEach(k=>{ if(typeof m.iv[k] !== 'number') m.iv[k] = IV_MIN + Math.floor(Math.random()*(IV_MAX-IV_MIN+1)); });
  if(!(m.ivCap >= ivSum(m.iv))) m.ivCap = ivSum(m.iv);
  return m.iv;
}
function statsWithIv(base, level, iv){
  const st = statsFor(base, level), b = k => Math.floor((iv[k]||0) * level / 100);
  return {hp:st.hp === 1 ? 1 : st.hp + 2*b('hp'), atk:st.atk + b('atk'), def:st.def + b('def'), spa:st.spa + b('spa'), sdf:st.sdf + b('sdf'), spd:st.spd + b('spd')};
}
function monStats(m){ ensureIv(m); return natureStats(statsWithIv(baseStatsOf(m.dex, m._mega && m._mega.id), m.level, m.iv), ensureNature(m)); }
function setNonHpStats(m, st){ m.atk = st.atk; m.def = st.def; m.spa = st.spa; m.sdf = st.sdf; m.spd = st.spd; }
let gotSeq = 0;   // 獲得序號：每隻寶可夢誕生時蓋一個，倉庫「獲得順序」排序用（舊存檔在 loadGame 補）
function makeMon(dexIndex, level, opts){
  opts = opts || {};
  level = Math.max(1, Math.min(MAX_LEVEL, level));
  const e = DEX[dexIndex];
  const iv = opts.iv ? Object.assign({}, opts.iv) : rollIv();
  const nature = (opts.nature >= 0) ? opts.nature : rollNature();
  const st = natureStats(statsWithIv(baseStatsOf(dexIndex), level, iv), nature);
  const abSlot = (opts.abSlot >= 0) ? opts.abSlot : rollAbilitySlot(dexIndex);
  const shiny = (opts.shiny !== undefined) ? opts.shiny : (Math.random() < shinyRate());
  return {
    dex: dexIndex, name:e[0], t1:e[1], t2:e[2], tier:e[3],
    level, hp:st.hp, maxhp:st.hp, atk:st.atk, def:st.def, spa:st.spa, sdf:st.sdf, spd:st.spd,
    iv, ivCap: opts.ivCap || ivSum(iv), nature, ab: (opts.ab && ABILITIES[opts.ab]) ? opts.ab : abilityAt(dexIndex, abSlot), abSlot, sv:STAT_VER,
    gender: opts.gender !== undefined ? opts.gender : rollGender(dexIndex), tera:e[1],
    exp:0, expNext: 18 + level*9, moves: defaultMoves(dexIndex, level), xm:[], friend:70,
    status:null, atkMul:1, defMul:1, shiny, got:++gotSeq
  };
}
// 等級封頂 Lv.100 之後，用數值倍率拉開難度：地圖第 25 區起、道館第 23 間起逐步增強
const zoneBoost = z => 1 + Math.max(0, z-25)*0.02;
const gymBoost  = i => 1 + Math.max(0, i-22)*0.03;
function boostMon(m, f){
  if(!(f > 1.001)) return m;
  m.boost = f;
  m.maxhp = Math.round(m.maxhp*f); m.hp = m.maxhp;
  scaleAD(m, 1+(f-1)*0.6, 1+(f-1)*0.5, Math.round);
  return m;
}
// 攻擊＋特攻乘 fa、防禦＋特防乘 fd（各種強化倍率共用）
function scaleAD(m, fa, fd, r){
  r = r || Math.round;
  m.atk = r(m.atk*fa); m.spa = r((m.spa ?? m.atk/fa)*fa);
  m.def = r(m.def*fd); m.sdf = r((m.sdf ?? m.def/fd)*fd);
}
function unboostMon(m){            // 抓到之後還原成一般數值
  if(!m.boost) return;
  const st = monStats(m), ratio = m.hp/m.maxhp;
  m.maxhp = st.hp; setNonHpStats(m, st);
  m.hp = Math.max(1, Math.round(st.hp*ratio));
  delete m.boost;
}
const STRUGGLE = {name:'掙扎', type:'一般', cls:0, power:50, acc:0, pri:0, fx:'', recoil:0.25, struggle:true};
function restorePP(m){ (m.moves||[]).forEach(mv=>{ if(mv.maxpp) mv.pp = mv.maxpp; }); }
function typesOf(m){ return m._tera ? [m._tera] : (m._types || [m.t1, m.t2]); }   // _types：對戰中被浸水、變身等改掉的屬性
function typeStr(m){ return m.t2 ? m.t1+"／"+m.t2 : m.t1; }
function isFinalForm(dexIdx){ return !EVO[dexIdx] && !(STONE_EVO[dexIdx] && Object.keys(STONE_EVO[dexIdx]).length) && !TIME_EVO[dexIdx] && !EVO_COND[dexIdx] && FAIRY_EVO[dexIdx] === undefined; }

/* ---------- TOWER MODE ---------- */
const LEGENDARIES = [143,144,145,149,150, 242,243,244,248,249,250, 376,377,378,379,380,381,382,383,384,385,
  479,480,481,482,483,484,485,486,487, 489,490,491,492,
  637,638,639,640,641,642,643,644,645, 493, 646,647,648,
  715,716,717, 718,719,720,
  784,785,786,787, 790,791, 792,793,794,795,796,797,798, 799, 804,805, 800,801,806,
  887,888,889, 893,894,895,896,897, 904, 892,
  932,933,934,
  1057,1058,1059,1060, 1063,1064, 1065,1066, 1070,1071,1072, 1073, 1076,1077,1078,1079, 1080, 1081]; // 第九世代：古簡蝸／古劍豹／古鼎鹿／古玉魚、故勒頓／密勒頓、波盪水／鐵斑葉、夠讚狗／願增猿／吉雉雞、厄鬼椪、破空焰／猛雷鼓／鐵磐岩／鐵頭殼、太樂巴戈斯／（幻之）桃歹郎。 // 伽勒爾形態的三神鳥（伽勒爾急凍鳥／閃電鳥／火焰鳥）接在最後。// 第八世代：蒼響、藏瑪然特、無極汰那、雷吉艾勒奇、雷吉鐸拉戈、雪暴馬、靈幽馬、蕾冠王、眷戀雲／（幻之）薩戮德。 第七世代：四卡璞、索爾迦雷歐、露奈雅拉、7 隻究極異獸、奈克洛茲瑪、壘磊石、砰頭小丑／（幻之）瑪機雅娜、瑪夏多、捷拉奧拉。 第六世代：哲爾尼亞斯 伊裴爾塔爾 基格爾德／（幻之）蒂安希 胡帕 波爾凱尼恩。 第五世代：勾帕路翁 代拉基翁 畢力吉翁 龍捲雲 雷電雲 萊希拉姆 捷克羅姆 土地雲 酋雷姆／（幻之）比克提尼 凱路迪歐 美洛耶塔 蓋諾賽克特。 第三世代：雷吉洛克 雷吉艾斯 雷吉斯奇魯 拉帝亞斯 拉帝歐斯 蓋歐卡 固拉多 烈空坐 基拉祈 代歐奇希斯／第四世代：由克希 艾姆利多 亞克諾姆 帝牙盧卡 帕路奇亞 席多藍恩 雷吉奇卡斯 騎拉帝納 克雷色利亞 瑪納霏 達克萊伊 謝米 阿爾宙斯
// // 急凍鳥 閃電鳥 火焰鳥 超夢 夢幻 雷公 炎帝 水君 洛奇亞 鳳王 時拉比
const NONLEG = []; for(let i=0;i<DEX.length;i++){ if(!LEGENDARIES.includes(i)) NONLEG.push(i); }
const BOSSES = NONLEG.filter(isFinalForm); // 最終進化型（含無進化的單一型態），全破後的無盡循環名單
const COIN_COST = 50;
const LEGENDARY_COST = [50,50,60,90,150, 80,80,80,120,120,200, 100,100,100,130,130,170,170,220,260,260,
  110,110,110,160,160,170,190,230,150, 280,300,300,400,
  120,120,120,130,130,180,180,150,220, 200,280,300,350,
  240,240,300, 330,360,400,
  200,200,200,200, 280,280, 260,260,260,260,260,260,260, 350, 260,260, 380,400,420,
  300,300,380, 320,320,340,340,420, 360, 450,
  360,360,360,
  400,400,400,400, 480,480, 420,420, 380,380,380, 460, 420,420,420,420, 500, 550];
// 幻之寶可夢（夢幻=第一世代、時拉比=第二世代）：需清空該世代的普通樓層＋第二輪小魔王（無等級限制）
const MYTHIC_GEN = {4:1, 10:2, 19:3, 20:3, 30:4, 31:4, 32:4, 33:4, 43:5, 44:5, 45:5, 46:5, 50:6, 51:6, 52:6, 69:7, 70:7, 71:7, 81:8, 102:10}; // 神獸順序編號 -> 世代（10 = 第九世代帕底亞，因為第 9 組是地區型態）
const GEN_SPLIT = 151;
const GEN_START = [0, 0, 151, 251, 386, 493, 649, 721, 809, 905, 962, DEX.length];   // 第 9 組＝地區型態（索引 905~961）、第 10 組＝第九世代帕底亞（索引 962 起） // 依世代編號取得該世代的起點；GEN_START[gen+1] 為終點          // 圖鑑編號 0~150 為第一世代
function isMythicPtr(ptr){ return MYTHIC_GEN[ptr] !== undefined; }
const ROUND2_MUL = 1.3, ROUND2_HP_MUL = 1.8; // 第二輪小魔王：能力 ×1.3、HP ×1.8，之後每多一輪再加強
function genProgress(gen){
  const t = state.tower, inGen = i => i >= GEN_START[gen] && i < GEN_START[gen+1];
  const floors = NONLEG.filter(inGen), bosses = BOSSES.filter(inGen);
  let floorsDone = 0; NONLEG.forEach((d,p)=>{ if(inGen(d) && isCleared(p)) floorsDone++; });
  const bossDone = t.loop>=1 ? bosses.length : Math.max(0, Math.min(bosses.length, t.endlessPtr - BOSSES.indexOf(bosses[0])));
  return {floorsDone, floorsTotal:floors.length, bossDone, bossTotal:bosses.length};
}
// 已通過的樓層（'0'/'1' 字串，位置＝NONLEG 的順序）。可以跳世代進塔，所以進度不能只靠 floorPtr
function towerCl(){ const t = state.tower; if(typeof t.cl !== 'string' || t.cl.length !== NONLEG.length) t.cl = (typeof t.cl==='string' ? t.cl : '').padEnd(NONLEG.length,'0').slice(0,NONLEG.length); return t.cl; }
function isCleared(p){ return towerCl()[p] === '1'; }
function markCleared(p){ const c = towerCl(); state.tower.cl = c.slice(0,p) + '1' + c.slice(p+1); }
function firstUncleared(){ return towerCl().indexOf('0'); }
function clearedCount(){ const c = towerCl(); let n = 0; for(let i=0;i<c.length;i++) if(c[i]==='1') n++; return n; }
const TOWER_GEN_NAME = {1:'關都',2:'城都',3:'豐緣',4:'神奧',5:'合眾',6:'卡洛斯',7:'阿羅拉',8:'伽勒爾',9:'地區型態',10:'帕底亞'};
function towerGenLabel(g){ return g===9 ? '地區型態' : `第${g===10?9:g}世代 ${TOWER_GEN_NAME[g]}`; }
function towerGenOf(dexIdx){ for(let g=1; g<=10; g++) if(dexIdx >= GEN_START[g] && dexIdx < GEN_START[g+1]) return g; return 0; }
// 一段的結尾：最終進化型，或下一隻已經是別的世代（例如帕底亞烏波的進化土王排在第九世代後面，不讓它和第九世代的樓層連成同一段）
function isSegEnd(ptr){ return isFinalForm(NONLEG[ptr]) || (ptr+1 < NONLEG.length && towerGenOf(NONLEG[ptr]) !== towerGenOf(NONLEG[ptr+1])); }
function isBossFloor(ptr){ return ptr >= NONLEG.length || isSegEnd(ptr); }
// 本段（進化鏈）第一層：往回找到上一個小魔王之後那一層
function segmentStart(ptr){
  if(ptr >= NONLEG.length) return ptr;
  let s = ptr;
  while(s > 0 && !isSegEnd(s-1)) s--;
  return s;
}
function atSegmentStart(){ return state.tower.floorPtr === segmentStart(state.tower.floorPtr); }
function segmentBossName(){
  let p = state.tower.floorPtr;
  while(p < NONLEG.length && !isSegEnd(p)) p++;
  return p < NONLEG.length ? DEX[NONLEG[p]][0] : '';
}
function legendaryGate(ptr){
  const cost = LEGENDARY_COST[ptr] ?? COIN_COST;
  const coinsOk = state.tower.coins >= cost;
  if(!isMythicPtr(ptr)) return { ok: coinsOk, cost, coinsOk, floorsOk:true, bossOk:true };
  const gen = MYTHIC_GEN[ptr], gp = genProgress(gen);
  const floorsOk = gp.floorsDone >= gp.floorsTotal, bossOk = gp.bossDone >= gp.bossTotal;
  return { ok: coinsOk && floorsOk && bossOk, cost, coinsOk, floorsOk, bossOk, gp, gen };
}

function towerFloorLevel(ptr){ return Math.min(MAX_LEVEL, 6 + Math.floor(ptr*1.15)); }
// 神獸強化：越後面的神獸越強（第 20 隻之後固定在最高）。HP ×2.2~3.2、能力 ×1.25~1.65，招式威力 ×1.25，再多一招專屬大招
function legendaryMul(ptr){ return 1.25 + Math.min(ptr, 20)*0.02; }
function legendaryHpMul(ptr){ return 2.2 + Math.min(ptr, 20)*0.05; }
function legendaryLevel(ptr){ return Math.min(MAX_LEVEL, ptr < 5 ? 48 + ptr*12 : 62 + (ptr-5)*7); }
function endlessMul(){ return ROUND2_MUL + state.tower.loop * ENDLESS_STAT_STEP; }
function endlessHpMul(){ return ROUND2_HP_MUL + state.tower.loop * 0.2; }

function typeChips(m){ return [m.t1, m.t2].filter(Boolean).map(t=>`<span class="tc" style="background:${TYPE_COLOR[t]||'#555'}">${t}</span>`).join(''); }
function monCardHtml(m, opt){

    + (opt.noHp ? '' : `<span class="pc3">HP ${m.hp}/${m.maxhp}</span>`);

function setOptions(list, phase){
  syncBattleUI(phase);
  refreshMenuDot();
  holdOptionsUntilRevealed();
  optsEl.innerHTML = "";
  // o.row：同一個值、連在一起的按鈕排成一列平分寬度（超過 5 顆就平均分兩列）；o.ic：圖示放上面、文字放下面的小方塊
  let grp = null;
  const flush = ()=>{
    if(!grp) return;
    const n = grp.length, per = n <= 5 ? n : Math.ceil(n/2);
    for(let s = 0; s < n; s += per){
      const row = document.createElement('div');
      row.className = 'orow';
      grp.slice(s, s+per).forEach(b=>row.appendChild(b));
      optsEl.appendChild(row);
    }
    grp = null;
  };
  list.forEach(o=>{
    const b = document.createElement('button');
    b.className = 'opt' + (o.half?' half':'') + (o.ic?' tile':'') + (o.cls?' '+o.cls:'');
    b.innerHTML = o.html || (o.ic ? `<span class="ic">${o.ic}</span><span class="tl">${esc(o.label)}</span>${o.sub ? `<span class="ts">${esc(o.sub)}</span>` : ''}` : esc(o.label));
    b.onclick = o.action;
    if(o.row){
      if(grp && grp.key !== o.row) flush();
      if(!grp){ grp = []; grp.key = o.row; }
      grp.push(b);
    } else { flush(); optsEl.appendChild(b); }
  });
  flush();
  const hint = document.createElement('div');
  hint.id = 'skipHint';
  hint.textContent = '（點一下上方文字可跳過動畫）';
  optsEl.appendChild(hint);
}

/* ---------- SAVE / LOAD ---------- */
const SAVE_KEY = 'pkmn_tower_save_v2';
const OLD_SAVE_KEY = 'pkmn_tower_save_v1';
function saveGame(){
  try{
    const data = {
      v:2, party:(typeof svRun!=='undefined' && svRun) ? svRun.backup : (typeof fac!=='undefined' && fac && fac.backup) ? fac.backup : (typeof bt!=='undefined' && bt && bt.backup) ? bt.backup : state.party, box:state.box,   // 連戰試煉中存檔，存的是原本的隊伍
      seen:Array.from(state.seen), caught:Array.from(state.caught), shinyCaught:Array.from(state.shinyCaught), mega:state.mega,
      bag:state.bag, money:state.money, zone:state.zone, maxZone:state.maxZone, tower:state.tower,
      stats:state.stats, quest:state.quest, ach:state.ach, meta:state.meta, checkin:state.checkin, profile:state.profile, fest:state.fest, mail:state.mail, tms:state.tms
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  }catch(e){ return false; }
}
function fixMon(m){
  if(!m) return m;
  const fixed = Object.assign({status:null, atkMul:1, defMul:1, shiny:false}, m);
  if(fixed.level > MAX_LEVEL) fixed.level = MAX_LEVEL;
  if(fixed.level >= MAX_LEVEL) fixed.exp = 0;
  if(fixed._mega) megaRevert(fixed);   // 存檔時剛好在 Mega 進化中：還原成原本的樣子
  migrateMoves(fixed);                 // 舊存檔的招式換成本傳招式；補上親密度
  const needNature = !(fixed.nature >= 0 && fixed.nature < NATURES.length);   // 舊存檔：補上性格、特性
  if(needNature) fixed.nature = rollNature();
  ensureAbility(fixed);
  if(fixed.held && !HELD[fixed.held]) delete fixed.held;
  ensureGender(fixed); teraOf(fixed);
  if(needNature || !fixed.iv || fixed.spa === undefined || fixed.sdf === undefined || fixed.sv !== STAT_VER){   // 舊存檔：補上隨機能力點、改用種族值重算數值（HP 比例不變）
    fixed.sv = STAT_VER;
    delete fixed.boost;
    const ratio = fixed.maxhp ? fixed.hp/fixed.maxhp : 1, st = monStats(fixed);
    fixed.maxhp = st.hp; fixed.hp = fixed.hp > 0 ? Math.max(1, Math.round(st.hp*ratio)) : 0; setNonHpStats(fixed, st);
  }
  return fixed;
}
function loadGame(){
  try{
    let raw = localStorage.getItem(SAVE_KEY);
    if(!raw) raw = localStorage.getItem(OLD_SAVE_KEY); // 舊版存檔自動轉移
    if(!raw) return false;
    const d = JSON.parse(raw);
    state.party = Array.isArray(d.party) ? d.party.map(fixMon) : [];
    state.box = Array.isArray(d.box) ? d.box.map(fixMon) : [];
    gotSeq = 0;   // 補上獲得序號：新存檔沿用，舊存檔的寶可夢依現有順序（先隊伍、後倉庫）排
    [...state.party, ...state.box].forEach(m=>{ if(m && m.got > gotSeq) gotSeq = m.got; });
    [...state.party, ...state.box].forEach(m=>{ if(m && m.got === undefined) m.got = ++gotSeq; });
    state.seen = new Set(d.seen||[]);
    state.caught = new Set(d.caught||[]);
    state.shinyCaught = new Set(d.shinyCaught||[]);
    state.mega = {shards:Object.assign({}, d.mega&&d.mega.shards), stones:Object.assign({}, d.mega&&d.mega.stones), seen:Object.assign({}, d.mega&&d.mega.seen)};
    state.bag = Object.assign(defaultBag(), d.bag||{});
    state.money = (typeof d.money === 'number') ? d.money : START_MONEY;
    state.zone = d.zone || 1;
    state.maxZone = Math.max(d.maxZone || 1, state.zone);
    const oldTower = !(d.tower && d.tower.rev);
    state.tower = Object.assign(defaultTower(), d.tower||{});
    if(!(d.tower && typeof d.tower.cl === 'string')) state.tower.cl = '1'.repeat(Math.min(state.tower.floorPtr||0, NONLEG.length));   // 舊存檔：floorPtr 之前的樓層視為已通過
    towerCl();
    if(!(d.tower && d.tower.coinPtr!==undefined)) state.tower.coinPtr = state.tower.floorPtr; // 舊存檔：已通過的樓層視為已領過硬幣
    state.meta = Object.assign(defaultMeta(), d.meta||{});
    state.checkin = Object.assign({ym:'',days:[]}, d.checkin||{});
    state.profile = Object.assign({name:'',titleId:'',frame:'auto'}, d.profile||{});
    state.fest = Object.assign({joined:{},themes:[],theme:'default'}, d.fest||{});
    state.mail = Object.assign({box:[],seen:[]}, d.mail||{});
    state.tms = Object.assign({}, d.tms||{});
    state.stats = Object.assign({}, d.stats||{});
    state.quest = Object.assign({base:{}}, d.quest||{});
    state.ach = Object.assign({done:[],claimed:[]}, d.ach||{});
    if(oldTower){ state.tower.rev = 3; state.tower.endlessPtr = 0; state.tower.loop = 0; } // 舊版無盡進度與新規則不相容，重置
    return state.party.length>0;
  }catch(e){ return false; }
}

/* ---------- EXPORT / IMPORT ---------- */
let pendingImport = null, saveIOBack = null;
function getSaveRaw(){
  if(state.party.length) saveGame();
  try{ return localStorage.getItem(SAVE_KEY); }catch(e){ return null; }
}
function encodeSave(raw){ return btoa(unescape(encodeURIComponent(raw))); }
function decodeSave(text){
  text = (text||'').trim();
  if(!text) throw new Error('empty');
  let raw = text;
  if(text[0] !== '{') raw = decodeURIComponent(escape(atob(text.replace(/\s+/g,''))));
  const d = JSON.parse(raw);
  if(!d || !Array.isArray(d.party) || !d.party.length) throw new Error('invalid');
  return {raw, d};
}
function downloadText(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function screenSaveIO(back){
  if(typeof back === 'function') saveIOBack = back;
  clearLog();
  print('<span class="em">💾 存檔匯出 / 匯入</span>');
  print('存檔只存在「這個瀏覽器」裡：從 LINE、Safari、Chrome 各自打開，存檔都是分開的；換手機或清除瀏覽資料也會消失。想在不同地方接著玩，請在舊的地方匯出，再到新的地方匯入。');
  print('<div style="margin:10px 0 4px" class="sys">從檔案匯入：</div><input type="file" id="saveFile" accept=".json,.txt,application/json,text/plain" style="width:100%;color:var(--text);font-size:13px">');
  print('<div style="margin:10px 0 4px" class="sys">或把存檔代碼貼在這裡：</div><textarea id="saveBox" rows="4" spellcheck="false" style="width:100%;box-sizing:border-box;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px;font-family:monospace"></textarea>');
  document.getElementById('saveFile').onchange = function(e){
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=> stageImport(String(fr.result));
    fr.onerror = ()=> print('<span class="bad">檔案讀取失敗。</span>');
    fr.readAsText(f);
  };
  setOptions([
    {label:'📤 匯出存檔', action:exportSaveFile},
    {label:'📋 複製存檔代碼', half:true, action:exportSaveCopy},
    {label:'📥 匯入貼上的代碼', half:true, action:()=> stageImport(document.getElementById('saveBox').value)},
    {label:'返回', action:()=> (saveIOBack || screenCover)()}
  ]);
}
function exportSaveFile(){
  const raw = getSaveRaw();
  if(!raw){ print('<span class="bad">目前沒有可匯出的存檔。</span>'); return; }
  const d = new Date(), p = n=>String(n).padStart(2,'0');
  downloadText(`pokemon-save-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`, raw);
  print('<span class="good">已匯出存檔檔案。若沒有跳出下載，請改用「複製存檔代碼」。</span>');
}
function exportSaveCopy(){
  const raw = getSaveRaw();
  if(!raw){ print('<span class="bad">目前沒有可匯出的存檔。</span>'); return; }
  const code = encodeSave(raw), box = document.getElementById('saveBox');
  box.value = code;
  const ok = ()=> print('<span class="good">已複製存檔代碼！請貼到記事本或傳給自己保存。</span>');
  const fallback = ()=>{
    box.focus(); box.select();
    let done = false; try{ done = document.execCommand('copy'); }catch(e){}
    if(done) ok(); else print('<span class="sys">請手動長按上方文字框，全選後複製。</span>');
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(ok, fallback);
  else fallback();
}
function stageImport(text){
  let r;
  try{ r = decodeSave(text); }catch(e){ print('<span class="bad">讀取失敗：這不是有效的存檔。</span>'); return; }
  pendingImport = r.raw;
  clearLog();
  print('<span class="bad">確定要用匯入的存檔覆蓋目前本機存檔嗎？目前的進度會消失。</span>');
  print(`匯入存檔：隊伍 ${r.d.party.length} 隻　💰 ${r.d.money||0}　🪙 ${(r.d.tower&&r.d.tower.coins)||0}　圖鑑 ${(r.d.caught||[]).length}/${DEX.length}`);
  setOptions([
    {label:'是，覆蓋並讀取', action:confirmImport},
    {label:'取消', action:()=> screenSaveIO()}
  ]);
}
function confirmImport(){
  let prev = null;
  try{ prev = localStorage.getItem(SAVE_KEY); localStorage.setItem(SAVE_KEY, pendingImport); }
  catch(e){ print('<span class="bad">無法寫入本機存檔。</span>'); return; }
  state.battle = null; pendingImport = null;
  if(loadGame()){ saveGame(); screenContinue(); return; }
  try{ if(prev===null) localStorage.removeItem(SAVE_KEY); else localStorage.setItem(SAVE_KEY, prev); }catch(e){}
  loadGame();
  print('<span class="bad">匯入失敗，存檔內容有問題，已保留原本的進度。</span>');
  setOptions([{label:'返回', action:()=> screenSaveIO()}]);
}

const ZONE_WIN_NEED = 50;
function zoneWins(z){ const w = state.meta.zoneWins; return (w && w[z]) || 0; }
function addZoneWin(){   // 野外打倒／抓到、路上訓練家打贏時呼叫

}

function zoneName(z){ return MAP_NAMES[Math.min(z, MAP_NAMES.length)-1]; }
// 進化階段：1=基本、2=一階進化、3=二階進化；沒有進化的寶可夢依強度歸類
const EVO_FROM = {};
(function(){
  const link = (a,b)=>{ EVO_FROM[b] = a; };
  for(const k in EVO){ const t = EVO[k][0]; (Array.isArray(t)?t:[t]).forEach(b=>link(+k,b)); }
  for(const k in STONE_EVO) Object.values(STONE_EVO[k]).forEach(b=>[].concat(b).forEach(x=>link(+k,x)));
  for(const k in EVO_COND) EVO_COND[k].forEach(c=>link(+k,c.to));
  for(const k in FAIRY_EVO) link(+k, FAIRY_EVO[k]);
  for(const k in TIME_EVO){ link(+k,TIME_EVO[k].day); link(+k,TIME_EVO[k].night); }
})();
function evoStage(i){
  let s = 1, c = i; while(EVO_FROM[c]!==undefined){ s++; c = EVO_FROM[c]; }
  if(s===1 && isFinalForm(i)) return Math.min(3, DEX[i][3]); // 單一型態：依強度 tier 分類
  return s;
}
const WILD_BY_STAGE = [[],[],[],[]];
DEX.forEach((e,i)=>{ if(!LEGENDARIES.includes(i)) WILD_BY_STAGE[evoStage(i)].push(i); }); // 神獸只能在塔裡遇到
// 各地點出現 [基本, 一階, 二階] 的機率
function stageWeights(zone){
  if(zone<=4)  return [1, 0, 0];
  if(zone<=8)  return [0.75, 0.25, 0];
  if(zone<=12) return [0.55, 0.45, 0];
  if(zone<=16) return [0.4, 0.45, 0.15];
  if(zone<=20) return [0.25, 0.45, 0.3];
  return [0.15, 0.4, 0.45];
}
function pickWildIndex(zone){
  const w = stageWeights(zone);
  let r = Math.random(), s = 1;
  if(r < w[0]) s = 1; else if(r < w[0]+w[1]) s = 2; else s = 3;
  const pool = biasPool(WILD_BY_STAGE[s]);   // 天氣、今日大量出現的屬性比較常出現
  return pool[Math.floor(Math.random()*pool.length)];
}
/* ---------- 圖鑑保底：連續 PITY_N-1 次遇到的都是已經抓過的，第 PITY_N 次一定是沒抓過的（神獸不在野外出現，不算） ---------- */
const PITY_N = 50;
function uncaughtWild(){ return NONLEG.filter(i=>!state.caught.has(i)); }
function pityLabel(){
  if(!uncaughtWild().length) return '';
  const left = PITY_N - Math.min(PITY_N-1, state.meta.pity||0);   // 還要打倒／抓到幾隻（已抓過的），下一隻才會保證是新的
  return left <= 1 ? '・下一隻必出沒抓過的' : `・再打倒／抓 ${left-1} 隻必出新的`;
}
// 計數只在「打倒」或「抓到」時才算（逃跑、我方被打倒都不算）；保底觸發後，要真的把新的那隻抓起來才會歸零
function pickWildIndexPity(zone){
  if((state.meta.pity||0) >= PITY_N-1){
    const w = stageWeights(zone);
    let r = Math.random(), s = (r < w[0]) ? 1 : (r < w[0]+w[1]) ? 2 : 3;
    let pool = WILD_BY_STAGE[s].filter(i=>!state.caught.has(i));
    if(!pool.length) pool = uncaughtWild();    // 這個階段的都抓過了：改從全部沒抓過的挑
    if(pool.length) return pool[Math.floor(Math.random()*pool.length)];
  }
  return pickWildIndex(zone);
}
function pityResolve(w, caught){   // 野外遭遇結算：caught=true 抓到、false 打倒
  if(!w || !w._pw) return;
  if(w._newBefore){ if(caught) state.meta.pity = 0; }   // 新的那隻：抓到才歸零，打倒不算也不扣
  else state.meta.pity = (state.meta.pity||0) + 1;
  delete w._pw; delete w._newBefore;
}
function firstAlive(){
  for(let i=0;i<state.party.length;i++) if(state.party[i].hp>0) return i;
  return -1;
}

function buyItem(k){

/* ---------- MEGA 系統 ----------
   Mega 對戰：每次隨機遇到一隻 Mega 寶可夢（Lv.50~70），打贏拿到那一隻的碎片。
   集滿 10 片可合成進化石；有進化石的寶可夢在對戰中可以 Mega 進化一次（對戰結束就恢復原狀）。
   Mega 商店：5 片任意碎片換 1 片指定碎片（碎片只能靠 Mega 對戰和商店取得）。 */
const MEGA_BY_ID = {}; MEGAS.forEach(m=>{ MEGA_BY_ID[m.id] = m; });
const MEGA_NEED = 10, MEGA_SWAP = 5, MEGA_LV_MIN = 50, MEGA_LV_MAX = 70;
const MEGA_FOE_MUL = {hp:1.3, atk:1.35, def:1.3, spd:1.25}, MEGA_ME_MUL = {atk:1.35, def:1.3, spd:1.25};
function megaState(){
  if(!state.mega || typeof state.mega !== 'object') state.mega = {};
  if(!state.mega.shards || typeof state.mega.shards !== 'object') state.mega.shards = {};
  if(!state.mega.stones || typeof state.mega.stones !== 'object') state.mega.stones = {};
  if(!state.mega.seen || typeof state.mega.seen !== 'object') state.mega.seen = {};
  return state.mega;
}
const megaShards = id => megaState().shards[id] || 0;
const megaTotalShards = () => Object.values(megaState().shards).reduce((a,b)=>a+(b||0), 0);
const megaStoneCount = () => MEGAS.filter(m=>megaState().stones[m.id]).length;
const megaEntry = m => [m.name, m.t1, m.t2, DEX[m.base][3]];
function makeMegaFoe(m, lvl){
  const f = makeMon(m.base, lvl, {shiny:false});
  f.name = m.name; f.t1 = m.t1; f.t2 = m.t2; f.megaId = m.id;
  f.maxhp = Math.round(f.maxhp*MEGA_FOE_MUL.hp); f.hp = f.maxhp;
  f._mega = {id:m.id}; setNonHpStats(f, monStats(f)); delete f._mega;   // 用 Mega 的種族值
  if(MEGA_ABIL[m.id]) f.ab = MEGA_ABIL[m.id];
  return f;
}
function megaFormsFor(p){ const st = megaState().stones; return MEGAS.filter(m=>m.base===p.dex && st[m.id]); }
function megaEvolve(p, m){
  p._mega = {id:m.id, ab:p.ab};   // 招式不變（跟本傳一樣）；能力值改用 Mega 的種族值、特性換成 Mega 的
  p.name = m.name; p.t1 = m.t1; p.t2 = m.t2;
  setNonHpStats(p, monStats(p));
  if(MEGA_ABIL[m.id]){ p.ab = MEGA_ABIL[m.id]; }
}
function megaRevert(p){
  if(!p || !p._mega) return;
  const e = DEX[p.dex], ab = p._mega.ab;
  delete p._mega.id; const st = natureStats(statsWithIv(baseStatsOf(p.dex), p.level, p.iv), ensureNature(p));
  p.name = e[0]; p.t1 = e[1]; p.t2 = e[2]; setNonHpStats(p, st);
  if(ab) p.ab = ab;
  delete p._mega;
}
function megaRevertAll(){ (state.party||[]).forEach(megaRevert); (state.box||[]).forEach(megaRevert); }

function screenMegaBattle(keepLog){

  print(`集滿 ${MEGA_NEED} 片可以合成進化石。有進化石的寶可夢，在對戰中可以 Mega 進化一次（對戰結束就恢復原狀）。`);

function screenMegaBag(msg){

function megaCraft(id){

let megaShopBack = null, megaShopPage = 0, megaTarget = null, megaPay = {};

const megaPayCount = () => Object.values(megaPay).reduce((a,b)=>a+b, 0);
function megaPayOwned(){      // 可以拿來付的碎片（不含想換的那一種）
  return MEGAS.filter(m=>m.id!==megaTarget && megaShards(m.id) - (megaPay[m.id]||0) > 0);
}
function megaAutoPick(){      // 優先扣已經有進化石的，再從數量少的扣（損失最小）
  const st = megaState().stones;
  const list = MEGAS.filter(m=>m.id!==megaTarget && megaShards(m.id) > 0)
    .sort((a,b)=>(st[b.id]?1:0)-(st[a.id]?1:0) || megaShards(a.id)-megaShards(b.id));
  megaPay = {};
  for(const m of list){
    while(megaPayCount() < MEGA_SWAP && (megaPay[m.id]||0) < megaShards(m.id)) megaPay[m.id] = (megaPay[m.id]||0) + 1;
    if(megaPayCount() >= MEGA_SWAP) break;
  }
}
function screenMegaPay(msg){
  const t = MEGA_BY_ID[megaTarget]; if(!t) return screenMegaShop();

  print(`選擇要付出的碎片（${n} / ${MEGA_SWAP}）：${MEGAS.filter(m=>megaPay[m.id]).map(m=>`${esc(m.name)}×${megaPay[m.id]}`).join('、') || '尚未選擇'}`);
  if(msg) print(msg);

  else opts.push({label:'✅ 確認兌換', cls:'off', action:()=>screenMegaPay()});

  opts.push({label:'🗑 清除選擇', half:true, action:()=>{ megaPay = {}; screenMegaPay(); }});

  owned.forEach(m=>{
    const left = megaShards(m.id) - (megaPay[m.id]||0);
    opts.push({label:m.name, half:true, cls: (left>0 && n<MEGA_SWAP) ? '' : 'off',
      action:()=>{ if(left>0 && megaPayCount()<MEGA_SWAP){ megaPay[m.id] = (megaPay[m.id]||0)+1; } screenMegaPay(); }});
  });
  opts.push({label:'返回', action:()=>screenMegaShop()});
  setOptions(opts);
}
function megaSwapConfirm(){
  const t = MEGA_BY_ID[megaTarget], ms = megaState();

  Object.keys(megaPay).forEach(id=>{ ms.shards[id] -= megaPay[id]; if(ms.shards[id] <= 0) delete ms.shards[id]; });
  ms.shards[t.id] = (ms.shards[t.id]||0) + 1;
  megaPay = {};
  saveGame();
  screenMegaShop(null, `<span class="good">兌換成功！獲得【${esc(t.name)}】碎片 ×1（${ms.shards[t.id]}/${MEGA_NEED}）</span>`);
}

function screenTowerGen(){

function kickOutOfTower(){

/* ---------- 能力六邊形：上 HP、右上 攻擊、右下 防禦、下 速度、左下 特防、左上 特攻 ---------- */
const HEX_ORDER = ['hp','atk','def','spd','sdf','spa'];
function hexPanel(iv, orig, cap, sel){
  const cx = 150, cy = 118, R = 80;
  const pt = (k, v) => { const a = -Math.PI/2 + HEX_ORDER.indexOf(k)*Math.PI/3, r = R*v/IV_MAX; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  const poly = vals => HEX_ORDER.map(k=>pt(k, vals[k]).map(n=>n.toFixed(1)).join(',')).join(' ');
  const ring = v => poly(Object.fromEntries(HEX_ORDER.map(k=>[k, v])));
  let svg = `<svg class="hexsvg" viewBox="0 0 300 236" xmlns="http://www.w3.org/2000/svg">`;
  [IV_MIN, 40, IV_MAX].forEach(v=>{ svg += `<polygon class="ring${v===IV_MAX?' cap':''}" points="${ring(v)}"/>`; });
  HEX_ORDER.forEach(k=>{ const [x,y] = pt(k, IV_MAX); svg += `<line class="ax" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; });
  if(orig) svg += `<polygon class="orig" points="${poly(orig)}"/>`;
  svg += `<polygon class="val" points="${poly(iv)}"/>`;
  HEX_ORDER.forEach(k=>{
    const [x,y] = pt(k, IV_MAX + 15);
    svg += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" class="${k===sel?'sel':''}">${k===sel?'▶':''}${IV_NAMES[k]} <tspan class="num">${iv[k]}</tspan></text>`;
  });
  svg += '</svg>';
  const used = ivSum(iv);
  const info = orig
    ? `總和 <b>${used}</b> / 上限 ${cap}　剩餘 <b>${cap - used}</b> 點　（虛線＝原本的設定）`
    : `能力點總和 <b>${used}</b> / 上限 ${cap}　（每項 ${IV_MIN}~${IV_MAX}）`;
  return svg + `<div class="hexinfo">${info}</div>`;
}
/* ---------- 調整能力點：六項各 IV_MIN~IV_MAX，總和不能超過抓到時的總和 ---------- */
let ivEdit = null;
function screenIvEdit(i, back){
  const m = state.party[i]; if(!m) return screenParty(back);
  ensureIv(m);
  ivEdit = {i, back, m, iv:Object.assign({}, m.iv), sel:'atk', step:1};
  renderIvEdit();
}
function ivChange(d){
  const E = ivEdit, k = E.sel, v = E.iv[k], left = E.m.ivCap - ivSum(E.iv);
  let nv = Math.max(IV_MIN, Math.min(IV_MAX, v + d));
  if(nv > v) nv = Math.min(nv, v + left);
  if(nv !== v){ E.iv[k] = nv; }
  renderIvEdit();
}
function renderIvEdit(){
  const E = ivEdit, m = E.m;
  if(!state.party.includes(m)) return screenParty(E.back);
  clearLog();   // 不印文字，按鈕才不會每按一次就等動畫
  stageDetail = hexPanel(E.iv, m.iv, m.ivCap, E.sel);
  const k = E.sel, v = E.iv[k], left = m.ivCap - ivSum(E.iv);
  const opts = IV_KEYS.map(s=>({label:`${s===k?'▶ ':''}${IV_NAMES[s]}　${E.iv[s]}`, half:true, cls:s===k?'':'', action:()=>{ E.sel = s; renderIvEdit(); }}));
  const canDown = v > IV_MIN, canUp = v < IV_MAX && left > 0;
  opts.push({label:'−5', cls:'q'+(canDown?'':' off'), action:()=>ivChange(-5)});
  opts.push({label:'−1', cls:'q'+(canDown?'':' off'), action:()=>ivChange(-1)});
  opts.push({label:'+1', cls:'q'+(canUp?'':' off'), action:()=>ivChange(1)});
  opts.push({label:'+5', cls:'q'+(canUp?'':' off'), action:()=>ivChange(5)});
  const changed = IV_KEYS.some(s=>E.iv[s] !== m.iv[s]);
  opts.push({label:'✔ 確定', half:true, cls:changed?'':'off', action:ivConfirm});
  opts.push({label:'↺ 重來', half:true, cls:changed?'':'off', action:()=>{ E.iv = Object.assign({}, m.iv); renderIvEdit(); }});
  opts.push({label:'放棄修改', action:()=>screenMember(state.party.indexOf(m), E.back)});
  setOptions(opts);
}
function ivConfirm(){
  const E = ivEdit, m = E.m;
  if(!state.party.includes(m)) return screenParty(E.back);
  if(ivSum(E.iv) > m.ivCap || IV_KEYS.some(k=>E.iv[k] < IV_MIN || E.iv[k] > IV_MAX)) return renderIvEdit();
  m.iv = Object.assign({}, E.iv);
  const ratio = m.maxhp ? m.hp/m.maxhp : 1, st = monStats(m);
  m.maxhp = st.hp; m.hp = m.hp > 0 ? Math.max(1, Math.min(st.hp, Math.round(st.hp*ratio))) : 0;
  setNonHpStats(m, st);
  saveGame();
  ivEdit = null;
  screenMember(state.party.indexOf(m), E.back);
  print('<span class="good">✔ 能力點已更新！</span>');
}
function setLeader(idx, back){
  if(idx<=0 || idx>=state.party.length) return screenParty(back);
  const [m] = state.party.splice(idx,1);

  saveGame();
  screenParty(back, `<span class="good">★ ${nm(m)} 成為新的隊長！下次戰鬥會由牠先上場，不需要浪費回合切換。</span>`);

function releaseToBox(idx, back){

/* ---------- 排序與篩選：倉庫、藥品／石頭選目標共用同一組設定；圖鑑另有自己的一組 ---------- */
const GEN_LABEL = {1:'第一世代',2:'第二世代',3:'第三世代',4:'第四世代',5:'第五世代',6:'第六世代',7:'第七世代',8:'第八世代',9:'地區型態',10:'第九世代'};   // 數字是 towerGenOf 的分組（9＝地區型態、10＝第九世代）
const GEN_ORDER = [1,2,3,4,5,6,7,8,10,9];
const SORT_LABEL = {got:'獲得順序', dex:'圖鑑編號', lv:'等級（高→低）', hp:'HP（低→高）'};
const dexBase = i => { const b = FORM_BASE[i]; return (b !== undefined) ? b : (i >= 962 ? i - 57 : i); };   // 地區型態用基礎寶可夢的編號
const gotOf = m => (m.got === undefined ? 1e12 : m.got);
const monCmp = {
  got:(a,b)=> gotOf(a) - gotOf(b),
  dex:(a,b)=> dexBase(a.dex) - dexBase(b.dex) || (FORM_BASE[a.dex] !== undefined) - (FORM_BASE[b.dex] !== undefined) || a.dex - b.dex || gotOf(a) - gotOf(b),
  lv: (a,b)=> b.level - a.level || dexBase(a.dex) - dexBase(b.dex) || gotOf(a) - gotOf(b),
  hp: (a,b)=> a.hp/a.maxhp - b.hp/b.maxhp || gotOf(a) - gotOf(b)
};
const mview = {sort:'got', type:'', gen:0};
const mviewIsDefault = () => mview.sort === 'got' && !mview.type && !mview.gen;
function viewMons(list){   // list：[{m, ...}]，回傳篩選＋排序後的新陣列
  const r = list.filter(x=> (!mview.type || x.m.t1 === mview.type || x.m.t2 === mview.type) && (!mview.gen || towerGenOf(x.m.dex) === mview.gen));
  const c = monCmp[mview.sort] || monCmp.got;
  return r.sort((a,b)=>c(a.m, b.m));
}

/* ---------- 倉庫：一頁 8 隻，點寶可夢就加入隊伍（隊伍滿了才需要選擇換下誰） ---------- */
let boxPage = 0;
const BOX_PER_PAGE = 8;
function screenBox(back, msg){
  const view = viewMons(state.box.map((m,i)=>({m,i})));   // i＝它在 state.box 裡真正的位置
  const pages = Math.max(1, Math.ceil(view.length / BOX_PER_PAGE));
  boxPage = Math.min(Math.max(0, boxPage), pages-1);
  clearLog();
  print(`<span class="em">📦 倉庫</span>　共 ${state.box.length} 隻${view.length !== state.box.length ? `（符合 ${view.length} 隻）` : ''}${mviewNote()}`);
  if(typeof msg === 'string') print(msg);
  print(`<span class="sys">隊伍 ${state.party.length}/6：${state.party.map(m=>esc(monName(m))).join('、')}</span>`);
  if(state.box.length===0) print('<span class="sys">（空，抓到超過 6 隻時才會送來這裡）</span>');
  else if(view.length===0) print('<span class="sys">（沒有符合篩選條件的寶可夢）</span>');
  else print(`<span class="sys">${state.party.length<6 ? '點寶可夢就會加入隊伍。' : '隊伍已滿，點寶可夢後再選擇要換下誰。'}</span>`);
  const start = boxPage * BOX_PER_PAGE;
  const opts = view.slice(start, start + BOX_PER_PAGE).map(({m,i})=>monCardOpt(m, ()=>boxPick(i, back), {noHp:true}));
  if(pages>1){
    opts.push({label:"◀", row:'pg', cls:'pgb'+(boxPage===0?' off':''), action:()=>{ if(boxPage>0){ boxPage--; screenBox(back); } }});
    opts.push({label:`${boxPage+1} / ${pages}`, row:'pg', cls:'pgn', action:()=>screenBox(back)});
    opts.push({label:"▶", row:'pg', cls:'pgb'+(boxPage>=pages-1?' off':''), action:()=>{ if(boxPage<pages-1){ boxPage++; screenBox(back); } }});
  }
  opts.push(...mviewControls(()=>screenBox(back), ()=>{ boxPage = 0; }));
  opts.push({label:"返回隊伍", action:()=>screenParty(back)});
  setOptions(opts);
}
function boxPick(boxIdx, back){
  const m = state.box[boxIdx]; if(!m) return screenBox(back);
  if(state.party.length < 6) return withdrawFromBox(boxIdx, back);
  clearLog();
  print(`<span class="em">要把 ${nm(m)}（Lv.${m.level}　${typeStr(m)}）換進隊伍，請選擇換下誰：</span>`);
  const opts = state.party.map((p,i)=>monCardOpt(p, ()=>doSwapWithBox(boxIdx, i, back), {lead:i===0}));
  opts.push({label:"取消", action:()=>screenBox(back)});
  setOptions(opts);
}
function withdrawFromBox(boxIdx, back){
  if(state.party.length>=6){ return screenBox(back, '<span class="bad">隊伍已滿了！</span>'); }
  const [m] = state.box.splice(boxIdx,1);
  state.party.push(m);
  saveGame();
  screenBox(back, `<span class="good">${nm(m)} 加入了隊伍！</span>`);
}
function doSwapWithBox(boxIdx, partyIdx, back){
  const boxMon = state.box[boxIdx];
  const partyMon = state.party[partyIdx];
  state.box[boxIdx] = partyMon;
  state.party[partyIdx] = boxMon;
  saveGame();
  screenBox(back, `<span class="good">${nm(boxMon)} 換進了隊伍，${nm(partyMon)} 回到倉庫。</span>`);
}

/* ---------- 背包：傷藥／PP補給／異常狀態藥，可以對隊伍「和倉庫」裡的寶可夢使用 ---------- */
function healItemKeys(){ return Object.keys(ITEMS).filter(k=>{ const it = ITEMS[k]; return it.ball===undefined && !it.stone && (it.heal || it.pp || it.cure); }); }
function needsItem(m, it){
  if(it.pp) return (m.moves||[]).some(mv=>mv.pp < mv.maxpp);
  if(it.heal) return m.hp < m.maxhp;
  return statusMatch(m.status, it.cure);
}

// 圖鑑編號：地區型態顯示成基礎寶可夢的編號加 ◇（例：阿羅拉小拉達 = #019◇）
const dexNo = i => { const b = (typeof FORM_BASE !== 'undefined') ? FORM_BASE[i] : undefined; const base = (b !== undefined) ? b : (i >= 962 ? i - 57 : i); return String(base + 1).padStart(3,'0') + (b !== undefined ? '◇' : ''); };   // 索引 962 起是第九世代，索引 − 56 = 圖鑑編號
/* 圖鑑的排序與篩選：圖鑑記的是「種類」，所以「等級」用隊伍＋倉庫裡該種的最高等級；沒持有的排最後 */
const dview = {sort:'dex', st:'', type:'', gen:0};
const DSORT_LABEL = {dex:'圖鑑編號', got:'獲得順序', lv:'等級（高→低）'};
const DST_LABEL = {'':'全部', caught:'已捕捉', seen:'只見過', unseen:'未見過'};
const dviewIsDefault = () => dview.sort === 'dex' && !dview.st && !dview.type && !dview.gen;
function dexViewList(){
  const caughtArr = Array.from(state.caught), seenArr = Array.from(state.seen);
  const caughtRank = new Map(caughtArr.map((d,k)=>[d,k])), seenRank = new Map(seenArr.map((d,k)=>[d,k]));
  const maxLv = new Map();
  [...state.party, ...state.box].forEach(m=>{ if(!(maxLv.get(m.dex) >= m.level)) maxLv.set(m.dex, m.level); });
  const stOf = i => state.caught.has(i) ? 'caught' : state.seen.has(i) ? 'seen' : 'unseen';
  const list = [];
  for(let i=0;i<DEX.length;i++){
    const st = stOf(i);
    if(dview.st && st !== dview.st) continue;
    if(dview.gen && towerGenOf(i) !== dview.gen) continue;
    // 屬性：只有「已捕捉」的圖鑑格才會顯示屬性，所以篩選屬性時，只看得到已捕捉的
    if(dview.type && !(st === 'caught' && (DEX[i][1] === dview.type || DEX[i][2] === dview.type))) continue;
    list.push(i);
  }
  const byNo = (a,b)=> a - b;
  if(dview.sort === 'got'){
    const rank = i => caughtRank.has(i) ? caughtRank.get(i) : seenRank.has(i) ? 1e6 + seenRank.get(i) : 2e6 + i;   // 先捕捉順序、再只見過、最後沒見過
    list.sort((a,b)=> rank(a) - rank(b));
  } else if(dview.sort === 'lv'){
    list.sort((a,b)=> (maxLv.has(b) ? maxLv.get(b) : -1) - (maxLv.has(a) ? maxLv.get(a) : -1) || byNo(a,b));
  }   // 'dex'：維持索引順序
  return list;
}
/* 圖鑑分地區：先選地區（關都、城都…），再以直向卷軸一次列出該地區全部寶可夢（不再分頁） */
const DEX_REGIONS = [[1,'關都'],[2,'城都'],[3,'豐緣'],[4,'神奧'],[5,'合眾'],[6,'卡洛斯'],[7,'阿羅拉'],[8,'伽勒爾'],[10,'帕底亞'],[9,'地區型態']];
const dexRegionName = g => g ? (DEX_REGIONS.find(r=>r[0]===g)||[0,''])[1] + (g===9 ? '' : '圖鑑') : '全國圖鑑';
function screenDex(){   // 地區選單
  clearLog();

  const opts = DEX_REGIONS.map(([g,name])=>{ const c = genCaught(g), t = genSize(g); return {label:`📖 ${name}　${c}/${t}${c===t?' ✔':''}`, half:true, action:()=>{ dview.gen = g; screenDexRegion(); }}; });

}
function screenDexRegion(){   // 單一地區：直向卷軸
  clearLog();
  const view = dexViewList();
  const g = dview.gen, total = g ? genSize(g) : DEX.length, caught = g ? genCaught(g) : state.caught.size;
  const filtered = dview.sort !== 'dex' || dview.st || dview.type;
  const note = filtered ? `　<span class="sys">（${DSORT_LABEL[dview.sort]}${dview.st ? '・' + DST_LABEL[dview.st] : ''}${dview.type ? '・' + dview.type : ''}　符合 ${view.length} 隻）</span>` : '';
  const rows = view.map(i=>{
    const e = DEX[i], no = dexNo(i);

    if(state.caught.has(i)) return `<div class="dexrow dexclick" onclick="dexDetail(${i})"><span class="dexno">#${no}</span><span class="good">${esc(e[0])}</span><span class="sys">${e[2]?e[1]+'／'+e[2]:e[1]}</span>${shinyMark}</div>`;
    if(state.seen.has(i)) return `<div class="dexrow dexclick" onclick="dexDetail(${i})"><span class="dexno">#${no}</span><span class="sys">${esc(e[0])}（已見過）</span></div>`;
    return `<div class="dexrow"><span class="dexno">#${no}</span><span class="sys">？？？</span></div>`;
  }).join('');
  // 標題與清單包在同一個區塊，標題才能在捲動時固定在上方；清單直接用 #log 本身的直向捲軸
  print(`<div class="dexwrap"><div class="dexhead"><span class="em">— ${esc(dexRegionName(g))} —</span>　已捕捉 ${caught} / ${total}${note}</div>${rows || '<span class="sys">（沒有符合篩選條件的寶可夢）</span>'}</div>`);
  skipReveal(); logEl.scrollTop = 0;
  const dsorts = ['dex','got','lv'], dsts = ['','caught','seen','unseen'];
  const opts = [];
  opts.push({label:`排序：${DSORT_LABEL[dview.sort]}`, half:true, action:()=>{ dview.sort = dsorts[(dsorts.indexOf(dview.sort)+1) % dsorts.length]; screenDexRegion(); }});
  opts.push({label:`狀態：${DST_LABEL[dview.st]}`, half:true, action:()=>{ dview.st = dsts[(dsts.indexOf(dview.st)+1) % dsts.length]; screenDexRegion(); }});
  opts.push({label:`屬性：${dview.type || '全部'}`, half:true, action:()=>screenPickFilter('選擇屬性（只會列出已捕捉的）', TYPE_OPTIONS(), dview.type, v=>{ dview.type = v; screenDexRegion(); }, screenDexRegion)});
  if(filtered) opts.push({label:'↺ 重設排序與篩選', half:true, action:()=>{ dview.sort = 'dex'; dview.st = ''; dview.type = ''; screenDexRegion(); }});
  opts.push({label:'← 換地區', half:true, action:screenDex});
  opts.push({label:'返回', half:true, action:()=>{ dview.gen = 0; toField(); }});
  setOptions(opts);
}

/* Mega 圖鑑：93 種 Mega 依全國圖鑑編號排列
   遇過（Mega 對戰遇到）、有碎片或有進化石就算「已登錄」，會顯示名字與屬性；沒遇過顯示 ？？？

let megaDexBack = null, megaDexSt = '';

function findItem(){
  let r = Math.random()*FIND_TABLE.reduce((a,x)=>a+x[1],0), key = FIND_TABLE[0][0];
