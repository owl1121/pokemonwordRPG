<title>口袋文字冒險</title>
<style>
:root{
  --bg:#0d1210; --panel:#111a16; --line:#2c4a3a; --text:#c9f7d8; --dim:#6f9a84;
  --accent:#ffcb3c; --accent2:#5fd0ff; --danger:#ff6b6b; --good:#7ee787;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#0d1210; --panel:#111a16; --text:#c9f7d8; }
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:'Courier New',ui-monospace,monospace;
  display:flex; justify-content:center;
}
#app{
  width:100%; max-width:480px; min-height:100%;
  display:flex; flex-direction:column;
  border-left:1px solid var(--line); border-right:1px solid var(--line);
}
header{
  padding:14px 16px 10px; border-bottom:1px solid var(--line);
  position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5;
}
header .title{font-size:15px; letter-spacing:2px; color:var(--accent);}
header .sub{font-size:11px; color:var(--dim); margin-top:2px;}
#log{
  flex:1; padding:16px; white-space:pre-wrap; line-height:1.65; font-size:14px;
  overflow-x:auto;
}
#log .sys{color:var(--dim);}
#log .em{color:var(--accent);}
#log .good{color:var(--good);}
#log .bad{color:var(--danger);}
#log .hr{border-top:1px dashed var(--line); margin:10px 0;}
#bar{
  padding:8px 16px; font-size:12px; color:var(--dim); border-top:1px solid var(--line);
  display:flex; gap:14px; flex-wrap:wrap;
}
#opts{
  padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--line);
  background:var(--panel);
}
.opt{
  background:transparent; color:var(--text); border:1px solid var(--line);
  padding:11px 12px; font-family:inherit; font-size:14px; text-align:left;
  border-radius:2px; cursor:pointer;
}
.opt:active{background:#1a2a22;}
.opt .k{color:var(--accent2); margin-right:8px;}
.hpwrap{height:6px; background:#1a2a22; border-radius:3px; overflow:hidden; margin:2px 0 6px;}
.hpfill{height:100%; background:var(--good);}
.line{opacity:0; transform:translateY(4px); animation:lineIn .5s ease forwards;}
@keyframes lineIn{ to{opacity:1; transform:translateY(0);} }
#opts.pending .opt{opacity:0; pointer-events:none;}
#opts{transition:opacity .2s;}
#skipHint{font-size:11px; color:var(--dim); text-align:center; padding:4px 0 0;}
.shiny{color:#ff9ef5;}
.boss{color:#ff9d4d;}
</style>
</head>

function eff(atkType, defTypes){
  let m = 1;
  const c = CHART[atkType];
  if(!c) return m;
  for(const t of defTypes){
    if(!t) continue;
    if(c.s.includes(t)) m *= 1.6;
    if(c.w.includes(t)) m *= 0.65;
  }
  return m;
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function monName(m){ return (m.shiny ? '✨' : '') + m.name; }
function nm(m){ return m.shiny ? `<span class="shiny">${esc(monName(m))}</span>` : esc(m.name); }

function applyMoveEffect(atkMon, defMon, move){
  const fx = STATUS_FX[move.type];
  if(!fx || Math.random() > fx.chance) return '';
  switch(fx.kind){
    case 'burn': if(defMon.status) return ''; defMon.status='burn'; return `<span class="bad">${nm(defMon)} 陷入了灼傷！</span>`;
    case 'poison': if(defMon.status) return ''; defMon.status='poison'; return `<span class="bad">${nm(defMon)} 中毒了！</span>`;
    case 'paralyze': if(defMon.status) return ''; defMon.status='paralyze'; return `<span class="bad">${nm(defMon)} 被麻痺了！</span>`;
    case 'atkDown': defMon.atkMul = Math.max(0.4, (defMon.atkMul||1)*0.75); return `<span class="bad">${nm(defMon)} 的攻擊下降了！</span>`;

  }
  return '';
}
function tickStatus(mon){
  if(!mon.status || mon.hp<=0) return '';
  if(mon.status==='poison'){ const d=Math.max(1,Math.floor(mon.maxhp/8)); mon.hp=Math.max(0,mon.hp-d); return `<span class="bad">${nm(mon)} 因中毒損失了 ${d} 點HP。</span>`; }

  return '';
}
function buildMoves(entry){
  const t1=entry[1], t2=entry[2];
  const m1 = MOVES[t1] || MOVES["一般"];
  const fourth = t2 ? {name:(MOVES[t2]||MOVES["一般"]).q, type:t2, power:45}
                     : {name:"捨身衝撞", type:"一般", power:65, recoil:0.25};
  return [
    {name:"撞擊", type:"一般", power:40},
    {name:m1.q, type:t1, power:45},
    fourth,
    {name:m1.s, type:t1, power:75}
  ];
}
function statsFor(entry, level){
  const tier = entry[3];
  const base = 28 + tier*11;
  const hp = Math.floor(base*1.7 + level*4.4);
  const atk = Math.floor(base*0.9 + level*1.7);
  const def = Math.floor(base*0.8 + level*1.5);
  const spd = Math.floor(base*0.75 + level*1.3);
  return {hp,atk,def,spd};
}
function makeMon(dexIndex, level, opts){
  opts = opts || {};
  level = Math.max(1, Math.min(MAX_LEVEL, level));
  const e = DEX[dexIndex];
  const st = statsFor(e, level);
  const shiny = (opts.shiny !== undefined) ? opts.shiny : (Math.random() < SHINY_RATE);
  return {
    dex: dexIndex, name:e[0], t1:e[1], t2:e[2], tier:e[3],
    level, hp:st.hp, maxhp:st.hp, atk:st.atk, def:st.def, spd:st.spd,
    exp:0, expNext: 18 + level*9, moves: buildMoves(e),
    status:null, atkMul:1, defMul:1, shiny
  };
}

/* ---------- TOWER MODE ---------- */
const LEGENDARIES = [143,144,145,149,150]; // 急凍鳥 閃電鳥 火焰鳥 超夢 夢幻
const NONLEG = []; for(let i=0;i<151;i++){ if(!LEGENDARIES.includes(i)) NONLEG.push(i); }
const BOSSES = NONLEG.filter(isFinalForm); // 最終進化型（含無進化的單一型態），全破後的無盡循環名單
const COIN_COST = 50;
const LEGENDARY_COST = [50,50,60,90,150];
const MEW_IDX = 4;
const MEW_MIN_LEVEL = 70;
function isBossFloor(ptr){ return ptr >= NONLEG.length || isFinalForm(NONLEG[ptr]); }
// 本段（進化鏈）第一層：往回找到上一個小魔王之後那一層
function segmentStart(ptr){
  if(ptr >= NONLEG.length) return ptr;
  let s = ptr;
  while(s > 0 && !isFinalForm(NONLEG[s-1])) s--;
  return s;
}
function atSegmentStart(){ return state.tower.floorPtr === segmentStart(state.tower.floorPtr); }
function segmentBossName(){
  let p = state.tower.floorPtr;
  while(p < NONLEG.length && !isFinalForm(NONLEG[p])) p++;
  return p < NONLEG.length ? DEX[NONLEG[p]][0] : '';
}
function legendaryGate(ptr){
  const cost = LEGENDARY_COST[ptr] ?? COIN_COST;
  const coinsOk = state.tower.coins >= cost;
  if(ptr !== MEW_IDX) return { ok: coinsOk, cost, coinsOk, floorsOk:true, levelOk:true };
  const floorsOk = state.tower.floorPtr >= NONLEG.length;
  const lead = state.party[0];
  const levelOk = !!lead && lead.level >= MEW_MIN_LEVEL;
  return { ok: coinsOk && floorsOk && levelOk, cost, coinsOk, floorsOk, levelOk };
}
function towerFloorLevel(ptr){ return Math.min(MAX_LEVEL, 6 + Math.floor(ptr*1.15)); }
function legendaryLevel(ptr){ return Math.min(MAX_LEVEL, 48 + ptr*12); }
function endlessMul(){ return 1 + state.tower.loop * ENDLESS_STAT_STEP; }

const ITEMS = {
  pokeball:    {label:'精靈球', desc:'捕捉野生寶可夢', price:100},
  potion:      {label:'藥水',   desc:'回復 20 HP',   price:100,  heal:20},
  superpotion: {label:'好傷藥', desc:'回復 100 HP',  price:400,  heal:100},
  maxpotion:   {label:'全滿藥', desc:'HP 全部回復',   price:1500, heal:Infinity},
  antidote:    {label:'解毒藥', desc:'治療中毒',     price:100,  cure:'poison'},
  burnheal:    {label:'灼傷藥', desc:'治療灼傷',     price:100,  cure:'burn'},
  paralyzeheal:{label:'麻痺藥', desc:'治療麻痺',     price:100,  cure:'paralyze'}
};
function defaultBag(){ return {pokeball:5, potion:3, superpotion:0, maxpotion:0, antidote:2, burnheal:2, paralyzeheal:2}; }
function defaultTower(){ return {floorPtr:0, coins:0, legendaryPtr:0, endlessPtr:0, loop:0, inTower:false}; }

/* ---------- GAME STATE ---------- */
let state = {
  screen:"title",
  party:[], box:[],
  seen:new Set(), caught:new Set(), shinyCaught:new Set(),
  bag:defaultBag(), money:START_MONEY,
  zone:1, battle:null,
  tower:defaultTower()
};

const logEl = document.getElementById('log');
const barEl = document.getElementById('bar');
const optsEl = document.getElementById('opts');

const LINE_DELAY = 260;
let lineCount = 0;
let pendingTimer = null;
function print(html){
  const div = document.createElement('div');
  div.className = 'line';
  div.style.animationDelay = (lineCount*LINE_DELAY)+'ms';
  div.innerHTML = html;
  logEl.appendChild(div);
  lineCount++;
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog(){ logEl.innerHTML=""; lineCount=0; }
function hr(){ print('<div class="hr"></div>'); }
function holdOptionsUntilRevealed(){
  optsEl.classList.add('pending');
  if(pendingTimer) clearTimeout(pendingTimer);
  const wait = Math.max(0, lineCount*LINE_DELAY);
  pendingTimer = setTimeout(()=>optsEl.classList.remove('pending'), wait);
}
logEl.addEventListener('click', ()=>{
  document.querySelectorAll('#log .line').forEach(el=>el.style.animationDelay='0ms');
  if(pendingTimer) clearTimeout(pendingTimer);
  optsEl.classList.remove('pending');
});

function renderBar(){
  const lead = state.party[0];
  const money = `<span>💰 ${state.money}</span><span>🪙 ${state.tower.coins}</span>`;
  barEl.innerHTML = lead
    ? `<span>隊長: ${esc(monName(lead))} Lv.${lead.level} HP ${lead.hp}/${lead.maxhp}</span><span>圖鑑 ${state.caught.size}/151</span><span>精靈球 x${state.bag.pokeball}</span>${money}`
    : `<span>圖鑑 ${state.caught.size}/151</span>`;
}
function setOptions(list){
  holdOptionsUntilRevealed();
  optsEl.innerHTML = "";
  list.forEach((o,i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="k">${i+1}.</span>${esc(o.label)}`;
    b.onclick = o.action;
    optsEl.appendChild(b);
  });
  const hint = document.createElement('div');
  hint.id = 'skipHint';
  hint.textContent = '（點一下上方文字可跳過動畫）';
  optsEl.appendChild(hint);
}

/* ---------- SAVE / LOAD ---------- */
const SAVE_KEY = 'pkmn_tower_save_v2';
const OLD_SAVE_KEY = 'pkmn_tower_save_v1';
function saveGame(){
  try{
    const data = {
      v:2, party:state.party, box:state.box,
      seen:Array.from(state.seen), caught:Array.from(state.caught), shinyCaught:Array.from(state.shinyCaught),
      bag:state.bag, money:state.money, zone:state.zone, tower:state.tower
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  }catch(e){ return false; }
}
function fixMon(m){
  if(!m) return m;
  const fixed = Object.assign({status:null, atkMul:1, defMul:1, shiny:false}, m);
  if(!Array.isArray(fixed.moves) || fixed.moves.length!==4){ fixed.moves = buildMoves(DEX[fixed.dex]); }
  if(fixed.level > MAX_LEVEL) fixed.level = MAX_LEVEL;
  if(fixed.level >= MAX_LEVEL) fixed.exp = 0;
  return fixed;
}
function loadGame(){
  try{
    let raw = localStorage.getItem(SAVE_KEY);
    if(!raw) raw = localStorage.getItem(OLD_SAVE_KEY); // 舊版存檔自動轉移
    if(!raw) return false;
    const d = JSON.parse(raw);
    state.party = Array.isArray(d.party) ? d.party.map(fixMon) : [];
    state.box = Array.isArray(d.box) ? d.box.map(fixMon) : [];
    state.seen = new Set(d.seen||[]);
    state.caught = new Set(d.caught||[]);
    state.shinyCaught = new Set(d.shinyCaught||[]);
    state.bag = Object.assign(defaultBag(), d.bag||{});
    state.money = (typeof d.money === 'number') ? d.money : START_MONEY;
    state.zone = d.zone || 1;
    state.tower = Object.assign(defaultTower(), d.tower||{});
    return state.party.length>0;
  }catch(e){ return false; }
}
function resetGame(){
  try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(OLD_SAVE_KEY); }catch(e){}
  state.party=[]; state.box=[]; state.seen=new Set(); state.caught=new Set(); state.shinyCaught=new Set();
  state.bag=defaultBag(); state.money=START_MONEY; state.zone=1; state.battle=null;
  state.tower=defaultTower();
  screenTitle();
}
function screenContinue(){
  clearLog();
  print('<span class="em">讀取到本機存檔！</span>');
  const lead = state.party[0];
  print(`隊長：${nm(lead)} Lv.${lead.level}　圖鑑 ${state.caught.size}/151　💰 ${state.money}　🪙 ${state.tower.coins}`);
  if(state.tower.inTower) print('<span class="sys">（上次離開時你還在無限之塔裡）</span>');
  renderBar();
  setOptions([
    {label:"繼續冒險", action: state.tower.inTower ? screenTower : toField},
    {label:"清除存檔，重新開始", action:screenResetConfirm}
  ]);
}
function screenResetConfirm(){
  clearLog();
  print('<span class="bad">確定要清除本機存檔，從頭開始嗎？此動作無法復原。</span>');
  setOptions([
    {label:"是，清除並重新開始", action:resetGame},
    {label:"取消，返回", action:()=> state.party.length ? screenContinue() : screenTitle()}
  ]);
}

/* ---------- TITLE / START ---------- */
function screenTitle(){
  clearLog();
  print('<span class="em">歡迎來到關都地方。</span>');
  print('這是一場純文字寶可夢冒險：探索小徑、遭遇野生寶可夢、捕捉、戰鬥、練等，收集你的圖鑑。');
  hr();
  print('請選擇你的第一隻夥伴寶可夢：');
  renderBar();
  setOptions([
    {label:"妙蛙種子（草／毒）－均衡型，擅長消耗戰", action:()=>pickStarter(0)},
    {label:"小火龍（火）－高攻擊，後期強力", action:()=>pickStarter(3)},
    {label:"傑尼龜（水）－高防禦，穩健耐久", action:()=>pickStarter(6)},
    {label:"皮卡丘（電）－速度快，先手優勢", action:()=>pickStarter(24)}
  ]);
}
function pickStarter(idx){
  const mon = makeMon(idx, 5, {shiny:false});
  state.party = [mon];
  state.caught.add(idx); state.seen.add(idx);
  clearLog();
  print(`<span class="good">你選擇了 ${esc(mon.name)}！</span>`);
  print(`Lv.${mon.level}　HP ${mon.hp}　攻擊 ${mon.atk}　防禦 ${mon.def}　速度 ${mon.spd}　屬性：${typeStr(mon)}`);
  print(`媽媽塞給你 💰 ${START_MONEY} 當旅費。`);
  hr();
  print('旅程從 1 號道路開始。前方草叢似乎有寶可夢的動靜……');
  saveGame();
  screenField();
}

/* ---------- FIELD / EXPLORE ---------- */
function screenField(){
  state.screen="field";
  state.tower.inTower = false;
  saveGame();
  renderBar();
  setOptions([
    {label:"往草叢前進（可能遭遇野生寶可夢）", action:()=>encounter()},
    {label:"◆ 進入無限之塔（依圖鑑順序挑戰）", action:enterTower},
    {label:"🏪 商店", action:()=>{ shopQty=1; screenShop(); }},
    {label:"查看隊伍", action:screenParty},
    {label:"背包道具", action:screenBag},
    {label:"查看圖鑑", action:screenDex},
    {label:"在補給站治療隊伍（免費）", action:()=>healAll(screenField)},
    {label:`深入下一區域（目前第 ${state.zone} 區，野生寶可夢等級提升）`, action:advanceZone},
    {label:"💾 手動存檔", action:()=>{ saveGame(); clearLog(); print('<span class="good">已儲存進度！</span>'); screenField(); }},
    {label:"🗑 清除存檔重新開始", action:screenResetConfirm}
  ]);
}
function toField(){ clearLog(); screenField(); }
function toBattle(){ clearLog(); screenBattle(); }
function advanceZone(){
  state.zone++;
  clearLog();
  print(`<span class="em">你深入了新的區域（第 ${state.zone} 區）。</span>`);
  print('這裡的野生寶可夢感覺更強了。');
  screenField();
}
function fullHeal(){ state.party.forEach(m=>{ m.hp=m.maxhp; m.status=null; m.atkMul=1; m.defMul=1; }); }
function healAll(returnTo){
  fullHeal();
  clearLog();
  print('<span class="good">補給站的護士治好了你隊伍中所有寶可夢！</span>');
  (returnTo||screenField)();
}
function noAlive(){ return state.party.length===0 || !state.party.some(m=>m.hp>0); }
function announceShiny(w){
  if(w.shiny) print('<span class="shiny">✨ 閃閃發光！是色違的寶可夢！</span>');
}
function encounter(){
  if(noAlive()){
    clearLog();
    print('<span class="bad">你的隊伍已經沒有能戰鬥的寶可夢了，先去補給站治療吧。</span>');
    screenField(); return;
  }
  const lvl = Math.max(2, Math.min(MAX_LEVEL, state.zone*4 + Math.floor(Math.random()*5) - 2));
  const dexIndex = pickWildIndex(state.zone);
  const wild = makeMon(dexIndex, lvl);
  state.seen.add(dexIndex);
  clearBattleModifiers();
  state.battle = { wild, playerIdx: firstAlive(), mode:'wild' };
  clearLog();
  announceShiny(wild);
  print(`<span class="em">野生的 ${nm(wild)}（Lv.${wild.level}）出現了！</span>`);
  screenBattle();
}
function pickWildIndex(zone){
  const maxTier = Math.min(5, 1 + Math.floor(zone/2));
  const pool = DEX.map((e,i)=>i).filter(i=>DEX[i][3] <= maxTier && !LEGENDARIES.includes(i)); // 神獸只能在塔裡遇到
  return pool[Math.floor(Math.random()*pool.length)];
}
function firstAlive(){
  for(let i=0;i<state.party.length;i++) if(state.party[i].hp>0) return i;
  return -1;
}
function afterFaintCheck(p){
  if(p.hp>0) return false;
  print(`<span class="bad">${nm(p)} 倒下了！</span>`);
  if(state.party.every(m=>m.hp<=0)){ loseBattle(); return true; }
  screenForcedSwitch();
  return true;
}
function screenForcedSwitch(){
  hr();
  print('<span class="em">選擇下一隻上場的寶可夢：</span>');
  const opts = state.party
    .map((m,i)=> m.hp>0 ? {label:`${monName(m)} Lv.${m.level} HP ${m.hp}/${m.maxhp}`, action:()=>{
      state.battle.playerIdx=i; clearLog(); print(`派出 ${nm(m)}！`); screenBattle();
    }} : null)
    .filter(Boolean);
  setOptions(opts);
}

/* ---------- SHOP ---------- */
let shopQty = 1;
function screenShop(msg){
  clearLog();
  renderBar();
  print('<span class="em">— 友好商店 —</span>');
  print(`你的錢包：💰 ${state.money}　｜　一次購買 ${shopQty} 個`);
  if(msg) print(msg);
  hr();
  const opts = Object.keys(ITEMS).map(k=>{
    const it = ITEMS[k];
    const total = it.price*shopQty;
    return {label:`${it.label}（${it.desc}）$${it.price}${shopQty>1?` ×${shopQty} = $${total}`:''}　持有 ${state.bag[k]||0}`, action:()=>buyItem(k)};
  });
  opts.push({label:`切換購買數量（目前 ×${shopQty}）`, action:()=>{ shopQty = shopQty===1?5:(shopQty===5?10:1); screenShop(); }});
  opts.push({label:"離開商店", action:toField});
  setOptions(opts);
}
function buyItem(k){
  const it = ITEMS[k];
  const total = it.price*shopQty;
  if(state.money < total){
    return screenShop(`<span class="bad">錢不夠！還差 💰 ${total-state.money}。</span>`);
  }
  state.money -= total;
  state.bag[k] = (state.bag[k]||0) + shopQty;
  saveGame();
  screenShop(`<span class="good">買了 ${it.label} ×${shopQty}，花費 💰 ${total}。</span>`);
}

/* ---------- TOWER SCREEN ---------- */
function enterTower(){
  const t = state.tower;
  t.floorPtr = segmentStart(t.floorPtr); // 重新進塔一定從本段第一隻開始
  t.inTower = true;
  screenTower();
}
function currentTowerFoe(){
  const t = state.tower;
  if(t.floorPtr < NONLEG.length){
    const dexIdx = NONLEG[t.floorPtr];
    const boss = isBossFloor(t.floorPtr);
    const lvl = Math.min(MAX_LEVEL, towerFloorLevel(t.floorPtr) + (boss?BOSS_LEVEL_BONUS:0));
    return {dexIdx, lvl, boss, endless:false};
  }
  return {dexIdx: BOSSES[t.endlessPtr % BOSSES.length], lvl:MAX_LEVEL, boss:true, endless:true};
}
function screenTower(){
  clearLog();
  const t = state.tower;
  t.inTower = true;
  saveGame();
  renderBar();
  print(`<span class="em">◆ 無限之塔 — 依全國圖鑑編號順序挑戰 ◆</span>`);
  print(`硬幣 🪙 ${t.coins}　｜　已通過樓層 ${Math.min(t.floorPtr,NONLEG.length)} / ${NONLEG.length}`);
  print('<span class="sys">塔內沒有補給站，打倒小魔王（最終進化型）時全隊才會回滿。</span>');
  hr();
  const opts=[];
  const f = currentTowerFoe();
  const e = DEX[f.dexIdx];
  const no = '#'+String(f.dexIdx+1).padStart(3,'0');
  if(f.endless){
    print(`<span class="good">一般樓層已全部清空！現在是無盡小魔王（第 ${t.loop+1} 輪，能力 ×${endlessMul().toFixed(1)}）</span>`);
    print(`<span class="boss">【小魔王】${no} ${esc(e[0])}（${typeStr({t1:e[1],t2:e[2]})}）Lv.${f.lvl}</span>`);
    opts.push({label:`挑戰小魔王 ${e[0]}`, action:startTowerFloor});
  } else {
    const tag = f.boss ? '<span class="boss">【小魔王】</span>' : '';
    print(`第 ${t.floorPtr+1} 層：${tag}${no} ${esc(e[0])}（${typeStr({t1:e[1],t2:e[2]})}）Lv.${f.lvl}`);
    if(!f.boss) print(`<span class="sys">本段小魔王：${esc(segmentBossName())}</span>`);
    opts.push({label: f.boss ? `挑戰第 ${t.floorPtr+1} 層小魔王` : `挑戰第 ${t.floorPtr+1} 層`, action:startTowerFloor});
  }
  if(t.legendaryPtr < LEGENDARIES.length){
    hr();
    const ldex = LEGENDARIES[t.legendaryPtr];
    const le = DEX[ldex];
    const g = legendaryGate(t.legendaryPtr);
    const isMew = t.legendaryPtr === MEW_IDX;
    if(isMew){
      print(`<span class="em">下一位是「幻之寶可夢」：#${String(ldex+1).padStart(3,'0')} ${esc(le[0])}</span>`);
      print(`夢幻極為稀有，需要同時滿足：`);
      print(`　${g.coinsOk?'✅':'❌'} 硬幣 ≥ ${g.cost} 枚（目前 ${t.coins}）`);
      print(`　${g.floorsOk?'✅':'❌'} 清空塔內全部 ${NONLEG.length} 一般樓層（目前 ${Math.min(t.floorPtr,NONLEG.length)}）`);
      print(`　${g.levelOk?'✅':'❌'} 隊長等級 ≥ Lv.${MEW_MIN_LEVEL}（目前 ${state.party[0]?('Lv.'+state.party[0].level):'無隊長'}）`);
    } else {
      print(`下一位神獸：#${String(ldex+1).padStart(3,'0')} ${esc(le[0])}　需要 ${g.cost} 枚硬幣`);
    }
    opts.push({
      label: g.ok ? `🪙 花費 ${g.cost} 枚硬幣挑戰 ${le[0]}！` : (isMew ? '（夢幻：尚未達成全部條件）' : `（神獸：硬幣不足，還差 ${g.cost - t.coins} 枚）`),
      action: g.ok ? startLegendaryChallenge : ()=>screenTower()
    });
  } else {
    print('<span class="good">五大神獸皆已降服！</span>');
  }
  opts.push({label:"查看隊伍", action:()=>screenParty(screenTower)});
  if(atSegmentStart()){
    opts.push({label:"返回地面", action:toField});
  } else {
    hr();
    print(`<span class="sys">要打倒本段小魔王 ${esc(segmentBossName())} 才能返回地面。</span>`);
  }
  setOptions(opts);
}
function startTowerFloor(){
  if(noAlive()){
    clearLog();
    print('<span class="bad">你的隊伍已經沒有能戰鬥的寶可夢了。</span>');
    return kickOutOfTower();
  }
  const t = state.tower;
  const f = currentTowerFoe();
  const wild = makeMon(f.dexIdx, f.lvl);
  if(f.endless){
    const mul = endlessMul();
    wild.maxhp = Math.floor(wild.maxhp*mul); wild.hp = wild.maxhp;
    wild.atk = Math.floor(wild.atk*mul); wild.def = Math.floor(wild.def*mul); wild.spd = Math.floor(wild.spd*mul);
  }
  state.seen.add(f.dexIdx);
  clearBattleModifiers();
  state.battle = { wild, playerIdx: firstAlive(), mode:'tower', boss:f.boss, endless:f.endless };
  clearLog();
  announceShiny(wild);
  if(f.boss) print(`<span class="boss">【小魔王】${nm(wild)}（Lv.${wild.level}）現身了！</span>`);
  else print(`<span class="em">第 ${t.floorPtr+1} 層的 ${nm(wild)}（Lv.${wild.level}）擋在你面前！</span>`);
  screenBattle();
}
function startLegendaryChallenge(){
  if(noAlive()){
    clearLog();
    print('<span class="bad">你的隊伍已經沒有能戰鬥的寶可夢了。</span>');
    return kickOutOfTower();
  }
  const t = state.tower;
  const g = legendaryGate(t.legendaryPtr);
  if(!g.ok){ clearLog(); print('<span class="bad">條件尚未達成。</span>'); return screenTower(); }
  t.coins -= g.cost;
  const dexIdx = LEGENDARIES[t.legendaryPtr];
  const wild = makeMon(dexIdx, legendaryLevel(t.legendaryPtr));
  state.seen.add(dexIdx);
  clearBattleModifiers();
  state.battle = { wild, playerIdx: firstAlive(), mode:'legendary' };
  clearLog();
  print(`<span class="em">你支付了 ${g.cost} 枚硬幣……</span>`);
  announceShiny(wild);
  print(`<span class="em">傳說中的 ${nm(wild)}（Lv.${wild.level}）現身了！這場戰鬥無法逃跑。</span>`);
  screenBattle();
}
function kickOutOfTower(){
  const t = state.tower;
  t.floorPtr = segmentStart(t.floorPtr);
  t.inTower = false;
  state.battle = null;
  if(t.floorPtr < NONLEG.length){
    print(`<span class="sys">你被送出了無限之塔，下次要從第 ${t.floorPtr+1} 層（${esc(DEX[NONLEG[t.floorPtr]][0])}）重新開始。</span>`);
  } else {
    print('<span class="sys">你被送出了無限之塔。</span>');
  }
  screenField();
}

/* ---------- BATTLE ---------- */
function statusTag(m){
  if(!m.status) return '';
  const tag = {burn:'🔥灼傷', poison:'☠️中毒', paralyze:'⚡麻痺'}[m.status] || '';
  return tag ? ` <span class="bad">[${tag}]</span>` : '';
}
function who(m){
  const b = state.battle;
  if(b && m === b.wild) return (b.mode==='wild' ? '野生的 ' : '對手 ') + nm(m);
  return nm(m);
}
function screenBattle(){
  const b = state.battle;
  const p = state.party[b.playerIdx];
  renderBar();
  hpBars(p, b.wild);
  const opts = [{label:'⚔ 攻擊', action:screenMoveSelect}];
  opts.push({label:'🎒 道具', action:screenItemSelect});
  if(b.mode==='wild'){
    opts.push({label:`🎯 捕捉（丟出精靈球，剩 ${state.bag.pokeball}）`, action:tryCatch});
    opts.push({label:"🏃 逃跑", action:tryFlee});
  }
  if(state.party.filter(m=>m.hp>0).length>1) opts.push({label:'🔄 換上場的寶可夢', action:screenSwitch});
  if(b.mode==='legendary') print('<span class="sys">（神獸戰無法逃跑，也無法用精靈球——擊敗牠就能收服）</span>');
  else if(b.mode==='tower') print('<span class="sys">（塔內不能捕捉也不能逃跑，輸了會被送出塔外）</span>');
  setOptions(opts);
}
function screenMoveSelect(){
  const b = state.battle;
  const p = state.party[b.playerIdx];
  clearLog();
  renderBar();
  hpBars(p, b.wild);
  print('選擇招式：');
  const moveOpts = p.moves.map((mv,i)=>{
    const fx = STATUS_FX[mv.type];
    let fxTag = fx ? `　✦${ {burn:'灼傷',poison:'中毒',paralyze:'麻痺',drain:'吸血',atkDown:'降攻',defDown:'降防',selfDefUp:'升防'}[fx.kind] }` : '';
    if(mv.recoil) fxTag += '　⚠反作用力';
    return { label:`${mv.name}（${mv.type}／威力${mv.power}${fxTag}）`, action:()=>playerMove(i) };
  });
  moveOpts.push({label:'← 返回', action:toBattle});
  setOptions(moveOpts);
}
function hpBars(p, w){
  const pp = Math.max(0, Math.round(100*p.hp/p.maxhp));
  const wp = Math.max(0, Math.round(100*w.hp/w.maxhp));
  print(`我方 ${nm(p)} Lv.${p.level}　HP ${p.hp}/${p.maxhp}　速度 ${p.spd}${statusTag(p)}`);
  print(`<div class="hpwrap"><div class="hpfill" style="width:${pp}%"></div></div>`);
  print(`敵方 ${nm(w)} Lv.${w.level}　HP ${w.hp}/${w.maxhp}　速度 ${w.spd}${statusTag(w)}`);
  print(`<div class="hpwrap"><div class="hpfill" style="width:${wp}%;background:${wp<30?'var(--danger)':'var(--accent2)'}"></div></div>`);
}
function randomWildMove(w){ return w.moves[Math.floor(Math.random()*w.moves.length)]; }
function clearBattleModifiers(){ state.party.forEach(m=>{ m.status=null; m.atkMul=1; m.defMul=1; }); }
function effText(mult){
  if(mult >= 1.5) return ' <span class="good">效果絕佳！</span>';
  if(mult <= 0.7) return ' <span class="bad">效果不好...</span>';
  return '';
}
function dmg(atkMon, defMon, move){
  const stab = typesOf(atkMon).includes(move.type) ? 1.3 : 1.0;
  const e = eff(move.type, typesOf(defMon));
  const variance = 0.85 + Math.random()*0.3;
  const atkStat = atkMon.atk * (atkMon.atkMul||1);
  const defStat = Math.max(1, defMon.def * (defMon.defMul||1));
  const raw = ((2*atkMon.level/5+2)*move.power*(atkStat/defStat)/50 + 2);
  return Math.max(1, Math.floor(raw*stab*e*variance));
}
function effSpd(m){ return m.spd * (m.status==='paralyze' ? 0.5 : 1); }
// 單次出招：處理麻痺、傷害、反作用力、吸血、附加效果
function doAttack(att, def, move){
  if(att.status==='paralyze' && Math.random()<0.25){
    print(`<span class="bad">${who(att)} 因麻痺而無法動彈！</span>`);
    return;
  }
  const isEnemy = att === state.battle.wild;
  const d = dmg(att, def, move);
  def.hp = Math.max(0, def.hp - d);
  print(`${who(att)} 使用了 ${esc(move.name)}！造成 <span class="${isEnemy?'bad':'em'}">${d}</span> 點傷害。${effText(eff(move.type, typesOf(def)))}`);
  if(move.recoil){
    const rec = Math.max(1, Math.floor(d*move.recoil));
    att.hp = Math.max(0, att.hp-rec);
    print(`<span class="bad">${who(att)} 因反作用力受到了 ${rec} 點傷害！</span>`);
  }
  const fx = STATUS_FX[move.type];
  if(fx && fx.kind==='drain'){
    const heal = Math.floor(d*0.5);
    if(heal>0 && att.hp>0 && att.hp<att.maxhp){ att.hp=Math.min(att.maxhp, att.hp+heal); print(`<span class="good">${who(att)} 吸取了 ${heal} 點 HP！</span>`); }
  } else if(def.hp>0 || (fx && fx.kind==='selfDefUp')){
    const msg = applyMoveEffect(att, def, move);
    if(msg) print(msg);
  }
}
// 回傳 true 代表戰鬥已結束或已切換畫面
function checkBattleEnd(){
  const b = state.battle; const p = state.party[b.playerIdx]; const w = b.wild;
  if(w.hp<=0){
    if(p.hp<=0) print(`<span class="bad">${nm(p)} 也在同一擊中倒下了！</span>`);
    winBattle(); return true;
  }
  if(p.hp<=0){ afterFaintCheck(p); return true; }
  return false;
}
function enemyTurn(){
  const b = state.battle;
  doAttack(b.wild, state.party[b.playerIdx], randomWildMove(b.wild));
  return checkBattleEnd();
}
function endOfTurn(){
  const b = state.battle; const p = state.party[b.playerIdx]; const w = b.wild;
  const tW = tickStatus(w); if(tW) print(tW);
  if(w.hp<=0){ return winBattle(); }
  const tP = tickStatus(p); if(tP) print(tP);
  if(afterFaintCheck(p)) return;
  screenBattle();
}
function playerMove(moveIdx){
  const b = state.battle; const p = state.party[b.playerIdx]; const w = b.wild;
  clearLog();
  const pm = p.moves[moveIdx], wm = randomWildMove(w);
  const ps = effSpd(p), ws = effSpd(w);
  const playerFirst = ps > ws || (ps === ws && Math.random() < 0.5);
  const order = playerFirst ? [[p,w,pm],[w,p,wm]] : [[w,p,wm],[p,w,pm]];
  for(const [a,d,m] of order){
    if(a.hp<=0 || d.hp<=0) continue;
    doAttack(a, d, m);
    if(checkBattleEnd()) return;
  }
  endOfTurn();
}
function tryCatch(){
  const b = state.battle; const w = b.wild;
  clearLog();
  if(state.bag.pokeball<=0){
    print('<span class="bad">精靈球用完了！去商店補貨吧。</span>');
    return screenBattle();
  }
  state.bag.pokeball--;
  const hpRatio = w.hp/w.maxhp;
  const chance = Math.min(0.92, (1-hpRatio)*0.75 + 0.15);
  print(`你對 ${nm(w)} 丟出了精靈球……`);
  if(Math.random() < chance){
    state.caught.add(w.dex);
    if(w.shiny) state.shinyCaught.add(w.dex);
    print(`<span class="good">抓到了！${nm(w)} 已加入圖鑑！</span>`);
    if(state.party.length<6){ state.party.push(w); print('它加入了你的隊伍！'); }
    else { state.box.push(w); print('隊伍已滿，它被送到了倉庫。'); }
    const activeMon = state.party[b.playerIdx];
    if(activeMon && activeMon.hp>0 && activeMon!==w) grantExp(activeMon, w.level, 0.5, '因為成功捕捉獲得');
    state.battle=null;
    return screenField();
  }
  print('<span class="bad">牠掙脫了！</span>');
  if(enemyTurn()) return;
  endOfTurn();
}
function screenItemSelect(){
  const b = state.battle; const p = state.party[b.playerIdx];
  clearLog(); renderBar(); hpBars(p, b.wild);
  print('選擇要使用的道具：');
  const opts = [];
  Object.keys(ITEMS).forEach(kind=>{
    const it = ITEMS[kind];
    if(kind==='pokeball' || !(state.bag[kind] > 0)) return;
    const relevant = it.heal ? p.hp < p.maxhp : p.status === it.cure;
    if(relevant) opts.push({label:`${it.label}：${it.desc}（剩 ${state.bag[kind]}）`, action:()=>useItem(kind)});
  });
  if(opts.length===0) print('<span class="sys">（目前沒有能用的道具）</span>');
  opts.push({label:'← 返回', action:toBattle});
  setOptions(opts);
}
function useItem(kind){
  const b = state.battle; const p = state.party[b.playerIdx];
  const it = ITEMS[kind];
  clearLog();
  if(!it || !(state.bag[kind]>0)){ print('<span class="bad">道具用完了！</span>'); return screenBattle(); }
  state.bag[kind]--;
  if(it.heal){
    const before = p.hp;
    p.hp = Math.min(p.maxhp, p.hp + it.heal);
    print(`<span class="good">使用了${it.label}，${nm(p)} 回復了 ${p.hp-before} 點 HP。</span>`);
  } else {
    p.status = null;
    print(`<span class="good">使用了${it.label}，${nm(p)} 的異常狀態治好了！</span>`);
  }
  if(enemyTurn()) return;
  endOfTurn();
}
function tryFlee(){
  clearLog();
  if(Math.random()<0.75){
    print('你成功逃跑了。');
    state.battle=null;
    return screenField();
  }
  print('<span class="bad">沒能逃脫！</span>');
  if(enemyTurn()) return;
  endOfTurn();
}
function screenSwitch(){
  const b = state.battle;
  clearLog();
  print('<span class="em">選擇要換上場的寶可夢：</span>');
  const opts = state.party.map((m,i)=>{
    const tag = i===b.playerIdx ? '（目前上場）' : (m.hp<=0 ? '（已無法戰鬥）' : `HP ${m.hp}/${m.maxhp}`);
    const usable = i!==b.playerIdx && m.hp>0;
    return { label:`${monName(m)} Lv.${m.level} ${tag}`, action: usable ? ()=>doSwitch(i) : screenSwitch };
  });
  opts.push({label:'取消，返回戰鬥', action:toBattle});
  setOptions(opts);
}
function doSwitch(idx){
  const b = state.battle;
  const old = state.party[b.playerIdx];
  b.playerIdx = idx;
  clearLog();
  print(`收回了 ${nm(old)}，換上 ${nm(state.party[idx])}！`);
  if(enemyTurn()) return;
  endOfTurn();
}
function evolveIfReady(p){
  const rule = EVO[p.dex];
  if(!rule) return;
  let [toIdx, lvl] = rule;
  if(p.level < lvl) return;
  if(Array.isArray(toIdx)) toIdx = toIdx[Math.floor(Math.random()*toIdx.length)]; // 伊布：隨機進化成三種之一
  const oldName = monName(p);
  const e = DEX[toIdx];
  p.dex = toIdx; p.name = e[0]; p.t1 = e[1]; p.t2 = e[2]; p.tier = e[3];
  const st = statsFor(e, p.level);
  const hpGain = st.hp - p.maxhp;
  p.maxhp = st.hp; p.hp = Math.max(1, Math.min(p.maxhp, p.hp + hpGain));
  p.atk = st.atk; p.def = st.def; p.spd = st.spd;
  p.moves = buildMoves(e);
  state.caught.add(toIdx); state.seen.add(toIdx);
  if(p.shiny) state.shinyCaught.add(toIdx);
  print(`<span class="em">✦ ${esc(oldName)} 進化成了 ${nm(p)}！</span>`);
}
function grantExp(p, oppLevel, mult, verb){
  if(p.level >= MAX_LEVEL){
    p.exp = 0;
    print(`<span class="sys">${nm(p)} 已經是 Lv.${MAX_LEVEL}，經驗值無法再增加。</span>`);
    return;
  }
  const gained = Math.max(1, Math.floor((10 + oppLevel*4) * mult));
  p.exp += gained;
  print(`<span class="good">${nm(p)} ${verb} ${gained} 經驗值。</span>`);
  while(p.level < MAX_LEVEL && p.exp >= p.expNext){
    p.exp -= p.expNext; p.level++; p.expNext = 18 + p.level*9;
    const st = statsFor(DEX[p.dex], p.level);
    const gainHp = st.hp-p.maxhp;
    p.maxhp=st.hp; p.hp=Math.min(p.hp+gainHp, p.maxhp); p.atk=st.atk; p.def=st.def; p.spd=st.spd;
    print(`<span class="em">${nm(p)} 升到了 Lv.${p.level}！</span>`);
    evolveIfReady(p);
  }
  if(p.level >= MAX_LEVEL){ p.exp = 0; print(`<span class="em">${nm(p)} 達到等級上限 Lv.${MAX_LEVEL}！</span>`); }
}
function giveMoney(amount){
  state.money += amount;
  print(`<span class="good">獲得了 💰 ${amount}！（目前 ${state.money}）</span>`);
}
function winBattle(){
  const b = state.battle; const p = state.party[b.playerIdx]; const w = b.wild;
  const mode = b.mode;
  print(`<span class="good">擊敗了${mode==='wild'?'野生的 ':' '}${nm(w)}！</span>`);
  const expMul = (mode==='tower') ? TOWER_EXP_MUL : 1;
  if(p.hp>0) grantExp(p, w.level, expMul, '獲得');
  state.battle=null;

  if(mode==='tower'){
    const t = state.tower;
    giveMoney(w.level * 10 * (b.boss ? 3 : 1));
    t.coins++;
    if(b.endless){
      t.endlessPtr++;
      if(t.endlessPtr >= BOSSES.length){ t.endlessPtr = 0; t.loop++; print(`<span class="boss">無盡小魔王第 ${t.loop} 輪完成！下一輪能力再提升。</span>`); }
    } else {
      t.floorPtr++;
    }
    print(`<span class="good">🪙 ${b.boss?'小魔王擊破':'樓層突破'}！獲得 1 枚硬幣（目前 ${t.coins} 枚）</span>`);
    if(b.boss){
      fullHeal();
      print('<span class="good">小魔王倒下時留下了一道光，你的隊伍全部回滿了！現在可以返回地面。</span>');
    }
    if(!b.endless && t.floorPtr === NONLEG.length){
      print('<span class="boss">塔內 146 層全數突破！接下來會依圖鑑順序不斷出現小魔王。</span>');
    }
    return screenTower();
  }
  if(mode==='legendary'){
    giveMoney(w.level * 20);
    w.hp = w.maxhp; w.status=null; w.atkMul=1; w.defMul=1;
    state.caught.add(w.dex); state.seen.add(w.dex);
    if(w.shiny) state.shinyCaught.add(w.dex);
    if(state.party.length<6){ state.party.push(w); print(`<span class="good">✦ ${nm(w)} 被你的實力降服，加入了隊伍！</span>`); }
    else { state.box.push(w); print(`<span class="good">✦ ${nm(w)} 被降服，送往了倉庫！</span>`); }
    state.tower.legendaryPtr++;
    return screenTower();
  }
  giveMoney(w.level * 10);
  screenField();
}
function loseBattle(){
  print('<span class="bad">你的隊伍全部失去戰鬥能力了……你被送回了補給站。</span>');
  state.party.forEach(m=>{ m.hp=Math.max(1, Math.floor(m.maxhp*0.5)); m.status=null; });
  const mode = state.battle && state.battle.mode;
  state.battle=null;
  if(mode==='tower' || mode==='legendary') return kickOutOfTower();
  screenField();
}

/* ---------- PARTY / BAG / DEX ---------- */
function screenParty(back){
  back = (typeof back === 'function') ? back : toField;
  clearLog();
  print('<span class="em">— 隊伍 —</span>');
  print('<span class="sys">隊長（1號位）會優先上場戰鬥。點下方「設為隊長」可免費調整順序，不會浪費戰鬥中的一回合。</span>');
  hr();
  if(state.party.length===0) print('（空）');
  state.party.forEach((m,i)=>{
    const expTxt = m.level>=MAX_LEVEL ? 'EXP MAX' : `EXP ${m.exp}/${m.expNext}`;
    const leadTag = i===0 ? ' <span class="em">★隊長</span>' : '';
    print(`${i+1}. ${nm(m)}${leadTag}  Lv.${m.level}  HP ${m.hp}/${m.maxhp}  屬性:${typeStr(m)}  速度 ${m.spd}  ${expTxt}${statusTag(m)}`);
  });
  if(state.box.length){
    hr(); print(`倉庫中還有 ${state.box.length} 隻寶可夢。`);
  }
  const opts=[];
  state.party.forEach((m,i)=>{
    if(i>0) opts.push({label:`★ 設為隊長：${monName(m)}`, action:()=>setLeader(i, back)});
  });
  if(state.party.length>1) opts.push({label:"📦 放生一隻到倉庫", action:()=>screenReleaseSelect(back)});
  opts.push({label:`📦 查看倉庫（${state.box.length}）`, action:()=>screenBox(back)});
  opts.push({label:"返回", action:back});
  setOptions(opts);
}
function setLeader(idx, back){
  if(idx<=0 || idx>=state.party.length) return screenParty(back);
  const [m] = state.party.splice(idx,1);
  state.party.unshift(m);
  saveGame();
  clearLog();
  print(`<span class="good">★ ${nm(m)} 成為新的隊長！下次戰鬥會由牠先上場，不需要浪費回合切換。</span>`);
  screenParty(back);
}
function screenReleaseSelect(back){
  clearLog();
  print('<span class="em">選擇要送去倉庫的寶可夢（隊伍至少要留一隻）：</span>');
  const opts = state.party.map((m,i)=>({
    label:`${monName(m)} Lv.${m.level}${i===0?'（目前隊長）':''}`,
    action:()=>releaseToBox(i, back)
  }));
  opts.push({label:"取消，返回", action:()=>screenParty(back)});
  setOptions(opts);
}
function releaseToBox(idx, back){
  if(state.party.length<=1){
    clearLog(); print('<span class="bad">隊伍至少要留一隻寶可夢，無法再送走了！</span>');
    return screenParty(back);
  }
  const [m] = state.party.splice(idx,1);
  state.box.push(m);
  saveGame();
  clearLog();
  print(`<span class="sys">${nm(m)} 被送去了倉庫，隨時可以再拉回隊伍。</span>`);
  screenParty(back);
}
function screenBox(back){
  clearLog();
  print(`<span class="em">— 倉庫 —</span>　共 ${state.box.length} 隻`);
  if(state.box.length===0) print('（空，抓到超過 6 隻時才會送來這裡）');
  hr();
  const opts=[];
  state.box.forEach((m,i)=>{
    print(`${i+1}. ${nm(m)}  Lv.${m.level}  HP ${m.hp}/${m.maxhp}  屬性:${typeStr(m)}${statusTag(m)}`);
    if(state.party.length<6){
      opts.push({label:`⬆ 拉回隊伍：${monName(m)}`, action:()=>withdrawFromBox(i, back)});
    } else {
      opts.push({label:`🔁 與隊伍交換：${monName(m)}`, action:()=>screenSwapSelect(i, back)});
    }
  });
  opts.push({label:"返回隊伍畫面", action:()=>screenParty(back)});
  setOptions(opts);
}
function withdrawFromBox(boxIdx, back){
  if(state.party.length>=6){ clearLog(); print('<span class="bad">隊伍已滿了！</span>'); return screenBox(back); }
  const [m] = state.box.splice(boxIdx,1);
  state.party.push(m);
  saveGame();
  clearLog();
  print(`<span class="good">${nm(m)} 加入了隊伍！</span>`);
  screenBox(back);
}
function screenSwapSelect(boxIdx, back){
  clearLog();
  const boxMon = state.box[boxIdx];
  print(`<span class="em">隊伍已滿。選擇要與 ${monName(boxMon)} 交換的隊伍成員：</span>`);
  const opts = state.party.map((m,i)=>({
    label:`${monName(m)} Lv.${m.level}${i===0?'（目前隊長）':''}`,
    action:()=>doSwapWithBox(boxIdx, i, back)
  }));
  opts.push({label:"取消，返回倉庫", action:()=>screenBox(back)});
  setOptions(opts);
}
function doSwapWithBox(boxIdx, partyIdx, back){
  const boxMon = state.box[boxIdx];
  const partyMon = state.party[partyIdx];
  state.box[boxIdx] = partyMon;
  state.party[partyIdx] = boxMon;
  saveGame();
  clearLog();
  print(`<span class="good">${nm(partyMon)} 與 ${nm(boxMon)} 交換了！</span>`);
  screenBox(back);
}
function screenBag(){
  clearLog();
  print('<span class="em">— 背包 —</span>');
  print(`💰 ${state.money}　🪙 ${state.tower.coins}`);
  hr();
  Object.keys(ITEMS).forEach(k=>{
    const it = ITEMS[k];
    print(`${it.label} x${state.bag[k]||0}　${it.desc}`);
  });
  hr();
  print('<span class="sys">道具不夠的話到商店購買，打倒寶可夢就能賺錢。</span>');
  setOptions([
    {label:"去商店", action:()=>{ shopQty=1; screenShop(); }},
    {label:"返回", action:toField}
  ]);
}
let dexPage=0;
function screenDex(){
  clearLog();
  print(`<span class="em">— 全國圖鑑（第一世代）—</span>　已捕捉 ${state.caught.size} / 151　✨ 色違 ${state.shinyCaught.size}`);
  hr();
  const perPage=15;
  const start=dexPage*perPage;
  for(let i=start;i<Math.min(start+perPage,151);i++){
    const e=DEX[i];
    const no=String(i+1).padStart(3,'0');
    const shinyMark = state.shinyCaught.has(i) ? ' <span class="shiny">✨</span>' : '';
    if(state.caught.has(i)) print(`#${no} <span class="good">${esc(e[0])}</span>　${e[2]?e[1]+'／'+e[2]:e[1]}${shinyMark}`);
    else if(state.seen.has(i)) print(`#${no} <span class="sys">${esc(e[0])}（已見過，尚未捕捉）</span>`);
    else print(`#${no} <span class="sys">？？？</span>`);
  }
  const opts=[];
  if(start+perPage<151) opts.push({label:"下一頁", action:()=>{dexPage++; screenDex();}});
  if(dexPage>0) opts.push({label:"上一頁", action:()=>{dexPage--; screenDex();}});
  opts.push({label:"返回", action:()=>{dexPage=0; toField();}});
  setOptions(opts);
}

/* ---------- BOOT ---------- */
if(loadGame()){ screenContinue(); } else { screenTitle(); }
</script>
