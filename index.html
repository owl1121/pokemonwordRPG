/* ---------- MONTHLY CHECK-IN ---------- */
let nowFn = () => new Date();
function checkinReward(n){ return CHECKIN_MILESTONE[n] || CHECKIN_BASE[n % 4]; }
function checkinNow(){
  const d = nowFn(), ym = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  if(state.checkin.ym !== ym) state.checkin = {ym, days:[]}; // 每月重置
  return {ym, day:d.getDate(), dim:new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(), first:new Date(d.getFullYear(), d.getMonth(), 1).getDay(), month:d.getMonth()+1};
}
function canCheckin(){ const t = checkinNow(); return !state.checkin.days.includes(t.day); }
function doCheckin(){
  const t = checkinNow(); if(state.checkin.days.includes(t.day)) return;
  state.checkin.days.push(t.day);
  const n = state.checkin.days.length, r = checkinReward(n);
  giveReward(r); bump('checkins'); saveGame();
  notify(`📅 簽到成功（本月第 ${n} 天）：${rewardText(r)}`); openMenu('checkin'); refreshMenuDot();
}
function checkinHtml(){
  const t = checkinNow(), got = state.checkin.days, n = got.length, next = checkinReward(n+1);
  let h = `<div class="mh">${t.month} 月簽到　本月已簽 ${n} 天（每月 1 號重置，不能補簽）</div>`;
  h += canCheckin() ? `<button class="bigclaim" onclick="doCheckin()">✅ 今日簽到　可得：${esc(rewardText(next))}</button>` : `<button class="bigclaim off" disabled>今天已簽到 ✔　明天可得：${esc(rewardText(next))}</button>`;
  h += '<div class="cal">' + ['日','一','二','三','四','五','六'].map(x=>`<div class="wd">${x}</div>`).join('');
  for(let i=0;i<t.first;i++) h += '<div class="day blank"></div>';
  for(let d=1; d<=t.dim; d++) h += `<div class="day${got.includes(d)?' on':''}${d===t.day?' today':''}">${got.includes(d)?'✓':d}</div>`;
  h += '</div><div class="mh">累計簽到獎勵</div>';
  Object.keys(CHECKIN_MILESTONE).forEach(k=>{
    h += `<div class="qi${n>=k?' done':''}"><div class="qrow"><span>${k} 天：${esc(rewardText(CHECKIN_MILESTONE[k]))}</span><span>${n>=k?'✅':`還差 ${k-n} 天`}</span></div></div>`;
  });
  return h + '<div style="color:var(--dim);font-size:12px">其他天數：輪流領 💰500／💰300／精靈球×5／藥水×3</div>';
}

function giveShinyDraw(n){
  const got = [];
  for(let i=0;i<n;i++){
    const idx = Math.floor(Math.random()*DEX.length);
    const m = makeMon(idx, SHINY_GIFT_LEVEL, {shiny:true});
    m.ball = 'poke';
    state.caught.add(idx); state.seen.add(idx); state.shinyCaught.add(idx);
    if(state.party.length < 6) state.party.push(m); else state.box.push(m);
    got.push(`✨${m.name}${state.party.includes(m) ? '' : '（已送倉庫）'}`);
  }
  return got;
}
const SHINY_GIFT_LEVEL = 1;
function giveReward(r){
  const out = [];
  if(r.money) state.money += r.money;
  if(r.title) grantTitle(r.title);
  Object.keys(r.items||{}).forEach(k=>{ state.bag[k] = (state.bag[k]||0) + r.items[k]; });
  if(r.shiny) out.push(...giveShinyDraw(r.shiny));
  return out;
}
function rewardText(r){ return [r.shiny?`✨ 隨機色違寶可夢 ×${r.shiny}`:'', r.money?`💰 ${r.money}`:'', r.title&&EXTRA_TITLES[r.title]?`🎖 稱號「${EXTRA_TITLES[r.title]}」`:'', ...Object.keys(r.items||{}).map(k=>`${ITEMS[k].label} ×${r.items[k]}`)].filter(Boolean).join('、'); }
function questProg(q){ return Math.max(0, (state.stats[q.key]||0) - (state.quest.base[q.id]||0)); }
function claimQuest(id){
  const q = QUESTS.find(x=>x.id===id); if(!q || questProg(q) < q.target) return;
  state.quest.base[id] = (state.quest.base[id]||0) + q.target;
  giveReward(q.reward); saveGame(); notify('📜 任務完成！獲得 '+rewardText(q.reward)); openMenu('quest'); refreshMenuDot();
}

/* ---------- 寶可夢稱號：每隻寶可夢累計打出 1 萬／10 萬／100 萬傷害，解鎖「XX愛好者／專家／大師」 ---------- */
const PTITLE_STEPS = [[10000,'愛好者','1萬'],[100000,'專家','10萬'],[1000000,'大師','100萬']];
function pdmgMap(){ if(!state.stats.pd || typeof state.stats.pd !== 'object') state.stats.pd = {}; return state.stats.pd; }
function pdmgOf(dex){ return pdmgMap()[dex] || 0; }
function ptitleName(dex, t){ return DEX[dex][0] + PTITLE_STEPS[t][1]; }
function ptitleUnlocked(dex, t){ return pdmgOf(dex) >= PTITLE_STEPS[t][0]; }
function trackDmg(mon, d){
  if(!mon || mon.dex === undefined || !DEX[mon.dex] || !(d > 0)) return;
  const m = pdmgMap(), before = m[mon.dex] || 0, after = before + d;
  m[mon.dex] = after;
  for(let t = 0; t < PTITLE_STEPS.length; t++) if(before < PTITLE_STEPS[t][0] && after >= PTITLE_STEPS[t][0]) notify(`🏅 解鎖寶可夢稱號「${ptitleName(mon.dex, t)}」`);
}
function curPTitle(){
  const k = state.profile.pTitle; if(!k) return null;
  const [d, t] = String(k).split(':').map(Number);
  return (DEX[d] && PTITLE_STEPS[t] && ptitleUnlocked(d, t)) ? ptitleName(d, t) : null;
}
function equipPTitle(dex, t){
  if(!ptitleUnlocked(dex, t)) return;
  state.profile.pTitle = dex + ':' + t; state.profile.titleId = '';
  if(state.party.length) saveGame();
  renderHeader(); openMenu('ptitle'); notify('🏅 已裝備稱號：' + ptitleName(dex, t));
}
const ptView = {mode:'prog', page:0, q:''};
const PT_PER = 15;
function ptSet(k, v){ ptView[k] = v; if(k !== 'page') ptView.page = 0; openMenu('ptitle'); mbodyEl.scrollTop = 0; }
function ptitleHtml(){
  const fmt = n => n.toLocaleString('en-US');
  let got = 0; for(let i = 0; i < DEX.length; i++) for(let t = 0; t < 3; t++) if(ptitleUnlocked(i, t)) got++;
  const cur = curPTitle();
  let h = `<div class="mh">已解鎖 ${got} / ${DEX.length*3} 個稱號${cur ? '　目前裝備：🏅 ' + esc(cur) : ''}</div>`;
  h += '<div class="sub" style="margin:-4px 0 8px;opacity:.8">用同一隻寶可夢累計打出 1 萬／10 萬／100 萬傷害就能解鎖（進化後算新的那隻，Mega 算原本那隻）。</div>';
  h += `<div class="ptbar"><button class="claim${ptView.mode==='prog'?'':' off'}" onclick="ptSet('mode','prog')">有進度的</button><button class="claim${ptView.mode==='all'?'':' off'}" onclick="ptSet('mode','all')">全部</button><input type="text" placeholder="搜尋名字" value="${esc(ptView.q).replace(/"/g,'&quot;')}" onchange="ptSet('q', this.value.trim())"></div>`;
  let list = [];
  for(let i = 0; i < DEX.length; i++){
    if(ptView.mode === 'prog' && !pdmgOf(i)) continue;
    if(ptView.q && !DEX[i][0].includes(ptView.q)) continue;
    list.push(i);
  }
  if(ptView.mode === 'prog') list.sort((a, b) => pdmgOf(b) - pdmgOf(a) || a - b);
  const pages = Math.max(1, Math.ceil(list.length / PT_PER));
  if(ptView.page >= pages) ptView.page = pages - 1;
  if(!list.length) h += `<div style="color:var(--dim)">${ptView.q ? '找不到符合的寶可夢。' : '還沒有任何進度，去打幾場吧！'}</div>`;
  list.slice(ptView.page * PT_PER, (ptView.page + 1) * PT_PER).forEach(i => {
    const v = pdmgOf(i), next = PTITLE_STEPS.find(s => v < s[0]);
    const cells = PTITLE_STEPS.map((s, t) => {
      if(!ptitleUnlocked(i, t)) return `<span class="lk">🔒 ${s[1]}<br>${s[2]}</span>`;
      return state.profile.pTitle === i + ':' + t && cur ? `<span class="on">✅ ${s[1]}</span>` : `<button class="claim" onclick="equipPTitle(${i},${t})">${s[1]}</button>`;
    }).join('');
    h += `<div class="qi ptrow${v >= PTITLE_STEPS[0][0] ? ' done' : ''}"><div>${dexNo(i)} ${esc(DEX[i][0])}　<span style="color:var(--accent)">累計 ${fmt(v)}</span></div>`
       + (next ? `<div class="qbar"><i style="width:${Math.min(100, Math.round(100 * v / next[0]))}%"></i></div><small>下一個：${esc(ptitleName(i, PTITLE_STEPS.indexOf(next)))}（${fmt(v)} / ${fmt(next[0])}）</small>` : '<small>三個稱號都拿到了 🎉</small>')
       + `<div class="qrow" style="margin-top:6px">${cells}</div></div>`;
  });
  if(pages > 1){
    h += `<div class="ptbar" style="justify-content:space-between;margin-top:6px"><button class="claim${ptView.page?'':' off'}" onclick="ptSet('page',${Math.max(0, ptView.page-1)})">◀ 上一頁</button><span>${ptView.page+1} / ${pages}</span><button class="claim${ptView.page<pages-1?'':' off'}" onclick="ptSet('page',${Math.min(pages-1, ptView.page+1)})">下一頁 ▶</button></div>`;
  }
  return h;
}
function curTitle(){
  const pt = curPTitle(); if(pt) return pt;

  if(id && hasExtraTitle(id)) return EXTRA_TITLES[id];
  return (id && state.ach.done.includes(id) && TITLE_OF[id]) || DEFAULT_TITLE;
}

function achPoints(){ return ACH.filter(a=>state.ach.done.includes(a.id)).reduce((n,a)=>n+a.pts,0); }
function checkAch(){
  ACH.forEach(a=>{ if(!state.ach.done.includes(a.id) && a.cur() >= a.target){ state.ach.done.push(a.id); notify(`🏆 成就解鎖：${a.name}（+${a.pts} 點）${TITLE_OF[a.id]?'，解鎖稱號「'+TITLE_OF[a.id]+'」':''}`); } });
}
function claimMilestone(pts){
  const m = MILESTONES.find(x=>x.pts===pts);
  if(!m || achPoints() < pts || state.ach.claimed.includes(pts)) return;
  state.ach.claimed.push(pts); giveReward(m.reward); saveGame(); notify('🏆 領取成就獎勵：'+rewardText(m.reward)); openMenu('ach'); refreshMenuDot();
}
function hasClaimable(){
  return canCheckin() || QUESTS.some(q=>questProg(q)>=q.target) || MILESTONES.some(m=>achPoints()>=m.pts && !state.ach.claimed.includes(m.pts));
}
function refreshMenuDot(){
  checkAch(); renderHeader(); festTick(); mailTick();
  dotEl.classList.toggle('on', !!hasClaimable());                       // ☰ 選單：任務／成就／簽到可領
  document.getElementById('evDot').classList.toggle('on', !!festClaimable());    // 🎉 活動：有任務可領
  document.getElementById('mailDot').classList.toggle('on', !!mailAttention());  // ✉️ 信箱：有未讀信或沒領的附件
}
function profileHtml(){
  const p = state.profile, st = state.stats, lead = state.party[0];
  const done = state.ach.done, cur = curTitle();
  let h = `<div class="pcard"><div class="pav">${esc(Array.from(p.name||'?')[0])}</div><div class="pinfo"><div class="pname">${esc(p.name||'（未命名）')}</div><div class="ptitle">🎖 ${esc(cur)}</div></div><button class="claim" onclick="renameFromProfile()">✏️ 改名</button></div>`;
  const cell = (k,v)=>`<div class="qi"><small>${k}</small>${v}</div>`;
  h += '<div class="pstat">'
    + cell('隊長', lead ? esc(lead.name)+' Lv.'+lead.level : '—')
    + cell('所在地', esc(zoneName(state.zone)))
    + cell('勝場', st.wins||0)
    + cell('捕捉數', st.catches||0)
    + cell('圖鑑', state.caught.size+' / '+DEX.length)
    + cell('✨ 色違', state.shinyCaught.size)
    + cell('道館徽章', state.meta.badges+' / '+GYMS.length)
    + cell('塔層通過', st.floors||0)
    + cell('小魔王擊破', st.bosses||0)
    + cell('成就點數', achPoints())
    + '</div>';
  h += `<button class="bigclaim" onclick="openDexFromProfile()">📖 開啟圖鑑（${state.caught.size} / ${DEX.length}）</button>`;
  h += diffHtml();   // 難度（league.js）
  h += '<div class="mh">🎴 對戰邊框（顯示在我方寶可夢的卡片上）</div><div class="frgrid">';
  [['auto','依捕捉的球'],['none','無框'],['poke','精靈球'],['great','超級球'],['ultra','高級球'],['master','大師球']].forEach(([k,n])=>{
    const open = k==='auto' || frameUnlocked(k), on = (p.frame||'auto')===k;
    const sub = open ? (on?' ✓':'') : (()=>{ const [c,need]=frameProgress(k); return ` 🔒${c}/${need}`; })();
    h += `<button class="frbtn${on?' on':''}${open?'':' lock'}" onclick="setFrame('${k}')"><span class="frchip fr-${k}"></span><small>${n}${sub}</small></button>`;
  });
  h += '</div>';
  const locked = ['great','ultra','master'].filter(k=>!frameUnlocked(k));
  if(locked.length) h += '<div class="sub" style="margin:-4px 0 12px;opacity:.8">' + locked.map(k=>`🔒 ${FRAME_NAMES[k]}邊框：${FRAME_UNLOCK[k].text}`).join('<br>') + '</div>';
  if(typeof festThemeGrid === 'function') h += '<div class="mh">🖼 背景（完成節日活動就能解鎖更多）</div>' + festThemeGrid();
  h += '<div class="mh">🎖 稱號（裝備後會顯示在主頁左上角）</div>';
  const row = (id,name,hint)=>{
    const on = (id==='' ? cur===DEFAULT_TITLE : (id===p.titleId && cur===name));
    return `<div class="qi${on?' done':''}"><div class="qrow"><span>${esc(name)}</span>${on?'<span>✅ 使用中</span>':`<button class="claim" onclick="equipTitle('${id}')">裝備</button>`}</div></div>`;
  };
  h += row('', DEFAULT_TITLE);
  (p.titles||[]).filter(id=>EXTRA_TITLES[id]).forEach(id=>{ h += row(id, EXTRA_TITLES[id]); });
  const ids = Object.keys(TITLE_OF);
  ids.filter(id=>done.includes(id)).forEach(id=>{ h += row(id, TITLE_OF[id]); });
  ids.filter(id=>!done.includes(id)).forEach(id=>{
    const a = ACH.find(x=>x.id===id);
    h += `<div class="qi lock"><div>🔒 ${esc(TITLE_OF[id])}<small>解鎖條件：${esc(a?a.name+'（'+a.desc+'）':'')}</small></div></div>`;
  });
  return h;
}
function setFrame(k){
  if(k !== 'auto' && !frameUnlocked(k)){ const [c,need] = frameProgress(k); notify(`🔒 尚未解鎖：${FRAME_UNLOCK[k].text}（${c}/${need}）`); return; }
  state.profile.frame = k;
  if(state.party.length) saveGame();
  openMenu('profile'); notify('🎴 對戰邊框：' + (k==='auto' ? '依捕捉的球' : FRAME_NAMES[k]));
}
function equipTitle(id){
  if(id!=='' && !state.ach.done.includes(id) && !hasExtraTitle(id)) return;
  state.profile.titleId = id; state.profile.pTitle = '';
  if(state.party.length) saveGame();
  renderHeader(); openMenu('profile'); notify('🎖 已裝備稱號：'+curTitle());
}
function canLeaveScreen(){ return state.party.length>0 && !state.battle && !state.tower.inTower; }
function openDexFromProfile(){

  if(isRename) opts.push({label:'取消', action:toField});

function confirmName(next, isRename){

  if(!v){ print('<span class="bad">名字不能是空的喔。</span>'); return; }
  state.profile.name = v;
  if(state.party.length) saveGame();
  renderHeader();
  if(isRename){ notify('已改名為 '+v); toField(); } else next();
}
function closeMenu(){ modalEl.classList.remove('open'); }
function openMenu(tab){
  if(typeof tab === 'string') menuTab = tab;
  checkAch();
  const bar = (c,t)=>`<div class="qbar"><i style="width:${Math.min(100,Math.round(100*c/t))}%"></i></div>`;
  let h = '';
  if(menuTab==='profile'){
    h = profileHtml();
  } else if(menuTab==='ptitle'){
    h = ptitleHtml();
  } else if(menuTab==='stats'){
    h = statsHtml();
  } else if(menuTab==='checkin'){
    h = checkinHtml();
  } else if(menuTab==='quest'){
    h += '<div class="mh">可重複完成的任務，完成後可再次挑戰</div>';
    QUESTS.forEach(q=>{
      const c = questProg(q), ok = c >= q.target;
      h += `<div class="qi${ok?' done':''}"><div>${esc(q.name)}<small>獎勵：${esc(rewardText(q.reward))}</small></div>${bar(Math.min(c,q.target),q.target)}<div class="qrow"><span>${Math.min(c,q.target)} / ${q.target}</span>${ok?`<button class="claim" onclick="claimQuest('${q.id}')">領取</button>`:''}</div></div>`;
    });
  } else {
    const pts = achPoints();
    h += `<div class="mh">成就點數：${pts}</div>`;
    MILESTONES.forEach(m=>{
      const got = state.ach.claimed.includes(m.pts), can = pts >= m.pts && !got;
      h += `<div class="qi${can?' done':''}"><div class="qrow"><span>${m.pts} 點：${esc(rewardText(m.reward))}</span>${got?'<span>✅ 已領取</span>':can?`<button class="claim" onclick="claimMilestone(${m.pts})">領取</button>`:`<span style="color:var(--dim)">還差 ${m.pts-pts} 點</span>`}</div></div>`;
    });
    h += '<div class="mh" style="margin-top:12px">成就列表</div>';
    ACH.forEach(a=>{
      const done = state.ach.done.includes(a.id), c = Math.min(a.cur(), a.target);
      h += `<div class="qi${done?' done':''}"><div>${done?'✅ ':''}${esc(a.name)}　<span style="color:var(--accent)">+${a.pts} 點</span><small>${esc(a.desc)}</small><small>🎖 稱號：${esc(TITLE_OF[a.id]||'—')}</small></div>${done?'':bar(c,a.target)+`<div class="qrow"><span>${c} / ${a.target}</span></div>`}</div>`;
    });
  }
  mbodyEl.innerHTML = h;
  document.getElementById('tabProfile').className = 'tab' + (menuTab==='profile'?' on':'');
  document.getElementById('tabQuest').className = 'tab' + (menuTab==='quest'?' on':'');
  document.getElementById('tabAch').className = 'tab' + (menuTab==='ach'?' on':'');
  document.getElementById('tabCheckin').className = 'tab' + (menuTab==='checkin'?' on':'');
  document.getElementById('tabPTitle').className = 'tab wide' + (menuTab==='ptitle'?' on':'');
  document.getElementById('tabStats').className = 'tab wide' + (menuTab==='stats'?' on':'');
  modalEl.classList.add('open');
}

/* ---------- 內建瀏覽器提醒 ----------
   LINE／Facebook／Instagram 等 App 內建的瀏覽器，和 Safari／Chrome 的存檔是各自獨立的（網頁無法跨瀏覽器共用存檔）。
   偵測到時提醒玩家改用同一個瀏覽器玩，或用「存檔匯出／匯入」搬移進度。 */
function inAppName(){
  const ua = (navigator && navigator.userAgent) || '';
  if(/\bLine\//i.test(ua)) return 'LINE';
  if(/FBAN|FBAV|FB_IAB/.test(ua)) return 'Facebook';
  if(/Instagram/i.test(ua)) return 'Instagram';
  if(/MicroMessenger/i.test(ua)) return '微信';
  return null;
}
function showInAppNotice(){
  let name = null, dismissed = false;
  try{ name = inAppName(); dismissed = localStorage.getItem('inapp_ok') === '1'; }catch(e){}
  if(!name || dismissed || document.getElementById('inappBar')) return;
  const d = document.createElement('div'); d.id = 'inappBar';
  d.innerHTML = `<div>💡 你現在是用 <b>${name} 內建瀏覽器</b>開的。這裡的存檔和 Safari／Chrome <b>是分開的</b>！建議點右上角「⋯」→「用其他瀏覽器開啟」，之後都從同一個瀏覽器玩。想把這裡的進度搬過去，可以用「存檔匯出／匯入」。</div>`
    + `<div class="ib"><button id="inappBackup">💾 備份／搬移存檔</button><button id="inappOk">知道了</button></div>`;
  document.body.appendChild(d);
  document.getElementById('inappOk').onclick = ()=>{ try{ localStorage.setItem('inapp_ok','1'); }catch(e){} d.remove(); };
  document.getElementById('inappBackup').onclick = ()=>{ d.remove(); screenSaveIO(()=> state.party.length ? screenContinue() : screenCover()); };
}
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}   // 請瀏覽器盡量不要自動清掉存檔

/* ---------- BOOT ---------- */
loadGame();
preloadArtFor(state.party);   // 隊伍的外框圖趁空閒先載（其他的對戰時用到才載）
applyFestTheme();
screenCover();
showInAppNotice();
// 測試帳號：網址加 ?test 會載入 test-save.json（全圖鑑 Lv.100、能力點全滿、全部 Mega 進化石），覆蓋前會先確認
if(/[?&]test\b/.test(location.search)){
  fetch('test-save.json', {cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; return r.text(); })
    .then(t=>{ saveIOBack = ()=> state.party.length ? screenContinue() : screenCover(); stageImport(t); })
    .catch(()=> print('<span class="bad">讀不到 test-save.json。</span>'));
}
</script>

<script>
/* 音效掛勾：不改原本流程，只在關鍵函式外面包一層 */
(function(){
  function wrap(name, fn){ const o = window[name]; if(typeof o !== 'function') return; window[name] = function(){ return fn(o, this, arguments); }; }
  wrap('doAttack', (o,t,a)=>{
    const [att, def, mv] = a, hp0 = def.hp, d0 = curDelay ? curDelay() : 0, toMe = !(state.battle && def === state.battle.wild);
    const r = o.apply(t, a);
    let nm = 'miss';
    if(def.hp < hp0){ const m = moveEff(mv, def); nm = toMe ? 'hurt' : (m >= 2 ? 'strong' : (m < 1 ? 'weak' : 'hit')); if(toMe && m >= 2) nm = 'strong'; }
    SFX.play(nm, d0 || 0); return r;
  });
  wrap('tryCatch', (o,t,a)=>{
    const n0 = state.party.length + state.box.length;
    SFX.play('throw'); const r = o.apply(t, a);
    SFX.play(state.party.length + state.box.length > n0 ? 'catchok' : 'catchfail', 450); return r;
  });
  wrap('grantExp', (o,t,a)=>{ const p = a[0], l0 = p.level; const r = o.apply(t, a); if(p.level > l0) SFX.play('levelup', 250); return r; });
  wrap('evolveTo', (o,t,a)=>{ SFX.play('evolve'); return o.apply(t, a); });
  wrap('doMegaEvolve', (o,t,a)=>{ const r = o.apply(t, a); SFX.play('mega'); return r; });
  wrap('afterFaintCheck', (o,t,a)=>{ const r = o.apply(t, a); if(a[0].hp <= 0) SFX.play('faint', 200); return r; });
  wrap('winBattle', (o,t,a)=>{ SFX.play('win', 350); return o.apply(t, a); });
  wrap('loseBattle', (o,t,a)=>{ SFX.play('lose', 300); return o.apply(t, a); });
  wrap('notify', (o,t,a)=>{ SFX.play(/[🏆🎁🎴]|領取|解鎖|成就|獲得/.test(String(a[0])) ? 'reward' : 'blip'); return o.apply(t, a); });
  SFX.init();
})();
</script>
<script>
/* 按下去先陷 0.2 秒，再執行動作 */
(function(){
  const DELAY = 70;    // 按住多久（毫秒）
  const REBOUND = 60;  // 彈回動畫播多久才執行動作（毫秒）
  let pressLock = false;
  document.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if(!btn || btn._go) return;
    e.stopImmediatePropagation(); e.preventDefault();
    if(btn.closest('#opts.pending')){ if(!appEl.classList.contains('battle')) skipReveal(); return; }   // 動畫還在播：這一下只負責跳過動畫，不會誤觸看不到的選項
    if(pressLock) return;
    pressLock = true;
    btn.classList.add('pressed');
    setTimeout(function(){
      btn.classList.remove('pressed');
      btn.classList.add('bounce');          // 彈回來
      setTimeout(function(){
        btn.classList.remove('bounce');
        pressLock = false;
        btn._go = true; btn.click(); btn._go = false;
      }, REBOUND);
    }, DELAY);
  }, true);
})();
</script>
